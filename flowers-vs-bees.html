		}
		pr.x += pr.vx * dt;
		const c = Math.floor(pr.x) + 1;
		const cell = this.grid[pr.row] && this.grid[pr.row][c];
		if (cell && Math.abs(pr.x - (c - 0.5)) < 0.45) {
			const p = cell.main || cell.pad;
			if (p && p.def.kind !== "briar" && p.def.kind !== "burr") {
				if (pr.kind === "bigstinger") {
					this.flattenCell(pr.row, c);
					Audio.Sfx("thud");
					this.puff(c - 0.5, pr.row, 1, C(150, 60, 200));
				} else {
					p.hp -= pr.dmg;
					p.hurt = 0.15;
					if (p.hp <= 0) this.removePlant(p);
					Audio.Sfx("hit", 1.4);
				}
				return true;
			}
		}
		return pr.x < -1;
	}

	// ------------------------------------------------------------------ rollers (bowling)
	addRoller(def, c, r) {
		this.rollers.push({ def, x: c - 0.5, rowF: r, vr: 0, hits: new Set(), spin: 0, combo: 0 });
		Audio.Sfx("thud", 1.3);
	}
	updateRollers(dt) {
		for (let i = this.rollers.length - 1; i >= 0; i--) {
			const ro = this.rollers[i], def = ro.def;
			const spd = def.giant ? 2.0 : 2.6;
			ro.x += spd * dt;
			ro.spin += spd * dt * (def.giant ? 0.9 : 1.6) * Math.PI;
			ro.rowF += ro.vr * dt;
			if (ro.rowF < 1) { ro.rowF = 1; ro.vr = Math.abs(ro.vr); }
			if (ro.rowF > this.rows) { ro.rowF = this.rows; ro.vr = -Math.abs(ro.vr); }
			let gone = ro.x > 10.6;
			for (const b of this.bees) {
				if (!ro.hits.has(b) && this.targetable(b) && Math.abs(b.rowF - ro.rowF) < (def.giant ? 0.6 : 0.45) && Math.abs(b.x - ro.x) < (def.giant ? 0.9 : 0.55)) {
					ro.hits.add(b);
					if (def.explode) { this.explosion(ro.x, Math.floor(ro.rowF + 0.5), 1.5, def.dmg, C(255, 90, 30)); gone = true; break; }
					this.damageBee(b, def.dmg, {});
					Audio.Sfx("thud", 1.1);
					if (!def.giant) {
						ro.combo++;
						if (ro.vr === 0) {
							let dir = Math.random() < 0.5 ? -1 : 1;
							if (ro.rowF <= 1) dir = 1; else if (ro.rowF >= this.rows) dir = -1;
							ro.vr = dir * 2.4;
						} else ro.vr = -ro.vr;
						if (ro.combo >= 2) this.popup(ro.x, ro.rowF, 5, ro.combo + "x COMBO!", C(255, 220, 60));
					}
				}
			}
			if (gone) this.rollers.splice(i, 1);
		}
	}

	// ------------------------------------------------------------------ effects
	addFx(life, update, draw, done, init) {
		const f = Object.assign({ t: 0, life, update, draw, done }, init || {});
		this.fx.push(f);
		return f;
	}
	updateFx(dt) {
		for (let i = this.fx.length - 1; i >= 0; i--) {
			const f = this.fx[i];
			f.t += dt;
			const a = Math.min(1, f.t / f.life);
			f.a = a;
			if (f.update) f.update(f, a, dt);
			if (a >= 1) { if (f.done) f.done(); this.fx.splice(i, 1); }
		}
	}
	// draw something in stud space at a board position
	drawAt(x, row, y, scale, rot, alpha, fn) {
		const [sx, sy] = this.S(x, row, y);
		ctx.save();
		ctx.translate(sx, sy);
		const k = this.L.k * (scale || 1);
		ctx.scale(k, k);
		if (rot) ctx.rotate(rot);
		if (alpha !== undefined && alpha !== null) ctx.globalAlpha *= clamp(alpha, 0, 1);
		fn(ctx);
		ctx.restore();
	}
	ring(x, row, y, size, color, life) {
		this.addFx(life || 0.4, null, f => {
			const [sx, sy] = this.S(x, row, y);
			const r = (0.5 + size * f.a * 0.5) * this.L.k;
			ctx.save();
			ctx.globalAlpha = 0.7 * (1 - f.a);
			ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.55, 0, 0, Math.PI * 2);
			ctx.lineWidth = Math.max(2, this.L.k * 0.5); ctx.strokeStyle = rgb(color); ctx.stroke();
			ctx.restore();
		});
	}
	puff(x, row, y, color) {
		for (let i = 1; i <= 6; i++) {
			const a = i / 6 * Math.PI * 2;
			const dx = Math.cos(a), dz = Math.sin(a);
			this.addFx(0.45, null, f => {
				const t = f.a;
				const [sx, sy] = this.S(x + dx * t * 0.5, row + dz * t * 0.3, y + t * 2.8);
				ctx.save(); ctx.globalAlpha = 1 - t;
				ctx.beginPath(); ctx.arc(sx, sy, this.L.k * 0.45, 0, Math.PI * 2); ctx.fillStyle = rgb(color); ctx.fill();
				ctx.restore();
			});
		}
	}
	popup(x, row, y, text, color) {
		this.addFx(1.0, null, f => {
			const [sx, sy] = this.S(x, row, y + f.a * 4);
			ctx.save(); ctx.globalAlpha = 1 - f.a * f.a;
			ctx.font = `${Math.round(this.L.T * 0.32)}px Fredoka, 'Fredoka One', sans-serif`;
			ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#2a1400"; ctx.strokeText(text, sx, sy);
			ctx.fillStyle = rgb(color); ctx.fillText(text, sx, sy);
			ctx.restore();
		}, null, { top: true });
	}
	beam(a, b, color, width, life) {
		this.addFx(life || 0.3, null, f => {
			const p1 = this.S(a[0], a[1], a[2]), p2 = this.S(b[0], b[1], b[2]);
			ctx.save();
			ctx.globalAlpha = 0.9 * (1 - f.a);
			ctx.shadowColor = rgb(color); ctx.shadowBlur = 12;
			ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
			ctx.lineWidth = Math.max(2, width * this.L.k * (1 - f.a * 0.6)); ctx.strokeStyle = rgb(color); ctx.lineCap = "round"; ctx.stroke();
			ctx.lineWidth *= 0.4; ctx.strokeStyle = "#fff"; ctx.stroke();
			ctx.restore();
		});
	}
	zig(a, b) {
		const pts = [a];
		for (let i = 1; i <= 4; i++) { const t = i / 5; pts.push([a[0] + (b[0] - a[0]) * t + rnd(-0.15, 0.15), a[1] + (b[1] - a[1]) * t + rnd(-0.15, 0.15), a[2] + (b[2] - a[2]) * t + rnd(-1, 1)]); }
		pts.push(b);
		for (let i = 0; i < pts.length - 1; i++) this.beam(pts[i], pts[i + 1], C(120, 230, 255), 0.35, 0.25);
	}
	explosion(x, row, radius, dmg, color, round, single) {
		const size = Math.max(4, radius * TILE * 2);
		this.addFx(0.5, null, f => {
			const [sx, sy] = this.S(x, row, 2);
			const r = (0.5 + size * 0.5 * Math.sqrt(f.a)) * this.L.k;
			ctx.save();
			ctx.globalAlpha = 0.9 * (1 - f.a);
			const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
			g.addColorStop(0, "rgba(255,255,220,1)"); g.addColorStop(0.35, rgb(color, 0.95)); g.addColorStop(1, rgb(color, 0));
			ctx.fillStyle = g;
			ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
			ctx.restore();
		}, null, { top: true });
		Audio.Sfx("explode");
		this.shake = Math.max(this.shake, 0.25 + radius * 0.1);
		if (dmg <= 0) return;
		for (const b of this.bees) {
			if (!b.dead && !b.down && b.rise <= 0) {
				const dx = Math.abs(b.x - x), dr = Math.abs(b.rowF - row);
				let inside;
				if (round) inside = Math.sqrt(dx * dx + dr * dr) <= radius;
				else if (single) inside = dr < 0.5 && dx <= radius;
				else inside = dr <= 1.1 && dx <= radius;
				if (inside) this.damageBee(b, dmg, { ignoreShield: true, explosive: true, noRevive: round });
			}
		}
		if (this.boss && !this.boss.dead && x + radius >= 9.0) this.damageBoss(dmg * 0.5);
	}
	freezeAll(t) {
		Audio.Sfx("freeze");
		const flash = el("div", "flash", this.hud);
		setTimeout(() => flash.remove(), 900);
		for (const b of this.bees) {
			if (b.dead) continue;
			if (b.def.iceKills) { b.hp = 0; this.killBee(b, { noRevive: true }); }
			else {
				b.frozenT = t;
				b.slowT = t + 8;
				this.setTint(b, C(170, 230, 255));
				this.damageBee(b, 20, { ignoreShield: true, explosive: true });
			}
		}
		if (this.boss && !this.boss.dead) this.boss.frozen = t;
	}

	// ------------------------------------------------------------------ waves
	spawnWave(idx) {
		const wave = this.spec.waves[idx - 1];
		const whack = this.spec.mode === "whack";
		for (const e of wave.bees) {
			this.pendingSpawns++;
			this.delay(e.t, () => {
				this.pendingSpawns--;
				if (this.state !== "play" && this.state !== "prep") return;
				if (whack) { const b = this.spawnBee(e.id, null, rnd(4.5, 8.8), { rise: true }); b.speed *= 1.3; }
				else this.spawnBee(e.id);
			});
		}
		if (wave.flag) {
			for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
				if (this.grid[r][c].grave) this.spawnBee(this.spec.g >= 51 ? "zombee" : "worker", r, c - 0.5, { rise: true });
			}
		}
	}
	updateWaves(dt) {
		const spec = this.spec, n = spec.waves.length;
		if (n === 0 || this.state !== "play") return;
		if (this.waveIdx < n) {
			this.waveTimer -= dt;
			if (this.waveIdx > 0 && this.waveTimer > 5 && this.totalHp() < this.peakHp * 0.25) this.waveTimer = 5;
			const nextWave = spec.waves[this.waveIdx];
			if (nextWave.flag && !nextWave.announced && this.waveTimer <= 5) {
				nextWave.announced = true;
				this.announce(this.waveIdx + 1 === n ? "THE FINAL SWARM!" : "🐝 THE SCOUTS ARE DANCING... A SWARM IS COMING!", 3);
				Audio.Sfx("swarm");
			}
			if (this.waveTimer <= 0) {
				this.waveIdx++;
				this.spawnWave(this.waveIdx);
				this.waveTimer = this.waveInterval;
				this.peakHp = 1;
				if (this.waveIdx === 1) Audio.Sfx("buzz", 1);
			}
		}
		let frac = (this.waveIdx - 1 + clamp(1 - this.waveTimer / this.waveInterval, 0, 1)) / n;
		if (this.waveIdx === 0) frac = 0;
		if (this.waveIdx >= n) frac = 1;
		this.progFill.style.width = (clamp(frac, 0, 1) * 100) + "%";
		if (this.waveIdx >= n && this.pendingSpawns <= 0 && this.bees.length === 0) this.win();
	}
	updateSky(dt) {
		if (!this.spec.sky || this.state !== "play") return;
		this.skyTimer -= dt;
		if (this.skyTimer <= 0) {
			this.skyTimer = this.spec.sky * rnd(0.8, 1.2);
			this.spawnSun(rnd(0.6, 8.4), this.randomRow(), 34, 25, true);
		}
	}
	updateSeedRain(dt) {
		if (!this.spec.seedRain || this.state !== "play") return;
		this.rainT = (this.rainT === undefined ? 1 : this.rainT) - dt;
		if (this.rainT <= 0) {
			this.rainT = 3.2;
			let choices = this.opts.owned.filter(id => { const d = Config.FlowerById[id]; return d && d.kind !== "cup" && d.kind !== "fountain" && d.kind !== "moon" && !d.aquatic && !d.hidden; });
			if (!choices.length) choices = ["rose"];
			const id = choices[rint(0, choices.length - 1)];
			this.packets.push({ id, x: rnd(1, 8.5), row: rnd(0.8, this.rows + 0.2), y: 30, t: 0 });
		}
		for (let i = this.packets.length - 1; i >= 0; i--) {
			const pk = this.packets[i];
			pk.t += dt;
			pk.x -= Math.sin(pk.t * 2) * 2 * dt / TILE;
			pk.y -= 4 * dt;
			if (pk.y < 1.5) this.packets.splice(i, 1);
		}
	}
	breakVase(c, r) {
		const cell = this.grid[r][c], v = cell.vase;
		if (!v) return;
		cell.vase = null;
		this.vasesLeft--;
		Audio.Sfx("vase");
		this.puff(c - 0.5, r, 2, C(200, 140, 60));
		if (v.content.plant) {
			this.addBeltCard(v.content.plant);
			this.popup(c - 0.5, r, 4, "🌼 " + Config.FlowerById[v.content.plant].name + "!", C(120, 255, 120));
		} else if (v.content.bee) {
			const b = this.spawnBee(v.content.bee, r, c - 0.5, { rise: true });
			b.rise = 0.5;
		}
	}

	// ------------------------------------------------------------------ the Zombee Queen
	startBoss() {
		this.boss = { hp: Config.Queen.hp, max: Config.Queen.hp, phase: 1, atkT: 7, dizzy: 0, frozen: 0, dive: 0, t: 0, enter: 1, stomp: 0, flash: 0 };
		Audio.Sfx("roar");
		this.shake = 0.8;
		this.queenSay(Config.Queen.lines.intro[0]);
		this.rdelay(3.5, () => { if (this.boss && !this.boss.dead) this.queenSay(Config.Queen.lines.intro[1]); });
	}
	queenSay(text) {
		if (!this.queenBox) return;
		this.say = { text, i: 0, t: 0, hold: 0 };
		this.queenBox.style.display = "block";
		this.queenBox.textContent = "";
	}
	updateSay(dt) {
		const s = this.say;
		if (!s) return;
		s.t += dt;
		const n = Math.min(s.text.length, Math.floor(s.t / 0.03));
		this.queenBox.textContent = s.text.slice(0, n);
		if (n >= s.text.length) { s.hold += dt; if (s.hold > 2.5) { this.queenBox.style.display = "none"; this.say = null; } }
	}
	damageBoss(dmg) {
		const q = this.boss;
		if (!q || q.dead || q.enter > 0) return;
		if (q.dizzy > 0) dmg *= 2;
		q.hp -= dmg;
		q.flash = 0.06;
		this.bossFill.style.width = (Math.max(0, q.hp / q.max) * 100) + "%";
		const frac = q.hp / q.max;
		if (q.phase === 1 && frac <= 0.66) {
			q.phase = 2;
			this.queenSay(Config.Queen.lines.phase2[0]);
			Audio.Sfx("roar", 1.1);
			this.shake = 0.8;
			this.bossFill.style.background = "rgb(230,90,40)";
			for (let i = 1; i <= 4; i++) this.spawnBee(i === 1 ? "flag" : "zombee", null, rnd(9.2, 9.8));
		} else if (q.phase === 2 && frac <= 0.33) {
			q.phase = 3;
			this.queenSay(Config.Queen.lines.phase3[0]);
			Audio.Sfx("roar", 0.9);
			this.shake = 1.2;
			this.bossFill.style.background = "rgb(255,30,30)";
			for (let i = 1; i <= 6; i++) this.spawnBee(i === 1 ? "flag" : (i % 2 === 0 ? "knight" : "ghost"), null, rnd(9.2, 9.8));
		}
		if (q.hp <= 0) this.bossDeath();
	}
	plantedCells() {
		const out = [];
		for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) { const cell = this.grid[r][c]; if (cell.main || cell.pad) out.push([c, r]); }
		return out;
	}
	warn(c, r, t) {
		this.addFx(t, null, f => {
			const L = this.L;
			const x = L.ox + (c - 1) * L.T + this.shx, y = L.oy + (r - 1) * L.T + this.shy;
			ctx.save();
			ctx.globalAlpha = 0.25 + 0.4 * Math.abs(Math.sin(f.a * 18));
			ctx.fillStyle = "#ff1e1e";
			ctx.fillRect(x + L.T * 0.06, y + L.T * 0.06, L.T * 0.88, L.T * 0.88);
			ctx.restore();
		}, null, { under: true });
	}
	bossAttack(name) {
		const q = this.boss;
		const BOSS_SUMMONS = [["worker", "bumble", "zombee", "worker"], ["bumble", "armored", "zombee", "ghost", "hopper"], ["armored", "knight", "ghost", "zombee", "hornet", "shield"]];
		if (name === "summon") {
			const list = BOSS_SUMMONS[q.phase - 1];
			const n = 1 + q.phase + rint(0, 1);
			for (let i = 0; i < n; i++) this.spawnBee(list[rint(0, list.length - 1)], null, rnd(8.9, 9.5));
			Audio.Sfx("buzz", 0.8);
		} else if (name === "honeybomb") {
			const cells = this.plantedCells();
			for (let i = 0; i < q.phase; i++) {
				const cell = cells.length ? cells.splice(rint(0, cells.length - 1), 1)[0] : [rint(2, 8), this.randomRow()];
				this.warn(cell[0], cell[1], 1.6);
				const pr = this.addProj("honeybomb", 10.3, cell[1], 0, 0, 0, {});
				pr.enemy = true;
				pr.lob = { fromX: 9.8, toX: cell[0] - 0.5, time: 1.6 };
				pr.lt = 0;
				pr.cell = cell;
			}
		} else if (name === "stinger") {
			let best = this.randomRow(), bestN = -1;
			for (let r = 1; r <= this.rows; r++) {
				let n = 0;
				for (let c = 1; c <= COLS; c++) if (this.grid[r][c].main) n++;
				if (n > bestN) { best = r; bestN = n; }
			}
			const rows = [best];
			if (q.phase >= 2) rows.push(this.randomRow());
			for (const r of rows) { const pr = this.addProj("bigstinger", 9.3, r, -8, 0, 0, {}); pr.enemy = true; pr.y = 3; }
			Audio.Sfx("zap", 0.6);
		} else if (name === "honeyball") {
			this.spawnBee("honeyball", null, 9.2);
			Audio.Sfx("roar", 1.4);
		} else if (name === "stomp") {
			const rows = [];
			for (let r = 1; r <= this.rows; r++) if (q.phase >= 3 || Math.random() < 0.45) rows.push(r);
			for (const r of rows) for (let c = 8; c <= 9; c++) this.warn(c, r, 1.2);
			this.delay(1.2, () => {
				if (!this.boss || this.boss.dead) return;
				this.boss.stomp = 0.5;
				for (const r of rows) for (let c = 8; c <= 9; c++) this.flattenCell(r, c);
				Audio.Sfx("thud", 0.6);
				this.shake = 0.9;
			});
		} else if (name === "giant") {
			this.spawnBee("giant", null, 9.2);
		} else if (name === "dive") {
			const r = this.randomRow();
			this.queenSay(Config.Queen.lines.dive[0]);
			for (let c = 6; c <= 9; c++) this.warn(c, r, 1.5);
			q.diveRow = r;
			q.dive = 3.5;
			this.delay(1.5, () => {
				if (!this.boss || this.boss.dead) return;
				for (let c = 6; c <= 9; c++) this.flattenCell(r, c);
				this.shake = 1;
				Audio.Sfx("thud", 0.5);
				this.delay(0.6, () => {
					if (this.boss && !this.boss.dead) {
						this.boss.dizzy = 5;
						this.queenSay(Config.Queen.lines.dizzy[0]);
						this.announce("SHE'S DIZZY! DOUBLE DAMAGE!", 2, C(255, 220, 60));
					}
				});
			});
		}
	}
	updateBoss(dt) {
		const q = this.boss;
		if (!q || q.dead) return;
		q.t += dt;
		q.enter = Math.max(0, q.enter - dt * 0.5);
		q.dizzy = Math.max(0, q.dizzy - dt);
		q.dive = Math.max(0, q.dive - dt);
		q.stomp = Math.max(0, q.stomp - dt);
		q.flash = Math.max(0, q.flash - dt);
		if (q.frozen > 0) { q.frozen -= dt; return; }
		if (q.dizzy > 0 || q.enter > 0) return;
		q.atkT -= dt;
		if (q.atkT <= 0) {
			q.atkT = [7, 5.5, 4.5][q.phase - 1];
			const list = [
				["summon", "honeybomb", "stinger", "summon"],
				["summon", "honeybomb", "stinger", "honeyball", "stomp"],
				["summon", "honeybomb", "honeyball", "stomp", "giant", "dive", "stinger"],
			][q.phase - 1];
			let name;
			do { name = list[rint(0, list.length - 1)]; } while (name === q.last && list.length > 1);
			q.last = name;
			this.bossAttack(name);
		}
	}
	queenPos() {
		const q = this.boss;
		let mid = (this.rows + 1) / 2, x = 10.4 + q.enter * 6, y = 9 + Math.sin(q.t * 1.6) * 1.2;
		if (q.dive > 0 && q.diveRow) {
			const a = Math.sin(Math.min(1, (3.5 - q.dive) / 1.5) * Math.PI * 0.5);
			mid += (q.diveRow - mid) * a; y -= 6 * a; x -= 1.5 * a;
		}
		if (q.dizzy > 0) y = 4;
		if (q.stomp > 0) y -= q.stomp * 6;
		return [x, mid, y];
	}
	bossDeath() {
		const q = this.boss;
		q.dead = true;
		this.queenSay(Config.Queen.lines.death[0]);
		Audio.Sfx("roar", 0.7);
		for (const b of this.bees) if (!b.dead) { b.hp = 0; b.armor = 0; b.shield = 0; this.killBee(b, { noRevive: true }); }
		for (let i = 1; i <= 10; i++) this.delay(i * 0.3, () => { this.explosion(rnd(9.3, 11), rnd(1, this.rows), 0.8, 0, i % 2 === 0 ? C(255, 200, 40) : C(255, 60, 160)); this.shake = 0.6; });
		const [x, mid, y] = this.queenPos();
		this.addFx(3.5, null, f => {
			this.drawAt(x, mid, y - f.a * 12, 1, f.a * 1.2, 1 - f.a * f.a, c2 => Art.drawQueen(c2, { t: q.t, frozen: true }));
		});
		this.bossBar.style.display = "none";
		this.lastDeath = { x: 8, row: (this.rows + 1) / 2, y: 4 };
		this.delay(3.6, () => this.win());
	}

	// ------------------------------------------------------------------ win / lose / pause
	win() {
		if (this.state !== "play") return;
		this.state = "won";
		this.clearSelection();
		for (const b of this.bees) if (!b.dead) { b.hp = 0; this.killBee(b, { noRevive: true }); }
		const spec = this.spec;
		const def = spec.reward && Config.FlowerById[spec.reward];
		const owned = def && this.opts.owned.includes(spec.reward);
		const ld = this.lastDeath;
		this.reward = { def: (def && !owned) ? def : null, x: clamp(ld.x, 1, 8.5), row: clamp(ld.row, 1, this.rows), y: 4, t: 0 };
		this.hint("Click the prize to collect it!");
		Audio.Sfx("magic");
	}
	collectReward() {
		const rw = this.reward;
		if (!rw || rw.taken) return;
		rw.taken = true;
		rw.ta = 0;
		this.hint("");
		Audio.Sfx("win", 1);
		Audio.Music(this.spec.mode === "boss" ? "victory" : null);
		this.announce(this.spec.mode === "boss" ? "YOU SAVED THE GARDEN!" : "LEVEL COMPLETE!", 3, C(255, 230, 80));
		this.rdelay(1.8, () => this.opts.onEnd({ won: true }));
	}
	lose(b) {
		if (this.state !== "play") return;
		this.state = "lost";
		this.clearSelection();
		Audio.Music(null);
		Audio.Sfx("lose");
		this.loseBee = b;
		this.announce("THE BEES INVADED YOUR GREENHOUSE!", 6, C(255, 60, 60));
		this.rdelay(2.5, () => {
			const o = this.overlay("Oh no! 🐝", "The bees got into your greenhouse.");
			const row = el("div", "orow", o);
			btn(row, "TRY AGAIN", "green", () => this.opts.onEnd({ won: false, retry: true }));
			btn(row, "MAP", "tan", () => this.opts.onEnd({ won: false }));
		});
	}
	overlay(title, sub) {
		const wrap = el("div", "ovwrap", this.hud);
		const o = el("div", "overlay", wrap);
		o.style.transform = `scale(${this.uiS})`;
		el("div", "otitle", o, title);
		el("div", "osub", o, sub || "");
		o._wrap = wrap;
		return o;
	}
	pause(on) {
		if (this.state === "won" || this.state === "lost") return;
		if (on) {
			if (this.paused) return;
			this.paused = true;
			const o = this.overlay("Paused", this.spec.name);
			this.pauseFrame = o;
			btn(o, "RESUME", "green wide", () => this.pause(false));
			const row = el("div", "orow", o);
			btn(row, "RESTART", "orange", () => this.opts.onEnd({ won: false, retry: true }));
			btn(row, "MAP", "tan", () => this.opts.onEnd({ won: false }));
			const mb = btn(o, Audio.enabled ? "🎵 MUSIC: ON" : "🎵 MUSIC: OFF", "blue wide", () => {
				Audio.SetEnabled(!Audio.enabled);
				mb.textContent = Audio.enabled ? "🎵 MUSIC: ON" : "🎵 MUSIC: OFF";
			});
		} else {
			this.paused = false;
			if (this.pauseFrame) { this.pauseFrame._wrap.remove(); this.pauseFrame = null; }
		}
	}

	// ------------------------------------------------------------------ input
	screenToCell(sx, sy) {
		const L = this.L;
		return [Math.floor((sx - L.ox) / L.T) + 1, Math.floor((sy - L.oy) / L.T) + 1];
	}
	sdist(x, row, y, sx, sy) { const p = this.S(x, row, y); return Math.hypot(p[0] - sx, p[1] - sy); }
	onKey(e) {
		const k = e.key;
		if (k === "Escape" || k === "p" || k === "P") {
			if (this.sel || this.shovel) this.clearSelection(); else this.pause(!this.paused);
			return;
		}
		if (this.paused) return;
		if (k === "s" || k === "S" || k === "q" || k === "Q") { this.toggleShovel(); return; }
		const n = parseInt(k, 10);
		if (n >= 1 && n <= 5) {
			if (this.slots[n - 1]) this.selectSlot(n - 1);
			else if (this.beltCards && this.beltCards[n - 1]) this.selectBelt(this.beltCards[n - 1]);
		}
	}
	onPointer(sx, sy, button) {
		if (button === 2) { this.clearSelection(); return; }
		if (this.paused) return;
		const T = this.L.T;
		if (this.state === "won") {
			if (this.reward && this.sdist(this.reward.x, this.reward.row, this.reward.y, sx, sy) < T * 1.3) this.collectReward();
			return;
		}
		if (this.state !== "play" && this.state !== "prep") return;
		for (const s of this.suns) if (s.state !== "collect" && this.sdist(s.x, s.row, s.y, sx, sy) < T * 0.62) { this.collectSun(s); return; }
		for (let i = 0; i < this.packets.length; i++) {
			const pk = this.packets[i];
			if (this.sdist(pk.x, pk.row, pk.y, sx, sy) < T * 0.7) {
				if (this.addBeltCard(pk.id)) { this.packets.splice(i, 1); Audio.Sfx("magic", 1.3); }
				return;
			}
		}
		if (this.spec.mode === "whack" && !this.sel) {
			let best = null, bd = null;
			for (const b of this.bees) if (!b.dead && b.x < 9.6) {
				const d = this.sdist(b.x, b.rowF, b.hover - b.rise * (b.hover + 3), sx, sy);
				if (d < T * 0.8 && (bd === null || d < bd)) { best = b; bd = d; }
			}
			if (best) { this.whack(best); return; }
		}
		const [c, r] = this.screenToCell(sx, sy);
		if (!this.sel && !this.shovel) { // pour out a Dewcup
			const cell = this.grid[r] && this.grid[r][c];
			if (cell && cell.main && cell.main.def.kind === "cup" && this.harvest(cell.main)) return;
		}
		if (this.shovel) { this.shovelAt(c, r); return; }
		if (this.sel) { this.tryPlant(c, r); return; }
		if (this.grid[r] && this.grid[r][c] && this.grid[r][c].vase) this.breakVase(c, r);
	}
	whack(b) {
		Audio.Sfx("whack");
		const x = b.x, row = b.rowF, y = b.hover + 1;
		this.addFx(0.25, null, f => {
			this.drawAt(x, row, y, 1, 0, 1, c2 => {
				c2.rotate(-1.4 + f.a * 1.4);
				c2.fillStyle = "#96643a"; c2.fillRect(-0.2, -5.5, 0.4, 4.2);
				c2.fillStyle = "#c83c3c"; c2.strokeStyle = "#5a1010"; c2.lineWidth = 0.15;
				c2.beginPath(); c2.rect(-1.3, -7.2, 2.6, 1.8); c2.fill(); c2.stroke();
			});
		}, null, { top: true });
		this.damageBee(b, 300, { ignoreShield: true, explosive: true });
		this.shake = 0.12;
	}

	// ------------------------------------------------------------------ main loop
	step(rawDt) {
		rawDt = Math.min(rawDt, 0.1);
		for (let i = this.rtimers.length - 1; i >= 0; i--) {
			const tm = this.rtimers[i];
			tm.t -= rawDt;
			if (tm.t <= 0) { this.rtimers.splice(i, 1); try { tm.fn(); } catch (e) { console.warn(e); } }
			if (this.state === "gone") return;
		}
		const dt = this.paused ? 0 : Math.min(rawDt, 0.05) * this.speed;
		if (dt > 0) {
			this.t += dt;
			for (let i = this.timers.length - 1; i >= 0; i--) {
				const tm = this.timers[i];
				tm.t -= dt;
				if (tm.t <= 0) { this.timers.splice(i, 1); try { tm.fn(); } catch (e) { console.warn(e); } }
			}
			if (this.state === "play" || this.state === "prep") {
				this.updateSky(dt);
				this.updateWaves(dt);
				this.updateSeedRain(dt);
				this.updatePlants(dt);
				this.updateZones(dt);
				this.updateBees(dt);
				this.updateBoss(dt);
				this.updateRollers(dt);
				this.updateProjs(dt);
				this.updateMowers(dt);
				this.updateSlots(dt);
				if (this.spec.mode === "hivebreaker" && this.state === "play" && this.vasesLeft <= 0 && this.bees.length === 0) this.win();
				if (this.beamCol) {
					this.beamTimer -= dt;
					if (this.beamTimer <= 0) {
						this.beamTimer = 12;
						this.beamDir = this.beamDir || 1;
						if (this.beamCol + this.beamDir > COLS || this.beamCol + this.beamDir < 1) this.beamDir = -this.beamDir;
						this.beamCol += this.beamDir;
					}
				}
				for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
					const cell = this.grid[r][c];
					if (cell.crater > 0) cell.crater -= dt;
					if (cell.stink > 0) cell.stink -= dt;
				}
			} else if (this.state === "lost") {
				if (this.loseBee && !this.loseBee.dead) { this.loseBee.x -= dt * 0.6; this.loseBee.t += dt; }
			}
			this.updateSuns(dt);
			this.updateFx(dt);
			this.updateBelt(dt);
			if (this.say) this.updateSay(dt);
		}
		if (this.reward) { this.reward.t += rawDt; if (this.reward.taken) this.reward.ta += rawDt; }
		this.updateFog(rawDt);
		this.render(rawDt);
		this.sunLabel.textContent = String(this.sun);
	}
	updateSlots(dt) {
		for (const slot of this.slots) {
			slot.cd = Math.max(0, slot.cd - dt);
			slot.card.setCooldown(slot.cdMax > 0 ? slot.cd / slot.cdMax : 0);
			slot.card.setEnabled(slot.cd <= 0 && this.sun >= slot.def.cost);
		}
	}
	updateMowers(dt) {
		for (const key in this.mowers) {
			const m = this.mowers[key];
			if (!m.active) continue;
			m.x += 7 * dt;
			for (const b of this.bees) if (b.row === m.row && !b.dead && Math.abs(b.x - m.x) < 0.7) { b.hp = 0; b.armor = 0; b.shield = 0; b.down = false; this.killBee(b, { noRevive: true }); }
			if (m.x > 11) this.mowers[key] = { used: true, active: false, row: m.row, gone: true };
		}
	}
	updateFog(dt) {
		if (!this.fog) return;
		const lights = this.plants.filter(p => p.def.kind === "firefly" && !p.dead);
		for (const f of this.fog) {
			let clear = false;
			for (const l of lights) if ((f.r === l.r && f.c >= l.c - 1) || (Math.abs(f.r - l.r) <= 1 && Math.abs(f.c - l.c) <= 1)) { clear = true; break; }
			const target = clear ? 1 : 0.04;
			f.tr += (target - f.tr) * Math.min(1, dt * 3);
		}
	}

	// ------------------------------------------------------------------ rendering
	bakeBackground() {
		const L = this.L, A = this.spec.A, spec = this.spec;
		const bg = this.bg || (this.bg = document.createElement("canvas"));
		bg.width = cv.width; bg.height = cv.height;
		const g = bg.getContext("2d");
		g.setTransform(DPR, 0, 0, DPR, 0, 0);
		const { T, ox, oy, W, H } = L;
		// sky
		const grd = g.createLinearGradient(0, 0, 0, oy);
		grd.addColorStop(0, A.bg[0]); grd.addColorStop(1, A.bg[1]);
		g.fillStyle = grd; g.fillRect(0, 0, W, H);
		if (A.id === "night" || A.id === "zombie") {
			for (const s of this.stars) { g.fillStyle = `rgba(255,255,240,${0.4 + s[2] / 10})`; g.fillRect(s[0] * W, s[1] * oy * 0.9, 2, 2); }
			g.save(); g.shadowColor = "#dde"; g.shadowBlur = 30; g.fillStyle = "#f0f0dc";
			g.beginPath(); g.arc(ox + 2 * T, oy * 0.35, T * 0.45, 0, Math.PI * 2); g.fill(); g.restore();
		} else if (A.id === "sunrise" || A.id === "sunset") {
			g.save(); g.shadowColor = A.id === "sunrise" ? "#ffbe5a" : "#ff6e3c"; g.shadowBlur = 50;
			g.fillStyle = A.id === "sunrise" ? "#ffbe5a" : "#ff6e3c";
			g.beginPath(); g.arc(A.id === "sunrise" ? ox - 0.5 * T : ox + 9 * T, oy * 0.55, T * 0.9, 0, Math.PI * 2); g.fill(); g.restore();
		} else {
			g.fillStyle = "rgba(255,255,255,0.85)";
			for (const c of [[0.15, 0.3], [0.5, 0.18], [0.8, 0.35]]) for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(c[0] * W + i * T * 0.35, c[1] * oy + (i % 2) * T * 0.1, T * 0.3, 0, Math.PI * 2); g.fill(); }
		}
		// ground behind the lawn
		const groundTop = oy - 0.45 * T;
		g.fillStyle = rgb(lerpC(A.grass[0], [0, 0, 0], 0.25));
		g.fillRect(0, groundTop, W, H - groundTop);
		// trees + fence along the back
		const dead = A.id === "zombie" || A.id === "night";
		for (let i = 0; i < 8; i++) {
			g.save(); g.translate(ox + (i * 1.9 - 1) * T, groundTop + (i % 2) * T * 0.05); g.scale(L.k * 0.75, L.k * 0.75);
			Art.drawTree(g, lerpC(A.grass[0], [0, 80, 0], 0.3), dead && i % 2 === 0); g.restore();
		}
		g.fillStyle = "#f0e6d2"; g.strokeStyle = "#a08a6a"; g.lineWidth = 1;
		for (let x = ox - 1.5 * T; x < ox + 12 * T; x += T * 0.32) { g.fillRect(x, groundTop - T * 0.42, T * 0.24, T * 0.42); g.strokeRect(x, groundTop - T * 0.42, T * 0.24, T * 0.42); }
		g.fillRect(ox - 1.5 * T, groundTop - T * 0.3, 13.5 * T, T * 0.06);
		// street + hive
		g.fillStyle = "#96784f"; g.fillRect(ox + 9 * T, oy - 0.45 * T, 4 * T, (this.rows + 1) * T);
		g.fillStyle = "rgba(0,0,0,0.12)";
		for (let r = 0; r < this.rows; r++) g.fillRect(ox + 9 * T, oy + r * T + T * 0.48, 4 * T, T * 0.04);
		g.save(); g.translate(ox + 11.2 * T, oy + this.rows * T * 0.55); g.scale(L.k * 0.9, L.k * 0.9); Art.drawHive(g, 0); g.restore();
		// lawn tiles
		for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
			const cell = this.grid[r][c];
			let col;
			if (!spec.active[r]) col = C(130, 95, 60);
			else if (cell.water) col = (c % 2 === 0) ? C(60, 150, 220) : C(70, 160, 230);
			else col = A.grass[(r + c) % 2];
			const x = ox + (c - 1) * T, y = oy + (r - 1) * T;
			g.fillStyle = rgb(col); g.fillRect(x, y, T + 0.5, T + 0.5);
			if (spec.active[r] && !cell.water) {
				g.fillStyle = "rgba(255,255,255,0.06)";
				for (let i = 0; i < 5; i++) g.fillRect(x + ((i * 37 + c * 13) % 90) / 100 * T, y + ((i * 53 + r * 29) % 90) / 100 * T, 2, T * 0.08);
			}
		}
		g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 2; g.strokeRect(ox, oy, COLS * T, this.rows * T);
		// greenhouse
		const gx = ox - 1.25 * T;
		g.fillStyle = "#c8c8d2"; g.fillRect(gx - 0.1 * T, oy - 0.5 * T, 1.15 * T, (this.rows + 0.6) * T);
		g.fillStyle = "rgba(200,240,255,0.55)"; g.fillRect(gx, oy - 0.45 * T, 0.95 * T, (this.rows + 0.5) * T);
		g.strokeStyle = "#f0f0f5"; g.lineWidth = Math.max(2, T * 0.06);
		for (let r = 0; r <= this.rows; r++) { g.beginPath(); g.moveTo(gx, oy + r * T); g.lineTo(gx + 0.95 * T, oy + r * T); g.stroke(); }
		g.beginPath(); g.moveTo(gx + 0.47 * T, oy - 0.45 * T); g.lineTo(gx + 0.47 * T, oy + this.rows * T); g.stroke();
		g.fillStyle = "rgba(255,255,255,0.3)";
		for (let r = 0; r < this.rows; r++) g.fillRect(gx + 0.08 * T, oy + r * T + 0.1 * T, 0.12 * T, 0.6 * T);
		// bowling line
		if (spec.bowlLine) { g.fillStyle = "#ff1e1e"; g.shadowColor = "#f00"; g.shadowBlur = 10; g.fillRect(ox + spec.bowlLine * T - 2, oy, 4, this.rows * T); g.shadowBlur = 0; }
	}

	render(dt) {
		const L = this.L;
		if (this.shake > 0) {
			this.shake = Math.max(0, this.shake - dt);
			const s = this.shake * 1.5 * L.k;
			this.shx = rnd(-s, s); this.shy = rnd(-s, s);
		} else { this.shx = 0; this.shy = 0; }
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.drawImage(this.bg, this.shx * DPR, this.shy * DPR);
		ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
		const T = L.T, t = performance.now() / 1000;
		// water shimmer
		for (let r = 1; r <= this.rows; r++) {
			if (!this.grid[r][1].water) continue;
			ctx.save(); ctx.globalAlpha = 0.25; ctx.strokeStyle = "#e0f4ff"; ctx.lineWidth = 2;
			for (let i = 0; i < 9; i++) {
				const x = L.ox + ((i * 1.1 + t * 0.3) % 9) * T + this.shx, y = L.oy + (r - 0.5 + Math.sin(i * 2.3) * 0.3) * T + this.shy;
				ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + T * 0.15, y - T * 0.06, x + T * 0.3, y); ctx.stroke();
			}
			ctx.restore();
		}
		// craters
		for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
			if (this.grid[r][c].crater > 0) {
				const [sx, sy] = this.S(c - 0.5, r, 0);
				ctx.fillStyle = "#32201a"; ctx.beginPath(); ctx.ellipse(sx, sy - T * 0.15, T * 0.42, T * 0.28, 0, 0, Math.PI * 2); ctx.fill();
				ctx.fillStyle = "#1e120c"; ctx.beginPath(); ctx.ellipse(sx, sy - T * 0.12, T * 0.28, T * 0.16, 0, 0, Math.PI * 2); ctx.fill();
			}
		}
		// stink tiles, pollen clouds and scorched ground
		for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
			const st = this.grid[r][c].stink;
			if (st > 0) {
				const x = L.ox + (c - 1) * T + this.shx, y = L.oy + (r - 1) * T + this.shy;
				ctx.fillStyle = `rgba(130,170,50,${Math.min(0.45, st / 10)})`; ctx.fillRect(x, y, T, T);
				for (let i = 0; i < 2; i++) { const ph = (t * 0.5 + i * 0.5 + c * 0.3) % 1; ctx.fillStyle = `rgba(160,200,70,${0.4 * (1 - ph)})`; ctx.beginPath(); ctx.arc(x + T * (0.3 + i * 0.4), y + T * (0.8 - ph * 0.7), T * 0.12 * (1 + ph), 0, Math.PI * 2); ctx.fill(); }
			}
		}
		for (const z of this.zones) {
			const fade = Math.min(1, z.t / 0.5, (z.life - z.t) / 0.3 + 0.2);
			if (z.kind === "cloud") {
				for (let i = 0; i < 12; i++) {
					const ax = z.x + Math.cos(i * 2.4 + t) * 1.1 * ((i % 3) / 2 + 0.3), ar = z.row + Math.sin(i * 1.7 + t * 0.8) * 0.9 * ((i % 4) / 3 + 0.2);
					const [sx, sy] = this.S(ax, ar, 2.5);
					ctx.fillStyle = `rgba(255,215,70,${0.28 * fade})`; ctx.beginPath(); ctx.arc(sx, sy, T * 0.45, 0, Math.PI * 2); ctx.fill();
				}
			} else if (z.kind === "scorch") {
				for (let i = 0; i < 8; i++) {
					const ax = z.x0 + (i + 0.5) / 8 * (z.x1 - z.x0), h = 1.2 + Math.sin(t * 12 + i * 2) * 0.6;
					const [sx, sy] = this.S(ax, z.row, 0);
					ctx.fillStyle = `rgba(255,${120 + i * 10},20,${0.75 * fade})`;
					ctx.beginPath(); ctx.moveTo(sx - T * 0.1, sy); ctx.lineTo(sx, sy - h * this.L.k * 2); ctx.lineTo(sx + T * 0.1, sy); ctx.fill();
				}
			}
		}
		// sunbeam
		if (this.beamCol) {
			this.beamX += ((this.beamCol - 0.5) - this.beamX) * Math.min(1, dt * 2);
			const x = L.ox + (this.beamX - 0.5) * T + this.shx;
			const gr = ctx.createLinearGradient(x, 0, x + T, 0);
			gr.addColorStop(0, "rgba(255,230,120,0)"); gr.addColorStop(0.5, "rgba(255,230,120,0.32)"); gr.addColorStop(1, "rgba(255,230,120,0)");
			ctx.fillStyle = gr; ctx.fillRect(x - T * 0.2, 0, T * 1.4, L.oy + this.rows * T);
		}
		// under-fx (warnings)
		for (const f of this.fx) if (f.under && f.draw) f.draw(f);
		// hover highlight + ghost
		let ghost = null;
		if ((this.sel || this.shovel) && (this.state === "play" || this.state === "prep") && this.mouse) {
			const [c, r] = this.screenToCell(this.mouse.x, this.mouse.y);
			if (c >= 1 && c <= COLS && r >= 1 && r <= this.rows) {
				const ok = this.shovel || this.canPlant(this.sel.def, c, r);
				if (ok) {
					ctx.fillStyle = this.shovel ? "rgba(255,120,80,0.4)" : "rgba(255,255,255,0.35)";
					ctx.fillRect(L.ox + (c - 1) * T + T * 0.05 + this.shx, L.oy + (r - 1) * T + T * 0.05 + this.shy, T * 0.9, T * 0.9);
					if (this.sel) ghost = { c, r };
				}
			}
		}
		// shadows
		const inv = this.spec.mode === "invisibee";
		for (const b of this.bees) {
			if (b.dead) continue;
			const [sx, sy] = this.S(b.x, b.rowF, 0);
			const s = (b.def.look.scale || 1) * (b.def.look.ball ? 1.4 : 1);
			ctx.fillStyle = inv ? "rgba(0,0,0,0.6)" : "rgba(0,0,0,0.28)";
			ctx.beginPath(); ctx.ellipse(sx, sy, L.k * 1.2 * s, L.k * 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
		}
		// sorted world drawables
		const list = [];
		for (const p of this.plants) if (!p.dead) list.push([p.r + (p.def.kind === "pad" ? -0.2 : 0), 0, p]);
		for (let r = 1; r <= this.rows; r++) for (let c = 1; c <= COLS; c++) {
			const cell = this.grid[r][c];
			if (cell.grave) list.push([r - 0.1, 1, { grave: cell.grave, c, r }]);
			if (cell.vase) list.push([r, 1, { vase: cell.vase, c, r }]);
		}
		for (const b of this.bees) if (!b.dead) list.push([b.rowF + 0.1, 2, b]);
		for (const ro of this.rollers) list.push([ro.rowF + 0.05, 3, ro]);
		for (const k in this.mowers) { const m = this.mowers[k]; if (!m.gone) list.push([m.row, 4, m]); }
		list.sort((a, b) => a[0] - b[0]);
		for (const [, kind, o] of list) {
			if (kind === 0) this.drawPlant(o, t);
			else if (kind === 1) {
				if (o.grave) this.drawAt(o.c - 0.5, o.r, GROUND, 1, o.grave.tilt, 1, c2 => Art.drawGrave(c2));
				else this.drawAt(o.c - 0.5, o.r, GROUND, 1, 0, 1, c2 => Art.drawVase(c2, o.vase.green, t));
			} else if (kind === 2) this.drawBeeE(o, inv);
			else if (kind === 3) {
				const g = o.def.look.giant ? 1.9 : 1;
				this.drawAt(o.x, o.rowF, GROUND, 1, 0, 1, c2 => Art.drawFlower(c2, o.def, { t, spin: o.spin }));
			} else if (kind === 4) {
				this.drawAt(o.x, o.row, GROUND + (o.active ? Math.abs(Math.sin(t * 20)) * 0.3 : 0), 1, 0, 1, c2 => Art.drawLadybug(c2, t, o.active));
			}
		}
		if (ghost) {
			const cell = this.grid[ghost.r][ghost.c];
			this.drawAt(ghost.c - 0.5, ghost.r, GROUND + (cell.pad ? 0.3 : 0), 1, 0, 0.5, c2 => Art.drawFlower(c2, this.sel.def, { t, armed: true }));
		}
		// queen
		const q = this.boss;
		if (q && !q.dead) {
			const [x, mid, y] = this.queenPos();
			let rot = 0, dx = 0;
			if (q.dizzy > 0) rot = Math.sin(q.t * 6) * 0.3;
			if (q.flash > 0) dx = 0.05;
			this.drawAt(x + dx, mid, y, 1, rot, 1, c2 => {
				if (q.dizzy > 0) { c2.save(); c2.font = "3px sans-serif"; c2.textAlign = "center"; for (let i = 0; i < 3; i++) { const a = q.t * 4 + i * 2.1; c2.fillText("⭐", Math.cos(a) * 4, -9 + Math.sin(a) * 1.2); } c2.restore(); }
				Art.drawQueen(c2, { t: q.t, frozen: q.frozen > 0 });
				if (q.frozen > 0) { c2.fillStyle = "rgba(170,230,255,0.45)"; c2.beginPath(); c2.ellipse(0, 0, 9, 6, 0, 0, Math.PI * 2); c2.fill(); }
			});
		}
		// projectiles
		for (const pr of this.projs) {
			const [sx, sy] = this.S(pr.x, pr.row, pr.y);
			ctx.save(); ctx.translate(sx, sy); ctx.scale(L.k * 1.3, L.k * 1.3);
			Art.drawProj(ctx, pr.kind, pr.age);
			ctx.restore();
		}
		for (const f of this.fx) if (!f.under && !f.top && f.draw) f.draw(f);
		// fog
		if (this.fog) {
			// one opaque-ish layer per cell (alpha can't stack), then soft clouds that only show where fog is thick
			for (const f of this.fog) {
				const a = (1 - f.tr) * 0.94;
				if (a < 0.02) continue;
				const x = L.ox + (f.c - 1) * T + this.shx, y = L.oy + (f.r - 1) * T + this.shy;
				ctx.fillStyle = `rgba(232,168,140,${a})`;
				ctx.fillRect(x - 0.5, f.r === 1 ? y - T * 0.6 : y - 0.5, T + 1, f.r === 1 ? T * 1.6 + 0.5 : T + 1);
			}
			ctx.save();
			for (let i = 0; i < 14; i++) {
				const fx = 5 + ((i * 2.7 + t * 0.12 * (1 + i % 3)) % 7.5), fr = 0.5 + (i * 1.73) % this.rows;
				const cell = this.fog.find(f => f.c === Math.floor(fx) + 1 && f.r === Math.min(this.rows, Math.floor(fr) + 1));
				const a = cell ? (1 - cell.tr) : 1;
				if (a < 0.3) continue;
				const [sx, sy] = [L.ox + fx * T + this.shx, L.oy + fr * T + this.shy];
				const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, T * 0.9);
				g.addColorStop(0, `rgba(255,214,190,${0.35 * a})`); g.addColorStop(1, "rgba(255,214,190,0)");
				ctx.fillStyle = g; ctx.fillRect(sx - T, sy - T, T * 2, T * 2);
			}
			ctx.restore();
		}
		if (this.spec.A.tint) { ctx.fillStyle = this.spec.A.tint; ctx.fillRect(0, 0, L.W, L.H); }
		for (const f of this.fx) if (f.top && f.draw) f.draw(f);
		// seed packets
		for (const pk of this.packets) this.drawAt(pk.x, pk.row, pk.y, 1.2, Math.sin(pk.t * 2) * 0.3, 1, c2 => Art.drawPacket(c2, Config.FlowerById[pk.id]));
		// suns
		const target = this.sunTarget();
		for (const s of this.suns) {
			const blink = s.state === "rest" && s.life > 9 && (Math.floor(s.life * 6) % 2 === 0);
			if (s.state === "collect") {
				const a = Math.pow(Math.min(1, s.ct), 1.5);
				const x = s.from[0] + (target[0] - s.from[0]) * a, y = s.from[1] + (target[1] - s.from[1]) * a;
				ctx.save(); ctx.translate(x, y); const k = L.k * (1 - a * 0.4); ctx.scale(k, k); Art.drawSun(ctx, s.spin, 1); ctx.restore();
			} else this.drawAt(s.x, s.row, s.y, 1, 0, 1, c2 => Art.drawSun(c2, s.spin, blink ? 0.4 : 1));
		}
		// reward
		const rw = this.reward;
		if (rw) {
			const y = rw.taken ? rw.y + Math.min(1, rw.ta / 1.6) * 6 : rw.y + Math.sin(rw.t * 3) * 0.6;
			const sc = rw.taken ? 1.5 + Math.min(1, rw.ta / 1.6) : 1.5;
			this.drawAt(rw.x, rw.row, y, sc, rw.taken ? rw.ta * 6 : Math.sin(rw.t * 1.5) * 0.15, rw.taken ? 1 - Math.max(0, rw.ta - 1.2) * 2 : 1, c2 => {
				if (rw.def) Art.drawPacket(c2, rw.def, true); else { c2.translate(0, 2); Art.drawTrophy(c2); }
			});
		}
	}

	drawPlant(p, t) {
		const def = p.def;
		const sway = Math.sin(t * 2 + p.phase) * 0.04;
		let y = GROUND + (p.onPad ? 0.3 : 0) + (p.inWater ? -0.2 : 0);
		let dx = 0;
		if (def.kind === "mine" && !p.armed) y -= 1.2;
		if (p.hurt > 0) dx = rnd(-0.015, 0.015);
		const grow = p.grow;
		const [sx, sy] = this.S(p.x + dx, p.r, y);
		const k = this.L.k;
		ctx.save();
		ctx.translate(sx, sy);
		ctx.scale(k, k * (0.4 + grow * 0.6));
		if (def.kind === "mine" && !p.armed) {
			ctx.save(); ctx.beginPath(); ctx.rect(-4, -10, 8, 10 - 1.2 + 0.3); ctx.clip();
			Art.drawFlower(ctx, def, { t, punch: p.punch, sway, phase: p.phase });
			ctx.restore();
			ctx.fillStyle = "#6a4a2a"; ctx.beginPath(); ctx.ellipse(0, -1.0, 1.6, 0.5, 0, 0, Math.PI * 2); ctx.fill();
		} else {
			if (p.inWater && def.kind !== "pad" && !def.aquatic) { /* unreachable: land flowers can't sit in water */ }
			Art.drawFlower(ctx, def, { t, punch: p.punch, sway: p.sticky > 0 ? 0 : sway, chomp: p.chomp || 0, chew: p.chew, armed: p.armed,
				fill: def.kind === "cup" ? p.stored / def.cap : undefined, stalk: p.state === "stalk", held: p.held ? p.held.length : 0, sparks: p.sparks, used: !!p.used, cool: p.cool, spin: p.spin });
		}
		if (p.dazeT > 0) { ctx.save(); ctx.font = "2px sans-serif"; ctx.textAlign = "center"; for (let i = 0; i < 3; i++) { const a = t * 4 + i * 2.1; ctx.fillText("💫", Math.cos(a) * 1.6, -5 + Math.sin(a) * 0.5); } ctx.restore(); }
		if (p.sticky > 0) {
			ctx.globalAlpha = 0.75;
			ctx.fillStyle = "#ffaf00"; ctx.beginPath(); ctx.ellipse(0, -3.2, 1.6, 1.0, 0, 0, Math.PI * 2); ctx.fill();
			ctx.fillRect(-0.3, -3.0, 0.25, 1.4); ctx.fillRect(0.6, -2.8, 0.25, 1.1);
		}
		ctx.restore();
		if (p.hp < def.hp && def.hp < 1e8 && p.hp > 0) {
			const [hx, hy] = this.S(p.x, p.r, 0);
			const w = this.L.T * 0.6;
			ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(hx - w / 2, hy + this.L.T * 0.12, w, 4);
			ctx.fillStyle = p.hp / def.hp > 0.4 ? "#7ee04a" : "#ff6040"; ctx.fillRect(hx - w / 2, hy + this.L.T * 0.12, w * p.hp / def.hp, 4);
		}
	}

	drawBeeE(b, inv) {
		if (inv || b.inPitcher) return;
		const def = b.def;
		const bob = Math.sin(b.t * 5) * 0.35;
		let y = b.hover + bob - b.rise * (b.hover + 3) + (b.hopY || 0);
		let rot = 0, x = b.x;
		if (b.down) { y = 0.9; rot = 2.6; }
		if (b.state === "sting") x += Math.sin(b.t * 18) * 0.035;
		if (b.state === "smash") rot = -0.5 * (1 - b.windT);
		if (b.flash > 0) x += 0.02;
		let roll = 0;
		if (def.look.ball) { y = b.hover; roll = -b.x * 1.8; }
		const frozen = b.frozenT > 0;
		const alpha = b.phased ? 0.18 : 1;
		const [sx, sy] = this.S(x, b.rowF, y);
		const k = this.L.k;
		ctx.save();
		ctx.translate(sx, sy); ctx.scale(k, k);
		if (b.rise > 0) { // climbing out of the ground: clip below the lawn line
			const [, gy] = this.S(x, b.rowF, 0);
			ctx.beginPath(); ctx.rect(-8, -20, 16, (gy - sy) / k + 20); ctx.clip();
		}
		if (rot) ctx.rotate(rot);
		if (b.backT > 0) ctx.scale(-1, 1);
		ctx.globalAlpha = alpha;
		Art.drawBee(ctx, def, {
			t: frozen ? 0 : b.t, frozen, wingLost: b.lostWing, armor: b.armor > 0, shield: b.shield > 0, larva: false, sacks: !b.dropped.sacks,
			tint: b.tint, roll,
		});
		if (b.flash > 0) { ctx.globalAlpha = 0.35; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * (def.look.scale || 1), 1.2 * (def.look.scale || 1), 0, 0, Math.PI * 2); ctx.fill(); }
		if (b.sleepT > 0) { ctx.save(); ctx.globalAlpha = 1; ctx.font = "bold 1.4px sans-serif"; ctx.fillStyle = "#e0d0ff"; ctx.fillText("z", -1.2, -2.2 - (b.t % 1)); ctx.fillText("Z", -0.4, -3 - (b.t % 1)); ctx.restore(); }
		if (b.stuckT > 0) { ctx.save(); ctx.globalAlpha = 1; for (let i = 0; i < 6; i++) { ctx.fillStyle = "#8a6a2a"; ctx.beginPath(); ctx.arc(Math.cos(i * 1.1) * 1.2, 0.6 + Math.sin(i * 1.7) * 0.6, 0.25, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }
		if (frozen) { ctx.globalAlpha = 0.4; ctx.fillStyle = "#c8f0ff"; ctx.beginPath(); ctx.ellipse(0, 0, 2.2 * (def.look.scale || 1), 1.6 * (def.look.scale || 1), 0, 0, Math.PI * 2); ctx.fill(); }
		ctx.restore();
	}

	destroy() {
		this.state = "gone";
		cancelAnimationFrame(this.raf);
		window.removeEventListener("resize", this._onResize);
		window.removeEventListener("keydown", this._onKey);
		cv.removeEventListener("pointerdown", this._onDown);
		cv.removeEventListener("pointermove", this._onMove);
		cv.removeEventListener("contextmenu", this._onCtx);
		this.hud.remove();
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.clearRect(0, 0, cv.width, cv.height);
	}
}

// ===================================================================================
// Menus: world map, choose-your-flowers screen, almanac and reward popups.
// ===================================================================================
const Menus = (() => {
	let current = null;
	const M = {};
	M.Close = () => { if (current) { current.remove(); current = null; } };

	function screen(name) {
		M.Close();
		const gui = el("div", "menu " + name, document.body);
		current = gui;
		for (let i = 1; i <= 6; i++) {
			const b = el("div", "mbee", gui, "🐝");
			b.style.top = (8 + i * 9) + "%";
			b.style.animationDuration = (30 / (0.04 + i * 0.012) / 10) + "s";
			b.style.animationDelay = (-i * 3.1) + "s";
			const f = el("div", "mflower", gui, ["🌻", "🌷", "🌹", "🌼", "🪷", "🌸"][i - 1]);
			f.style.left = `calc(${i / 7 * 100}% - 22px)`;
			f.style.transform = `rotate(${i % 2 === 0 ? 8 : -8}deg)`;
		}
		const root = el("div", "mroot", gui);
		const fit = () => {
			const s = clamp(Math.min(window.innerWidth / 1000, window.innerHeight / 680), 0.3, 1.2);
			root.style.transform = `translate(-50%,-50%) scale(${s})`;
		};
		fit();
		window.addEventListener("resize", fit);
		gui._cleanup = () => window.removeEventListener("resize", fit);
		const rm = gui.remove.bind(gui);
		gui.remove = () => { gui._cleanup(); rm(); };
		return [gui, root];
	}
	function panel(parent, w, h, x, y, color) {
		const f = el("div", "panel", parent);
		Object.assign(f.style, { width: w + "px", height: h + "px", left: x + "px", top: y + "px" });
		if (color) f.style.background = rgb(color);
		return f;
	}
	function label(parent, text, x, y, w, h, cls) {
		const l = el("div", "mlabel " + (cls || ""), parent, text);
		Object.assign(l.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", lineHeight: h + "px", fontSize: Math.round(h * 0.78) + "px" });
		return l;
	}
	function mbtn(parent, text, x, y, w, h, color, cb, cls) {
		const b = btn(parent, text, "mbtn " + (cls || ""), cb);
		Object.assign(b.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", background: color ? rgb(color) : null, fontSize: Math.round(Math.min(h * 0.42, 26)) + "px" });
		return b;
	}
	const owns = (data, id) => data.owned.includes(id);

	// World map -----------------------------------------------------------------------
	M.Map = function (data, cb, area) {
		Audio.Music("menu");
		const [gui, root] = screen("map");
		label(root, "🌻 FLOWERS vs BEES 🐝", 0, 0, 980, 86, "title wobble");
		const nFlowers = Config.Flowers.filter(f => !f.hidden).length;
		label(root, `🌼 Flowers collected: ${data.owned.length} / ${nFlowers}`, 0, 86, 980, 30, "white");
		const maxArea = clamp(Math.ceil(data.unlocked / 10), 1, 6);
		area = clamp(area || maxArea, 1, 6);
		if (area > maxArea) area = maxArea;
		const tabs = el("div", "tabs", root);
		const board = panel(root, 900, 360, 40, 200);
		const showArea = a => {
			area = a;
			board.innerHTML = "";
			const A = Config.Areas[a - 1];
			board.style.background = rgb(lerpC(A.color, C(120, 80, 40), 0.55));
			label(board, `${A.icon}  ${A.name}  ${A.icon}`, 0, 10, 890, 44, "white");
			const blurb = [
				"The bees are coming for your nectar. Plant Dewcups and click them when they fill up!",
				"No nectar falls from the sky at night. Moonflowers turn beaten bees into nectar!",
				"The pond needs Lotus Rafts before you can plant on the water.",
				"A beam of morning sunlight sweeps the lawn. Flowers inside it work TWICE as fast!",
				"Thick orange fog hides the bees. Firefly Bulbs light up a whole lane.",
				"Spooky graves... and bees that won't stay down. The Zombee Queen waits at the end!",
			][a - 1];
			label(board, blurb, 45, 56, 800, 26, "cream");
			for (let n = 1; n <= 10; n++) {
				const g = (a - 1) * 10 + n;
				const col = (n - 1) % 5, row = Math.floor((n - 1) / 5);
				const locked = g > data.unlocked;
				const beaten = data.beaten[String(g)];
				let icon = "🌼";
				if (n === 5) icon = Config.Minigames[A.minigame].icon;
				else if (n === 10) icon = a === 6 ? "👑" : "⚙️";
				const color = locked ? C(110, 110, 110) : (beaten ? C(110, 200, 80) : C(255, 200, 50));
				let sub = n === 5 ? Config.Minigames[A.minigame].name : (n === 10 ? (a === 6 ? "FINAL BOSS" : "Conveyor") : "");
				const reward = Config.Rewards[g];
				if (reward && !owns(data, reward) && !locked) sub = "🎁 New flower!";
				if (beaten) sub = "⭐ " + sub;
				const b = mbtn(board, `<div class="lvico">${locked ? "🔒" : icon}</div><div class="lvnum">${a}-${n}</div><div class="lvsub">${sub}</div>`,
					40 + col * 168, 92 + row * 128, 150, 112, color, () => {
						if (locked) { Audio.Sfx("thud", 1.4); return; }
						cb.play(g);
					}, "level" + (locked ? " locked" : "") + (!locked && !beaten ? " wiggle" : ""));
			}
		};
		for (let a = 1; a <= 6; a++) {
			const A = Config.Areas[a - 1];
			const locked = a > maxArea;
			const t = btn(tabs, (locked ? "🔒 " : A.icon + " ") + A.name, "tab", () => { if (!locked) showArea(a); });
			t.style.background = rgb(locked ? C(100, 100, 100) : A.color);
		}
		showArea(area);
		if (data.unlocked > 60) label(root, "🏆 YOU BEAT THE ZOMBEE QUEEN! You can replay any level. 🏆", 0, 566, 980, 30, "gold");
		mbtn(root, "📖 ALMANAC", 250, 598, 220, 60, C(90, 150, 220), () => cb.almanac(area));
		const mb = mbtn(root, Audio.enabled ? "🎵 MUSIC: ON" : "🎵 MUSIC: OFF", 510, 598, 220, 60, C(200, 120, 200), () => {
			Audio.SetEnabled(!Audio.enabled);
			mb.textContent = Audio.enabled ? "🎵 MUSIC: ON" : "🎵 MUSIC: OFF";
		});
		const home = el("a", "homelink", gui, "⬅ platyfy");
		home.href = "index.html";
		return gui;
	};

	// Choose your flowers --------------------------------------------------------------
	M.Choose = function (spec, data, onGo, onBack) {
		Audio.Music("choose");
		const [gui, root] = screen("choose");
		label(root, `Choose your ${Config.MAX_SLOTS} flowers! 🌷`, 0, 4, 980, 60, "title");
		label(root, spec.name + (Config.Minigames[spec.mode] ? "  •  " + Config.Minigames[spec.mode].name : ""), 0, 62, 980, 28, "white");
		const selected = [];
		for (const id of data.loadout || []) if (owns(data, id) && selected.length < Config.MAX_SLOTS && !selected.includes(id)) selected.push(id);
		const need = Math.min(Config.MAX_SLOTS, data.owned.length);
		const top = panel(root, 560, 116, 40, 98, C(130, 85, 40));
		const grid = panel(root, 560, 420, 40, 228, C(150, 105, 60));
		const side = panel(root, 330, 420, 620, 98, C(120, 90, 70));
		label(side, "🐝 Bees in this level", 0, 8, 320, 34, "yellow");
		const beeGrid = el("div", "beegrid", side);
		for (const id of spec.beeList) {
			const card = makeCard(id, { bee: true, w: 70, h: 88 });
			beeGrid.appendChild(card.frame);
			card.frame.title = Config.BeeById[id].name + ": " + Config.BeeById[id].desc;
			if (id === spec.newBee) el("div", "newtag", card.frame, "NEW!");
		}
		let tip = "";
		const A = spec.A;
		if (A.water && owns(data, "lilypad")) tip = "💡 Bring Lotus Rafts to plant on the pond!";
		if (A.id === "night" && spec.mode === "normal") tip = "💡 No nectar falls at night. Bring Moonflowers!";
		if (A.fog && owns(data, "glowlily")) tip = "💡 Firefly Bulbs clear the fog in their lane!";
		if (spec.mode === "laststand") tip = "💡 No nectar this time. Dewcups won't fill!";
		const tipEl = el("div", "sidetip", side, tip);

		const slotRow = el("div", "slotrow", top);
		const scroll = el("div", "cardgrid", grid);
		const tipLabel = label(root, "Tap a flower to see what it does.", 40, 652, 560, 24, "cream small");
		let goBtn;
		const gridCards = {};
		const refresh = () => {
			slotRow.innerHTML = "";
			for (let i = 0; i < Config.MAX_SLOTS; i++) {
				const id = selected[i];
				if (id) {
					const card = makeCard(id, { w: 78, h: 100 });
					slotRow.appendChild(card.frame);
					card.frame.addEventListener("click", () => { selected.splice(selected.indexOf(id), 1); Audio.Sfx("click", 0.9); refresh(); });
				} else el("div", "emptyslot", slotRow, String(i + 1));
			}
			for (const id in gridCards) gridCards[id].setEnabled(!selected.includes(id));
			const ok = selected.length >= need;
			goBtn.style.background = ok ? "rgb(230,80,60)" : "rgb(120,120,120)";
			goBtn.textContent = ok ? "LET'S GROW! 🌱" : `Pick ${need - selected.length} more`;
		};
		const list = data.owned.slice().sort((a, b) => Config.FlowerById[a].index - Config.FlowerById[b].index);
		for (const id of list) {
			const card = makeCard(id, { w: 78, h: 100 });
			scroll.appendChild(card.frame);
			gridCards[id] = card;
			const d = Config.FlowerById[id];
			const tipText = `${d.name} (🍯${d.cost}): ${d.desc}`;
			card.frame.addEventListener("click", () => {
				if (selected.includes(id)) selected.splice(selected.indexOf(id), 1);
				else if (selected.length < Config.MAX_SLOTS) selected.push(id);
				else { Audio.Sfx("thud", 1.4); return; }
				Audio.Sfx("click", 1.1);
				tipLabel.textContent = tipText;
				refresh();
			});
			card.frame.addEventListener("mouseenter", () => { tipLabel.textContent = tipText; });
		}
		goBtn = mbtn(root, "LET'S GROW! 🌱", 620, 530, 330, 70, C(230, 80, 60), () => {
			if (selected.length < need) { Audio.Sfx("thud", 1.4); return; }
			onGo(selected.slice());
		});
		mbtn(root, "⬅ BACK", 620, 608, 330, 50, C(160, 120, 70), onBack);
		refresh();
		return gui;
	};

	// Almanac --------------------------------------------------------------------------
	M.Almanac = function (data, onBack) {
		const [gui, root] = screen("almanac");
		label(root, "📖 GARDEN ALMANAC", 0, 4, 980, 60, "title");
		const left = panel(root, 560, 520, 40, 120, C(150, 105, 60));
		const right = panel(root, 340, 520, 610, 120, C(245, 230, 190));
		const scroll = el("div", "cardgrid tall", left);
		let anim = null;
		const detail = (def, isBee) => {
			right.innerHTML = "";
			const vf = el("canvas", "viewport", right);
			vf.width = 600; vf.height = 420;
			vf.style.background = isBee ? "rgb(255,215,130)" : "rgb(160,220,120)";
			const c2 = vf.getContext("2d");
			const t0 = performance.now();
			const tick = () => {
				if (!vf.isConnected) return;
				const t = (performance.now() - t0) / 1000;
				c2.setTransform(1, 0, 0, 1, 0, 0);
				c2.clearRect(0, 0, 600, 420);
				if (isBee) {
					const s = def.look.scale || 1, k = 52 / Math.max(1, s * 0.8);
					c2.translate(300, 210 + Math.sin(t * 3) * 8); c2.scale(k * (def.look.ball ? 1.4 : 1), k * (def.look.ball ? 1.4 : 1));
					if (s > 1) c2.scale(1 / s * 1.6, 1 / s * 1.6);
					Art.drawBee(c2, def, { t, roll: -t * 2 });
				} else {
					const h = Art.HEIGHT[def.look.type] || 5, k = Math.min(360 / h, 60);
					c2.fillStyle = "rgba(90,60,30,0.25)"; c2.beginPath(); c2.ellipse(300, 395, 140, 18, 0, 0, Math.PI * 2); c2.fill();
					c2.translate(300, 395); c2.scale(k, k);
					Art.drawFlower(c2, def, { t, sway: Math.sin(t * 2) * 0.04, punch: Math.max(0, Math.sin(t * 2.2)) * (def.kind === "shooter" ? 1 : 0), armed: true, spin: t * 2 });
				}
				anim = requestAnimationFrame(tick);
			};
			cancelAnimationFrame(anim);
			tick();
			el("div", "dname", right, def.name);
			let stats;
			if (isBee) {
				const tough = def.hp + (def.armor ? def.armor.hp : 0) + (def.shield ? def.shield.hp : 0);
				const spd = def.speed >= 0.4 ? "Fast" : (def.speed >= 0.25 ? "Medium" : (def.speed >= 0.18 ? "Slow" : "Very slow"));
				stats = `Toughness: ${tough}<br>Speed: ${spd}`;
				if (def.intro <= 60 && def.pool !== false) stats += "<br>First seen: " + Config.LevelName(def.intro);
			} else {
				stats = `Cost: 🍯 ${def.cost}<br>Recharge: ${def.recharge >= 45 ? "Very slow" : (def.recharge >= 30 ? "Slow" : "Fast")}`;
				if (def.dmg) stats += "<br>Damage: " + def.dmg;
				if (def.hp && def.hp < 1e8) stats += "<br>Toughness: " + def.hp;
			}
			el("div", "dstats", right, stats);
			el("div", "ddesc", right, def.desc);
		};
		const show = tab => {
			scroll.innerHTML = "";
			if (tab === "flowers") {
				for (const f of Config.Flowers) {
					if (f.hidden) continue;
					const card = makeCard(f.id, { w: 78, h: 100 });
					scroll.appendChild(card.frame);
					if (owns(data, f.id)) card.frame.addEventListener("click", () => { Audio.Sfx("click", 1); detail(f, false); });
					else card.setLocked();
				}
			} else {
				const seenUpTo = Math.min(60, data.unlocked);
				for (const b of Config.Bees) {
					const card = makeCard(b.id, { w: 78, h: 100, bee: true });
					scroll.appendChild(card.frame);
					if (b.intro <= seenUpTo) card.frame.addEventListener("click", () => { Audio.Sfx("click", 1); detail(b, true); });
					else card.setLocked();
				}
			}
		};
		mbtn(root, "🌼 FLOWERS", 40, 68, 180, 46, C(110, 200, 80), () => show("flowers"));
		mbtn(root, "🐝 BEES", 230, 68, 180, 46, C(240, 180, 40), () => show("bees"));
		mbtn(root, "⬅ BACK", 770, 68, 180, 46, C(160, 120, 70), () => { cancelAnimationFrame(anim); onBack(); });
		show("flowers");
		detail(Config.FlowerById.sunflower, false);
		return gui;
	};

	// Popups ---------------------------------------------------------------------------
	M.Message = function (title, text, btnText, cb, flowerId) {
		const [gui, root] = screen("message");
		const p = panel(root, 600, flowerId ? 520 : 330, 190, flowerId ? 70 : 165, C(140, 95, 50));
		label(p, title, 30, 16, 540, 64, "title");
		let y = 90;
		if (flowerId) {
			const def = Config.FlowerById[flowerId];
			const card = makeCard(flowerId, { w: 170, h: 218 });
			card.frame.classList.add("bigcard");
			Object.assign(card.frame.style, { position: "absolute", left: "215px", top: "92px" });
			p.appendChild(card.frame);
			label(p, def.name, 30, 318, 540, 40, "white");
			y = 362;
		}
		const t = el("div", "msgtext", p, text.replace(/\n/g, "<br>"));
		t.style.top = y + "px";
		mbtn(p, btnText || "OK", 170, (flowerId ? 520 : 330) - 82, 260, 60, C(110, 200, 80), cb);
		Audio.Sfx("magic", 1);
		return gui;
	};
	return M;
})();

// ===================================================================================
// Main: menus -> choose flowers -> play a level -> rewards, in a loop.
// Progress is saved in this browser (localStorage) the same way the Roblox server did.
// ===================================================================================
(() => {
	const KEY = "fvb_save_v1";
	function defaultData() { return { unlocked: 1, owned: Config.START_FLOWERS.slice(), loadout: [], beaten: {}, wins: 0 }; }
	function load() {
		try {
			const d = JSON.parse(localStorage.getItem(KEY));
			if (!d || typeof d !== "object") return defaultData();
			const out = defaultData();
			out.unlocked = clamp(Math.floor(Number(d.unlocked) || 1), 1, 61);
			if (Array.isArray(d.owned)) for (const id of d.owned) if (Config.FlowerById[id] && !Config.FlowerById[id].hidden && !out.owned.includes(id)) out.owned.push(id);
			if (Array.isArray(d.loadout)) out.loadout = d.loadout.filter(id => out.owned.includes(id)).slice(0, Config.MAX_SLOTS);
			if (d.beaten && typeof d.beaten === "object") for (const k in d.beaten) if (d.beaten[k]) out.beaten[k] = true;
			out.wins = Number(d.wins) || 0;
			return out;
		} catch (e) { return defaultData(); }
	}
	let data = load();
	let debug = false; // ?level= test runs never touch the real save
	const save = () => { if (debug) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

	function reportWin(g) {
		const d = data;
		if (g < 1 || g > 60 || g > d.unlocked) return { reward: null };
		const reward = Config.Rewards[g];
		let newFlower = null;
		if (reward && !d.owned.includes(reward)) {
			d.owned.push(reward);
			newFlower = reward;
			if (d.loadout.length < Config.MAX_SLOTS) d.loadout.push(reward);
		}
		const first = !d.beaten[String(g)];
		d.beaten[String(g)] = true;
		d.unlocked = Math.max(d.unlocked, Math.min(61, g + 1));
		d.wins++;
		save();
		return { reward: newFlower, first };
	}

	let current = null;
	const sortedOwned = () => data.owned.slice().sort((a, b) => Config.FlowerById[a].index - Config.FlowerById[b].index);

	function afterWin(g, res) {
		const [a, n] = Config.AreaOf(g);
		const toMap = () => showMap(Math.min(6, Config.AreaOf(Math.min(60, g + 1))[0]));
		const areaMessage = () => {
			if (g === 60) Menus.Message("🏆 YOU WIN! 🏆", "The Zombee Queen has been defeated and the garden is safe forever! Thanks for playing FLOWERS vs BEES!", "BACK TO MAP", toMap);
			else if (n === 10 && res && res.first) {
				const A = Config.Areas[a];
				Menus.Message("NEW AREA UNLOCKED!", `${A.icon} ${A.name} ${A.icon}\nNew bees, new flowers, new dangers!`, "LET'S GO!", toMap);
			} else if (n === 5 && res && res.first) Menus.Message("🏅 MINIGAME BEATEN! 🏅", "You beat " + Config.Minigames[Config.Areas[a - 1].minigame].name + "!", "NICE!", toMap);
			else toMap();
		};
		if (res && res.reward) Menus.Message("You got a new flower!", Config.FlowerById[res.reward].desc, "AWESOME!", areaMessage, res.reward);
		else areaMessage();
	}

	function run(spec, loadout) {
		Menus.Close();
		if (current) { current.destroy(); current = null; }
		const g = spec.g;
		current = new Game(spec, {
			loadout,
			owned: data.owned,
			onEnd: result => {
				if (!current) return;
				const game = current;
				current = null;
				game.destroy();
				if (result.won) afterWin(g, reportWin(g));
				else if (result.retry) startLevel(g);
				else showMap(Config.AreaOf(g)[0]);
			},
		});
	}
	function startLevel(g) {
		const spec = Config.Level(g);
		const usesSlots = !spec.noSlots && !spec.seedRain && spec.mode !== "hivebreaker";
		if (!usesSlots) { run(spec, []); return; }
		const owned = sortedOwned();
		if (owned.length <= Config.MAX_SLOTS) { run(spec, owned); return; }
		Menus.Choose(spec, data, loadout => {
			data.loadout = loadout;
			save();
			run(spec, loadout);
		}, () => showMap(spec.area));
	}
	function showMap(area) {
		Menus.Map(data, {
			play: startLevel,
			almanac: a => Menus.Almanac(data, () => showMap(a)),
		}, area);
	}
	// Debug/QA hook: ?level=37 jumps straight into a level.
	const qs = new URLSearchParams(location.search);
	const lv = parseInt(qs.get("level"), 10);
	if (lv >= 1 && lv <= 60) {
		debug = true;
		const spec = Config.Level(lv);
		const all = Config.Flowers.filter(f => !f.hidden).map(f => f.id);
		const owned = qs.get("all") ? all : data.owned;
		data = Object.assign({}, data, { owned });
		const usesSlots = !spec.noSlots && !spec.seedRain && spec.mode !== "hivebreaker";
		run(spec, usesSlots ? (qs.get("loadout") ? qs.get("loadout").split(",") : sortedOwned().slice(0, 5)) : []);
	} else showMap();
	window.FVB = { get game() { return current; }, Config };
})();

</script>
