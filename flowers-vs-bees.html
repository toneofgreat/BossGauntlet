<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flowers vs Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2a3a1a;font-family:Fredoka,'Fredoka One',system-ui,sans-serif;font-weight:600;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;display:block;cursor:pointer}
.btn{font-family:inherit;font-weight:700;border:3px solid rgb(40,30,10);border-radius:10px;color:#fff;cursor:pointer;background:rgb(120,200,80);text-shadow:0 2px 0 rgba(0,0,0,.35);line-height:1.05;transition:filter .1s,transform .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.96)}
.green{background:rgb(110,200,80)!important}.tan{background:rgb(200,150,70)!important}.orange{background:rgb(220,160,60)!important}.blue{background:rgb(120,140,220)!important}
/* ---- HUD ---- */
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.seedbar{position:absolute;left:8px;top:6px;height:104px;display:flex;gap:6px;align-items:center;padding:0 6px;background:rgb(130,85,40);border:4px solid rgb(70,40,15);border-radius:12px;transform-origin:0 0}
.sunbox{width:78px;height:92px;flex:none;background:rgb(250,235,180);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sunico{font-size:38px;line-height:46px}
.sunnum{font-size:28px;color:rgb(60,40,10);line-height:32px}
.sunbox.flash{animation:sunflash .3s 2}
@keyframes sunflash{50%{background:rgb(255,80,80)}}
.sunnum.pop{animation:sunpop .16s}
@keyframes sunpop{50%{color:rgb(255,160,0);transform:scale(1.2)}}
.card{position:relative;width:72px;height:92px;flex:none;background:rgb(245,235,200);border:3px solid rgb(120,80,30);border-radius:8px;overflow:hidden;cursor:pointer;font-size:11px;transition:transform .1s}
.card.bee{background:rgb(255,235,190)}
.card .band{position:absolute;left:4%;top:4%;width:92%;height:58%;background:rgb(150,215,110);border-radius:6px;overflow:hidden}
.card.bee .band{background:rgb(255,210,120)}
.card .band img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.card .nm{position:absolute;top:63%;left:2%;width:96%;text-align:center;color:rgb(70,45,20);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1em;line-height:1.35em}
.card .cost{position:absolute;top:80%;left:0;width:100%;text-align:center;color:rgb(40,30,10);font-size:1.25em;line-height:1.3em}
.card .shade{position:absolute;left:0;top:0;width:100%;height:0;background:rgba(0,0,0,.5);z-index:5;pointer-events:none}
.card.off::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.33);z-index:4;pointer-events:none}
.card.sel{border-color:#fff;box-shadow:0 0 0 3px #ffe060,0 0 14px #ffe060;transform:translateY(-4px)}
.card.locked{cursor:default}
.card:hover{transform:translateY(-2px)}
.shovel{width:70px;height:70px;flex:none;background:rgb(170,140,90);font-size:26px}
.shovel span{font-size:11px}
.shovel.on{background:rgb(255,230,120);color:rgb(80,50,10)}
.hudright{position:absolute;right:8px;top:8px;display:flex;gap:8px;transform-origin:100% 0}
.hudright .speed{width:80px;height:56px;background:rgb(200,160,60);font-size:20px}
.hudright .pause{width:56px;height:56px;background:rgb(110,150,220);font-size:24px}
.prog{position:absolute;right:12px;bottom:12px;width:250px;transform-origin:100% 100%;pointer-events:none!important}
.proglbl{position:absolute;right:0;bottom:34px;text-align:right;font-size:17px;text-shadow:0 2px 2px rgba(0,0,0,.6);margin-bottom:6px;white-space:nowrap}
.track{position:relative;height:24px;background:rgb(60,40,20);border:3px solid rgb(30,20,10);border-radius:12px}
.track .fill{height:100%;width:0;background:rgb(130,220,70);border-radius:10px}
.track .flag{position:absolute;top:-14px;font-size:20px}
.announce{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(26px,6.5vw,76px);font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none!important;text-shadow:0 0 2px #280000,3px 3px 0 #280000,-3px 3px 0 #280000,3px -3px 0 #280000,-3px -3px 0 #280000;padding:0 4%}
.announce.show{animation:annpop .25s cubic-bezier(.3,1.6,.6,1)}
@keyframes annpop{from{transform:scale(.6)}to{transform:scale(1)}}
.hint{position:absolute;left:12%;right:12%;bottom:84px;text-align:center;font-size:clamp(15px,2.3vw,22px);color:rgb(255,255,200);text-shadow:0 2px 3px #000,0 0 6px #000;pointer-events:none!important;display:none}
.belt{position:absolute;left:8px;top:6px;width:88px;background:rgb(70,60,55) repeating-linear-gradient(to bottom,rgb(95,85,80) 0 6px,transparent 6px 60px);border:4px solid rgb(30,25,20);border-radius:12px;overflow:hidden;transform-origin:0 0}
.belt .card{position:absolute;left:4px}
.bossbar{position:absolute;left:50%;top:120px;width:42%;height:30px;transform:translateX(-50%);background:rgb(40,10,40);border:3px solid rgb(255,200,40);border-radius:10px;overflow:hidden;pointer-events:none!important}
.bfill{height:100%;width:100%;background:rgb(200,40,160);transition:width .15s}
.blbl{position:absolute;inset:0;text-align:center;font-size:17px;line-height:24px;text-shadow:0 2px 0 #000;white-space:nowrap}
.queensay{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,70%);min-height:44px;padding:8px 12px;background:rgba(20,0,25,.88);color:rgb(255,220,80);font-family:'Courier New',monospace;font-weight:700;font-size:clamp(13px,1.8vw,18px);border:3px solid rgb(255,60,160);border-radius:10px;text-align:center;pointer-events:none!important}
.startbtn{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);width:200px;height:64px;background:rgb(230,80,60)!important;font-size:26px}
.flash{position:absolute;inset:0;background:rgb(180,230,255);animation:fadeout .8s forwards;pointer-events:none!important}
@keyframes fadeout{from{opacity:.7}to{opacity:0}}
.ovwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:40}
.overlay{width:420px;flex:none;background:rgb(120,80,40);border:5px solid rgb(60,35,10);border-radius:16px;padding:14px 20px 20px;text-align:center}
.otitle{font-size:44px;color:rgb(255,240,200);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.osub{font-size:21px;color:rgb(255,230,180);margin:4px 0 14px}
.orow{display:flex;gap:12px;margin-top:10px}
.overlay .btn{height:52px;font-size:21px;flex:1}
.overlay .wide{width:100%;display:block;margin-top:10px}
/* ---- Menus ---- */
.menu{position:fixed;inset:0;z-index:10;overflow:hidden;background:linear-gradient(to bottom,rgb(120,200,255) 0%,rgb(190,235,255) 55%,rgb(110,190,70) 56%,rgb(70,140,45) 100%)}
.mbee{position:absolute;left:-8%;font-size:40px;animation:fly linear infinite}
@keyframes fly{from{left:-8%}to{left:110%}}
.mflower{position:absolute;bottom:14px;font-size:44px}
.mroot{position:absolute;left:50%;top:50%;width:980px;height:660px;transform-origin:50% 50%}
.panel{position:absolute;background:rgb(140,95,50);border:5px solid rgb(70,45,20);border-radius:16px}
.mlabel{position:absolute;text-align:center;white-space:nowrap;overflow:hidden;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.45)}
.mlabel.title{color:rgb(255,230,60);text-shadow:0 0 3px rgb(110,60,10),3px 3px 0 rgb(110,60,10),-3px 3px 0 rgb(110,60,10),3px -3px 0 rgb(110,60,10),-3px -3px 0 rgb(110,60,10)}
.panel .mlabel.title{color:rgb(255,235,110)}
.wobble{animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.mlabel.cream{color:rgb(255,245,220)}.mlabel.yellow{color:rgb(255,230,120)}.mlabel.gold{color:rgb(255,230,60)}
.mlabel.small{font-size:17px!important;white-space:normal;line-height:1.2!important;height:auto!important}
.mbtn{position:absolute}
.level{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.level .lvico{font-size:40px;line-height:48px}
.level .lvnum{font-size:26px;line-height:30px}
.level .lvsub{font-size:14px;line-height:18px;color:rgb(255,255,230);height:18px}
.level.locked{cursor:default;filter:none!important}
.wiggle{animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tabs{position:absolute;top:124px;left:0;width:980px;display:flex;justify-content:center;gap:8px}
.tab{width:148px;height:56px;font-size:19px}
.homelink{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:10px;text-decoration:none;font-size:15px;z-index:3}
.beegrid{position:absolute;left:10px;top:46px;right:10px;bottom:66px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow-y:auto}
.newtag{position:absolute;top:-1px;left:0;width:100%;text-align:center;color:rgb(255,60,60);font-size:14px;text-shadow:0 0 2px #fff,0 0 3px #fff;z-index:6}
.sidetip{position:absolute;left:8px;right:8px;bottom:6px;height:56px;color:rgb(255,255,200);font-size:17px;text-align:center;line-height:1.2}
.slotrow{position:absolute;inset:3px 10px;display:flex;gap:10px;align-items:center}
.emptyslot{width:78px;height:100px;flex:none;background:rgb(90,60,30);border-radius:8px;color:rgb(140,100,60);font-size:40px;display:flex;align-items:center;justify-content:center}
.cardgrid{position:absolute;inset:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow-y:auto;padding:4px 2px}
.viewport{position:absolute;left:20px;top:16px;width:calc(100% - 40px);height:210px;border-radius:12px}
.dname{position:absolute;top:232px;left:10px;right:10px;text-align:center;font-size:32px;color:rgb(80,50,20)}
.dstats{position:absolute;top:280px;left:15px;right:15px;font-size:20px;color:rgb(90,60,30);line-height:1.3}
.ddesc{position:absolute;top:384px;left:15px;right:15px;font-size:19px;color:rgb(60,40,20);line-height:1.25}
.msgtext{position:absolute;left:30px;right:30px;font-size:24px;color:rgb(255,245,220);text-align:center;line-height:1.25}
.bigcard{font-size:26px}
.rotate{position:fixed;inset:0;z-index:100;background:rgba(20,30,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;gap:16px}
.rotate .big{font-size:64px}
@media (orientation:portrait) and (max-width:700px){.rotate.armed{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="rotate armed" id="rotate"><div class="big">📱↻</div><div>Flowers vs Bees plays best with your phone turned sideways.</div><button class="btn" style="padding:10px 18px;font-size:20px" onclick="document.getElementById('rotate').classList.remove('armed')">Play anyway</button></div>
<script>
"use strict";
// ===================================================================================
// Config: every flower, bee, area and level in Flowers vs Bees.
// ===================================================================================
const C = (r, g, b) => [r, g, b];
const rgb = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const lerpC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

class RNG {
	constructor(seed) { this.s = (Math.floor(seed) >>> 0) || 1; }
	next() {
		let t = (this.s += 0x6D2B79F5) >>> 0;
		t = Math.imul(t ^ (t >>> 15), t | 1);
		t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	}
	num(a, b) { return a === undefined ? this.next() : a + this.next() * (b - a); }
	int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
}

const Config = {};
Config.TILE = 7;
Config.COLS = 9;
Config.MAX_SLOTS = 5;
Config.LEVELS_PER_AREA = 10;
Config.START_FLOWERS = ["sunflower", "rose"];

// Flowers ------------------------------------------------------------------------
// The ids stay the same (levels and saves use them); everything players see and
// every mechanic is this game's own. kind decides behaviour in Game.lua's port.
Config.Flowers = [
	{ id: "sunflower", name: "Dewcup", cost: 50, recharge: 7.5, hp: 300, kind: "cup", fill: 5, every: 4.8, cap: 50,
		look: { type: "cup", color: C(120, 200, 255) },
		desc: "Its cup slowly fills with nectar. Click it to pour out what's inside — it holds up to 50, then stops filling." },
	{ id: "rose", name: "Spine Rose", cost: 100, recharge: 7.5, hp: 300, kind: "shooter", dmg: 20, interval: 1.4, proj: "spine", pierce: 1,
		look: { type: "srose", color: C(200, 30, 70) }, desc: "Fires long spines that go THROUGH the first bee and hit the one behind it for half damage." },
	{ id: "tulip", name: "Pollen Tulip", cost: 150, recharge: 45, hp: 1e9, kind: "cloud", dps: 380, radius: 1.5, fuse: 0.9, last: 5,
		look: { type: "ptulip", color: C(255, 170, 30) }, desc: "Bursts into a 3x3 pollen cloud for 5 seconds. Bees inside can't stop sneezing — they freeze in place and take heavy damage." },
	{ id: "thornbush", name: "Briar Patch", cost: 50, recharge: 30, hp: 1e9, kind: "briar", slow: 0.3, dps: 12, ground: true,
		look: { type: "briar" }, desc: "A low tangle of briars. Bees don't stop to sting it — they get caught in it, crawl through at a third of their speed and get scratched." },
	{ id: "pinecone", name: "Burr Clump", cost: 25, recharge: 20, hp: 1e9, kind: "burr", hold: 6, dps: 150, ground: true,
		look: { type: "burr" }, desc: "Ready right away. The first bee that flies over it gets stuck in the burrs for 6 seconds and is shredded." },
	{ id: "snowlily", name: "Frostbell", cost: 175, recharge: 7.5, hp: 300, kind: "bell", dmg: 30, interval: 2.5, radius: 2.2,
		look: { type: "bell", color: C(170, 225, 255) }, desc: "Rings an icy chime every 2½ seconds. Every bee within 2 tiles — in any direction — is chilled and slowed." },
	{ id: "dandelion", name: "Dandelion Clock", cost: 0, recharge: 7.5, hp: 300, kind: "clock", dmg: 90, regrow: 15,
		look: { type: "clock" }, desc: "FREE! When a bee gets close it bursts into seeds that blow nearby bees back a tile. Then it slowly puffs up again." },
	{ id: "moonflower", name: "Moonflower", cost: 25, recharge: 7.5, hp: 300, kind: "moon", amount: 15, radius: 2.5,
		look: { type: "moon" }, desc: "Feeds on beaten bees. Every bee beaten within 2½ tiles of it leaves behind a drop of nectar." },
	{ id: "flytrap", name: "Pitcher Plant", cost: 150, recharge: 7.5, hp: 300, kind: "pitcher", lure: 3, holds: 2, dps: 60,
		look: { type: "pitcher" }, desc: "Its sweet smell lures the nearest bee in its lane (up to 3 tiles away) into its jug, where it's slowly digested. Holds 2 bees." },
	{ id: "doom", name: "Corpse Flower", cost: 125, recharge: 50, hp: 1e9, kind: "stink", dmg: 300, radius: 3.3, fuse: 1.2, lingers: 30,
		look: { type: "corpse" }, desc: "Lets out the WORST smell in the garden. Every bee nearby flees all the way back to the hive. The ground stinks for a while after." },
	{ id: "lilypad", name: "Lotus Raft", cost: 25, recharge: 7.5, hp: 300, kind: "pad", aquatic: true, boost: 1.25,
		look: { type: "raft" }, desc: "A floating lotus leaf you can plant on. Flowers riding it work 25% faster in the cool water." },
	{ id: "doublerose", name: "Ricochet Rose", cost: 200, recharge: 7.5, hp: 300, kind: "shooter", dmg: 30, interval: 1.4, proj: "ricochet", bounce: 1,
		look: { type: "srose", color: C(255, 90, 160), bounce: true }, desc: "Its thorns bounce off the bee they hit and fly into a bee in the next lane." },
	{ id: "snapper", name: "Bladderwort", cost: 25, recharge: 20, hp: 300, kind: "bladder", aquatic: true, reach: 1.5, reset: 20,
		look: { type: "bladder" }, desc: "Lives in the pond. Sucks the nearest bee within 1½ tiles under the water — then needs 20 seconds to reset." },
	{ id: "daisy3", name: "Daisy Wheel", cost: 325, recharge: 7.5, hp: 300, kind: "wheel", dmg: 20, interval: 0.47,
		look: { type: "wheel" }, desc: "Spins round and round, flinging a petal into the lane above, its own lane, the lane below, its own lane... and repeat." },
	{ id: "cattail", name: "Reed Pipe", cost: 225, recharge: 7.5, hp: 300, kind: "sniper", dmg: 90, interval: 2.5, aquatic: true,
		look: { type: "reed" }, desc: "A water reed that plays one piercing note at the TOUGHEST bee anywhere on the lawn." },
	{ id: "twinsun", name: "Dew Fountain", cost: 125, recharge: 30, hp: 300, kind: "fountain", amount: 10, interval: 8,
		look: { type: "fountain" }, desc: "Sprinkles 10 nectar into every Dewcup touching it, every 8 seconds. Surround it with Dewcups!" },
	{ id: "firepoppy", name: "Fire Poppy", cost: 175, recharge: 7.5, hp: 300, kind: "scorch", dps: 110, interval: 6, last: 3, length: 2,
		look: { type: "poppy" }, desc: "Every 6 seconds it scorches the 2 tiles in front of it. Bees flying through the flames burn." },
	{ id: "pumpkin", name: "Squirting Cucumber", cost: 300, recharge: 7.5, hp: 300, kind: "lobber", dmg: 70, bounceDmg: 35, interval: 2.8,
		look: { type: "cucumber" }, desc: "Pops its seeds out in a high arc — over umbrellas — and they bounce on to the next bee behind." },
	{ id: "lightning", name: "Storm Iris", cost: 200, recharge: 7.5, hp: 300, kind: "storm", dmg: 40, max: 6, range: 4,
		look: { type: "iris" }, desc: "Stores up a spark every second (up to 6). When a bee comes within 4 tiles, it lets ALL of them go at once." },
	{ id: "glowlily", name: "Firefly Bulb", cost: 25, recharge: 30, hp: 300, kind: "firefly",
		look: { type: "firefly" }, desc: "Sends fireflies down its whole lane, lighting up the fog so you can see what's hiding in it." },
	{ id: "lavender", name: "Lavender Haze", cost: 250, recharge: 7.5, hp: 300, kind: "haze", dmg: 40, interval: 7, sleep: 2.5, range: 4,
		look: { type: "haze", color: C(170, 115, 235) }, desc: "Puffs out a sleepy scent every 7 seconds. Bees within 4 tiles in its lane doze off for a moment." },
	{ id: "magnet", name: "Rust Marigold", cost: 100, recharge: 7.5, hp: 300, kind: "rust", dps: 120, range: 3,
		look: { type: "rust" }, desc: "Drips a sap that eats through shells and helmets. Hard armour on bees within 3 tiles crumbles away." },
	{ id: "icerose", name: "Frost Fern", cost: 75, recharge: 50, hp: 1e9, kind: "frostfern", freeze: 6, cols: 3,
		look: { type: "fern" }, desc: "Throws up a wall of frost: every bee in its column and the 2 columns in front of it is frozen for 6 seconds." },
	{ id: "garlic", name: "Mint Sprig", cost: 50, recharge: 7.5, hp: 400, kind: "mint", back: 2.5,
		look: { type: "mint" }, desc: "SO minty. A bee that stings it gets a mouthful and buzzes BACKWARDS toward the hive for a few seconds." },
	{ id: "star", name: "Maple Spinner", cost: 125, recharge: 7.5, hp: 300, kind: "boomerang", dmg: 20, interval: 2, range: 4,
		look: { type: "maple" }, desc: "Throws helicopter seeds that spin 4 tiles out and come back — hitting every bee on the way out AND on the way back." },
	{ id: "thistle", name: "Saguaro", cost: 125, recharge: 30, hp: 6000, kind: "saguaro", prick: 20,
		look: { type: "saguaro" }, desc: "A giant cactus that bees have to chew through. Every bee stinging it gets pricked back." },
	{ id: "gloom", name: "Strangler Fig", cost: 150, recharge: 7.5, hp: 300, kind: "fig", dmg: 60, interval: 3, radius: 1.5, hold: 1,
		look: { type: "fig" }, desc: "Every 3 seconds its roots burst up and grab every bee within 1½ tiles, holding and squeezing them." },
	// Minigame-only (Pinecone Bowling)
	{ id: "bowl", name: "Rolling Pinecone", cost: 0, recharge: 0, hp: 1, kind: "roll", dmg: 300, hidden: true,
		look: { type: "pinecone", rolling: true }, desc: "Roll it! It bounces off bees." },
	{ id: "bowlx", name: "Explosive Pinecone", cost: 0, recharge: 0, hp: 1, kind: "roll", dmg: 1800, explode: true, hidden: true,
		look: { type: "pinecone", rolling: true, red: true }, desc: "Roll it! KABOOM on the first bee." },
	{ id: "bowlg", name: "Giant Pinecone", cost: 0, recharge: 0, hp: 1, kind: "roll", dmg: 1800, giant: true, hidden: true,
		look: { type: "pinecone", rolling: true, giant: true }, desc: "Rolls over EVERYTHING in its lane." },
];
Config.FlowerById = {};
Config.Flowers.forEach((f, i) => { f.index = i + 1; Config.FlowerById[f.id] = f; });

// Bees -----------------------------------------------------------------------------
// speed = tiles per second. cost = how much of a wave's budget the bee uses.
Config.Bees = [
	{ id: "worker", name: "Worker Bee", hp: 200, speed: 0.22, cost: 1, weight: 6, intro: 1,

function beePool(g, area, filter) {
	const pool = [];
	for (const b of Config.Bees) {
		if (b.pool !== false && b.intro <= g && (!filter || filter[b.id])) {
			let w = b.weight || 1;
			if (Math.ceil(b.intro / 10) === area) w *= 2;
			if (b.id === "worker") w = Math.max(2, w - (area - 1));
			if (area === 6 && b.id === "worker") w = 1;
			pool.push({ def: b, w });
		}
	}
	return pool;
}

function pickBee(rng, pool, maxCost, budget) {
	const ok = e => e.def.cost <= maxCost && (!e.def.minBudget || budget >= e.def.minBudget);
	let total = 0;
	for (const e of pool) if (ok(e)) total += e.w;
	if (total <= 0) return null;
	let r = rng.next() * total;
	for (const e of pool) if (ok(e)) { r -= e.w; if (r <= 0) return e.def; }
	return pool[0].def;
}

// Builds the full spec for level g (1..60).
Config.Level = function (g) {
	const [area, n] = Config.AreaOf(g);
	const A = Config.Areas[area - 1];
	const rng = new RNG(g * 7919 + 13);
	const spec = {
		g, area, n, A, rows: A.rows, mode: "normal", startSun: 50, sky: A.sky,
		music: A.music, reward: Config.Rewards[g], name: Config.LevelName(g), firstWave: 20,
	};
	if (n === 5) { spec.mode = A.minigame; spec.music = "minigame"; }
	else if (n === 10) { spec.mode = area === 6 ? "boss" : "conveyor"; spec.music = area === 6 ? "boss" : "conveyor"; }
	spec.active = {};
	for (let r = 1; r <= spec.rows; r++) spec.active[r] = (g !== 1 || r === 3) && (g > 3 || (r >= 2 && r <= 4));

	let count = 10, mult = 1;
	if (g === 1) count = 4; else if (g === 2) count = 6; else if (g === 3) count = 8; else if (n >= 6) count = 15;
	let filter = null;
	const m = spec.mode;
	if (m === "conveyor") { count = 20; mult = 1.3; spec.startSun = 0; spec.belt = Config.Belts[area - 1]; spec.firstWave = 12; spec.sky = null; }
	else if (m === "boss") { count = 0; spec.startSun = 0; spec.belt = Config.Belts[area - 1]; spec.sky = null; spec.beltRate = 3.2; }
	else if (m === "bowling") { count = 10; mult = 1.1; spec.startSun = 0; spec.belt = Config.BowlBelt; spec.sky = null; spec.bowlLine = 3; spec.firstWave = 10; spec.beltRate = 2.6; }
	else if (m === "whack") {
		count = 12; mult = 1.4; spec.startSun = 0; spec.sky = null; spec.firstWave = 6;
		spec.belt = { tulip: 1, icerose: 0.6, pinecone: 1 }; spec.beltRate = 9;
		filter = { worker: true, bumble: true, hornet: true, armored: true, moth: true };
	}
	else if (m === "laststand") { count = 15; mult = 1.2; spec.startSun = 5000; spec.sky = null; spec.noSun = true; spec.prep = true; }
	else if (m === "seedrain") { count = 10; mult = 1.1; spec.startSun = 0; spec.sky = null; spec.seedRain = true; spec.firstWave = 14; }
	else if (m === "invisibee") { count = 10; mult = 1; }
	else if (m === "hivebreaker") { count = 0; spec.startSun = 0; spec.sky = null; }
	spec.beltRate = spec.beltRate || 3.6;
	if (spec.belt) spec.noSlots = true;

	const pool = beePool(g, area, filter);
	let newBee = null;
	for (const b of Config.Bees) if (b.intro === g && b.pool !== false) newBee = b;
	spec.newBee = newBee && newBee.id;
	const strength = 1 + (g - 1) * 0.06;
	spec.waves = [];
	for (let w = 1; w <= count; w++) {
		const flag = (w % 10 === 0) || w === count;
		let budget = strength * (1 + (w - 1) * 0.3) * mult;
		if (flag) budget *= 2.4;
		budget = Math.max(1, Math.floor(budget + 0.5));
		const wave = { flag, bees: [] };
		const spread = flag ? 7 : 4;
		if (flag) { wave.bees.push({ id: "flag", t: 0 }); budget -= 1; }
		if (newBee && (w === 2 || w === 4 || flag) && newBee.cost <= budget) {
			wave.bees.push({ id: newBee.id, t: rng.next() * spread }); budget -= newBee.cost;
		}
		let guard = 0;
		while (budget > 0 && guard < 60) {
			guard++;
			const b = pickBee(rng, pool, budget, budget);
			if (!b) break;
			wave.bees.push({ id: b.id, t: rng.next() * spread });
			budget -= b.cost;
		}
		wave.bees.sort((a, b) => a.t - b.t);
		spec.waves.push(wave);
	}
	const seen = {};
	let list = [];
	for (const wv of spec.waves) for (const e of wv.bees) if (!seen[e.id]) { seen[e.id] = true; list.push(e.id); }
	if (m === "boss") list = ["worker", "bumble", "armored", "zombee", "ghost", "knight", "giant", "honeyball"];
	if (m === "hivebreaker") list = ["worker", "bumble", "armored", "zombee", "ghost", "knight", "hopper"];
	list.sort((a, b) => Config.BeeById[a].index - Config.BeeById[b].index);
	spec.beeList = list;
	return spec;
};

Config.WeightedPick = function (rng, weights) {
	let total = 0;
	for (const id in weights) if (weights[id] > 0) total += weights[id];
	if (total <= 0) return null;
	let r = rng.next() * total, last = null;
	for (const id in weights) {
		const w = weights[id];
		if (w > 0) { last = id; r -= w; if (r <= 0) return id; }
	}
	return last;
};

	layout() {
		DPR = Math.min(2, window.devicePixelRatio || 1);

	// ------------------------------------------------------------------ construction
	buildBoard() {

		}
		if (A.graves && spec.mode !== "hivebreaker" && spec.mode !== "boss") {

	setupVases() {
		const rng = new RNG(Date.now() % 100000);

	// ------------------------------------------------------------------ selection & planting
	clearSelection() {

	canPlant(def, c, r) {

		if (cell.grave || cell.vase || cell.crater > 0 || cell.stink > 0) return false;
		if (this.spec.bowlLine && c > this.spec.bowlLine) return false;
		if (def.kind === "roll") return !cell.main && !cell.pad && !cell.water;

	tryPlant(c, r) {

		if (sel.slot !== undefined) {

			slot.cdMax = def.recharge;

	addPlant(def, c, r) {
		const cell = this.grid[r][c];
		const onPad = def.kind !== "pad" && !!cell.pad;
		const p = {
			def, c, r, x: c - 0.5, hp: def.hp, onPad, inWater: cell.water && !onPad && def.kind !== "pad",
			timer: 0.3, grow: 0, punch: 0, sticky: 0, dazeT: 0, phase: Math.random() * 6,
		};

		if (k === "cloud" || k === "stink") p.fuse = def.fuse;
		if (k === "frostfern") p.fuse = 0.6;
		if (k === "clock") { p.state = "puff"; p.regrowT = 0; }

		if (k === "bladder") p.cool = 0;
		if (k === "wheel") { p.turn = 0; p.spin = 0; }
		if (k === "storm") { p.sparks = 0; p.timer = 1; }
		if (k === "fountain") p.timer = def.interval;
		if (k === "scorch" || k === "haze" || k === "fig") p.timer = 1.5;
		if (k === "boomerang") p.timer = 0.5;
		if (k === "bell") p.timer = 1;

		if (cell.pad === p) {

			if (cell.main && !cell.main.def.aquatic) this.removePlant(cell.main);
		}
		// a pitcher that dies lets its bees go
		if (p.held) for (const b of p.held) if (!b.dead) { b.inPitcher = null; b.x = p.x + 0.4; }

	// Giant Bee: push a flower one tile left, or uproot it if there's no room.
	shovePlant(r, c) {

		if (!cell) return;
		const p = cell.main || cell.pad;
		if (!p) return;
		Audio.Sfx("thud", 0.8);
		this.shake = 0.3;
		const to = this.grid[r][c - 1];
		if (cell.main && c > 1 && to && !to.main && !to.grave && !to.vase && !to.stink && (to.water ? !!to.pad : true) && !p.def.aquatic) {
			cell.main = null; to.main = p;
			p.c = c - 1; p.x = c - 1.5; p.onPad = !!to.pad; p.inWater = to.water && !to.pad;
			this.puff(p.x + 0.5, r, 1, C(140, 100, 60));

		}
	}
	shovelAt(c, r) {
		const cell = this.grid[r] && this.grid[r][c];
		if (!cell) return;
		const p = cell.main || cell.pad;
		if (p) { this.removePlant(p); Audio.Sfx("shovel"); this.puff(c - 0.5, r, 1, C(140, 100, 60)); }
		this.clearSelection();
	}

	// ------------------------------------------------------------------ conveyor belt
	beltMax() { return Math.floor(((this.L.H - 20) / this.uiS - 10) / 98); }
	addBeltCard(id) {
		if (this.beltCards.length >= Math.max(3, this.beltMax())) return false;
		const card = makeCard(id, { free: true });
		const y = (this.L.H - 20) / this.uiS + 10;
		card.frame.style.top = y + "px";
		this.beltFrame.appendChild(card.frame);
		const bc = { card, id, y };
		card.frame.addEventListener("pointerdown", ev => { ev.stopPropagation(); this.selectBelt(bc); });
		this.beltCards.push(bc);
		return true;
	}
	removeBeltCard(bc) {
		const i = this.beltCards.indexOf(bc);
		if (i >= 0) this.beltCards.splice(i, 1);
		bc.card.frame.remove();
	}
	updateBelt(dt) {
		if (!this.beltFrame) return;
		this.beltFrame.style.backgroundPosition = `0 ${(-this.t * 40) % 60}px`;
		this.beltCards.forEach((bc, i) => {
			const target = 8 + i * 98;
			bc.y = Math.max(target, bc.y - 160 * dt);
			bc.card.frame.style.top = bc.y + "px";
		});
		if (this.spec.belt && this.state === "play") {
			this.beltTimer -= dt;
			if (this.beltTimer <= 0) {
				this.beltTimer = this.spec.beltRate;
				const id = Config.WeightedPick(this.beltRng, this.spec.belt);
				if (id) this.addBeltCard(id);
			}
		}
	}

	// ------------------------------------------------------------------ sun
	spawnSun(x, row, y, value, fromSky) {
		const s = { x, row, y, value: value || 25, life: 0, spin: Math.random() * 6 };
		if (fromSky) { s.state = "fall"; s.groundY = 2.2; }
		else { s.state = "hop"; s.vy = 14; s.vx = rnd(-0.6, 0.6); s.vr = rnd(-0.3, 0.4); s.groundY = 1.8; }
		this.suns.push(s);
		return s;
	}
	collectSun(s) {
		if (s.state === "collect") return;
		s.state = "collect";
		s.from = this.S(s.x, s.row, s.y);
		s.ct = 0;
		Audio.Sfx("sun");
	}
	sunTarget() {
		if (this.sunBox.style.display === "none" || this.seedBar.style.display === "none") return [60, 50];
		const r = this.sunBox.getBoundingClientRect();
		return [r.left + r.width / 2, r.top + r.height * 0.35];
	}
	updateSuns(dt) {
		for (let i = this.suns.length - 1; i >= 0; i--) {
			const s = this.suns[i];
			s.spin += dt * 1.5;
			if (s.state === "fall") {
				s.y -= 6 * dt;
				if (s.y <= s.groundY) { s.y = s.groundY; s.state = "rest"; }
			} else if (s.state === "hop") {
				s.vy -= 40 * dt;
				s.y += s.vy * dt; s.x += s.vx * dt; s.row += s.vr * dt;
				if (s.y <= s.groundY && s.vy < 0) { s.y = s.groundY; s.state = "rest"; }
			} else if (s.state === "rest") {
				s.life += dt;
			} else if (s.state === "collect") {
				s.ct += dt / this.speed * 2.4;
				if (s.ct >= 1) {
					this.sun += s.value;
					this.suns.splice(i, 1);
					this.sunLabel.classList.remove("pop"); void this.sunLabel.offsetWidth; this.sunLabel.classList.add("pop");
					continue;
				}
			}
			if (s.state === "rest" && s.life > 11) this.suns.splice(i, 1);
		}
	}

	// ------------------------------------------------------------------ bees
	randomRow() {
		const rows = [];
		for (let r = 1; r <= this.rows; r++) if (this.spec.active[r]) rows.push(r);
		return rows[rint(0, rows.length - 1)];
	}
	spawnBee(id, row, x, opts) {
		opts = opts || {};
		const def = Config.BeeById[id];
		row = row || this.randomRow();
		const s = def.look.scale || 1;
		const b = {
			def, row, rowF: row, x: x !== undefined && x !== null ? x : rnd(9.7, 10.3), hp: def.hp, maxHp: def.hp,
			armor: def.armor ? def.armor.hp : 0, metal: def.armor && def.armor.metal,
			shield: def.shield ? def.shield.hp : 0, shieldMetal: def.shield && def.shield.metal,
			slowT: 0, frozenT: 0, state: "walk", t: Math.random() * 10,
			hover: def.look.ball ? 1.7 : (def.look.larva ? 1.6 : 2.6 + 0.8 * s), hw: 0.32 * s + 0.12,
			phaseT: Math.random() * 5, laneT: rnd(4, 8), honeyT: rnd(3, 6), shootT: 1.5, rise: opts.rise ? 1 : 0,
			speed: def.speed, flash: 0, hopY: 0, dropped: {}, parries: def.parry || 0, backT: 0, sleepT: 0, stuckT: 0, glued: new Set(),
		};
		this.bees.push(b);
		this.peakHp = Math.max(this.peakHp, this.totalHp());
		return b;
	}
	totalHp() { let t = 0; for (const b of this.bees) t += b.hp + b.armor + b.shield; return t; }
	targetable(b) { return !b.dead && !b.down && !b.phased && b.rise <= 0 && b.x < 9.55; }
	laneHasTarget(row, x, range) {
		for (const b of this.bees) if (b.row === row && this.targetable(b) && b.x >= x - 0.3 && (!range || b.x <= x + range)) return true;
		if (this.boss && !this.boss.dead && (!range || x + range >= 9.1)) return true;
		return false;
	}
	firstBee(row, x, range) {
		let best = null;
		for (const b of this.bees) if (b.row === row && this.targetable(b) && b.x >= x - 0.3 && (!range || b.x <= x + range)) if (!best || b.x < best.x) best = b;
		return best;
	}
	anyBee() {
		for (const b of this.bees) if (this.targetable(b)) return true;
		return !!(this.boss && !this.boss.dead);
	}
	setTint(b, tint) { b.tint = tint; }
	dropGroup(b, g) {
		if (b.dropped[g]) return;
		if (g === "armor" && !b.def.armor) return;
		if (g === "shield" && !b.def.shield) return;
		if (g === "larva") return;
		if (g === "sacks" && !b.def.look.sacks) return;
		b.dropped[g] = true;
		if (this.spec.mode === "invisibee") return;
		const sc = b.def.look.scale || 1;
		let x = b.x, row = b.rowF, y = b.hover + (b.hopY || 0);
		let vx = rnd(0.3, 0.8), vy = 10;
		const look = b.def.armor && b.def.armor.look;
		this.addFx(0.8, (f, a, dt) => { vy -= 40 * dt; y += vy * dt; x += vx * dt; f.x = x; f.y = y; f.rot = a * 3; f.alpha = 1 - a; },
			(f) => { this.drawAt(f.x, row, f.y, sc, f.rot, f.alpha, c2 => Art.drawDrop(c2, g, look)); }, null, { x, y, rot: 0, alpha: 1 });
	}
	damageBee(b, dmg, o) {
		o = o || {};
		if (b.dead || b.down || b.inPitcher) return;
		if (b.phased && !o.explosive) return;
		if (b.parries > 0 && o.front) { // Bone Knight parries shots from the front
			b.parries--;
			this.popup(b.x, b.rowF, 4.5, "PARRY!", C(230, 230, 255));
			Audio.Sfx("metal", 1.3);
			return;
		}
		if (o.frost) {
			if (b.slowT <= 0 && !b.def.look.ball) this.setTint(b, C(120, 200, 255));
			b.slowT = Math.max(b.slowT, o.slow || 4);
		} else if (o.fire && b.slowT > 0) {
			b.slowT = 0;
			this.setTint(b, null);
		}
		// Umbrella Bee: the leaf only stops things coming from above
		if (b.shield > 0 && (o.lob || o.above)) {
			b.shield -= dmg;
			Audio.Sfx("hit", 0.6);
			if (b.shield > 0) return;
			dmg = -b.shield;
			b.shield = 0;
			this.dropGroup(b, "shield");
		}
		if (b.armor > 0) {
			b.armor -= dmg;
			if (b.metal && !o.quietHit) Audio.Sfx("metal");
			if (b.armor > 0) { b.flash = 0.08; return; }
			dmg = -b.armor;
			b.armor = 0;
			this.dropGroup(b, "armor");
			if (b.def.shellSpeed) b.speed = b.def.shellSpeed;
		}
		if (dmg <= 0) return;
		b.hp -= dmg;
		b.flash = 0.08;
		if (b.def.dodge && !b.dodged && b.hp > 0) { b.dodged = true; this.changeLane(b); this.popup(b.x, b.rowF, 4.5, "JINK!", C(255, 160, 60)); }
		if (!b.lostWing && b.hp < b.maxHp * 0.4 && !b.def.look.ball && !b.def.look.larva) {
			b.lostWing = true;
			this.dropGroup(b, "wingR");
		}
		if (b.hp <= 0) this.killBee(b, o);
	}
	killBee(b, o) {
		o = o || {};
		const def = b.def;
		if (def.revive && !b.revived && !o.noRevive) {
			b.revived = true;
			b.down = true;
			b.downT = 2.5;
			b.hp = b.maxHp * 0.5;
			b.state = "walk";
			return;
		}
		b.dead = true;
		this.lastDeath = { x: b.x, row: b.rowF, y: b.hover };
		if (def.split) for (let i = 1; i <= def.splitCount; i++) { const nb = this.spawnBee(def.split, b.row, b.x + (i - 2) * 0.35); nb.rowF = b.rowF; }
		if (def.hatch && !o.quiet) for (let i = 0; i < def.hatch; i++) { const lb = this.spawnBee("larva", b.row, clamp(b.x + (i - 1) * 0.45, 0.6, 9.4)); lb.rise = 0.4; }
		if (def.daze && !o.quiet) { // Stink Bee: knocks out the flowers next to it
			for (let r = b.row - 1; r <= b.row + 1; r++) for (let c = Math.round(b.x) - 1; c <= Math.round(b.x) + 1; c++) {
				const cell = this.grid[r] && this.grid[r][c];
				const p = cell && (cell.main || cell.pad);
				if (p) p.dazeT = Math.max(p.dazeT || 0, def.daze);
			}
			this.ring(b.x, b.rowF, 1, 2.4 * TILE, C(150, 200, 60), 0.6);
		}
		// Moonflowers turn beaten bees into nectar
		for (const p of this.plants) {
			if (p.dead || p.def.kind !== "moon" || p.sticky > 0 || p.dazeT > 0) continue;
			if (Math.hypot(p.x - b.x, p.r - b.rowF) <= p.def.radius) { this.spawnSun(b.x, b.rowF, Math.max(2, b.hover), p.def.amount); p.punch = 1; }
		}
		Audio.Sfx("hit", 0.8);
		const x = b.x, row = b.rowF, hover = b.hover + (b.hopY || 0), sc = 1, inv = this.spec.mode === "invisibee" || b.inPitcher;
		const drawOpts = { t: b.t, wingLost: b.lostWing, armor: false, shield: false, larva: false, sacks: !b.dropped.sacks, bomb: false, tint: b.tint, frozen: true };
		this.addFx(0.9, null, f => {
			const a = f.a || 0;
			if (inv) return;
			this.drawAt(x, row, hover - a * (hover - 0.6), sc, a * 2.6, 1 - a * a, c2 => Art.drawBee(c2, def, drawOpts));
		});
	}
	changeLane(b) {
		const options = [];
		for (const d of [-1, 1]) { const r = b.row + d; if (r >= 1 && r <= this.rows && this.spec.active[r]) options.push(r); }
		if (!options.length) return;
		b.row = options[rint(0, options.length - 1)];
	}
	contactPlant(row, x) {
		const c = Math.floor(x + 0.5);
		if (c < 1 || c > COLS) return null;
		const d = x - (c - 0.5);
		if (d < -0.05 || d > 0.75) return null;
		const cell = this.grid[row][c];
		const p = cell.main || cell.pad;
		if (!p) return null;
		const k = p.def.kind;
		// ground-level and one-shot flowers can't be stung — bees fly over them
		if (k === "briar" || k === "burr" || k === "cloud" || k === "stink" || k === "frostfern" || k === "bladder") return null;
		return [p, c];
	}
	flattenCell(r, c) {
		const cell = this.grid[r] && this.grid[r][c];
		if (!cell) return;
		if (cell.main) this.removePlant(cell.main);
		if (cell.pad) this.removePlant(cell.pad);
	}
	updateBees(dt) {
		const medics = this.bees.filter(b => b.def.heal && !b.dead);
		this.scoutBoost = this.bees.some(b => b.def.scout && !b.dead && b.rise <= 0) ? 1.15 : 1;
		for (let i = this.bees.length - 1; i >= 0; i--) {
			const b = this.bees[i];
			if (b.dead) this.bees.splice(i, 1);
			else this.updateBee(b, dt, medics);
		}
	}
	updateBee(b, dt, medics) {
		const def = b.def;
		b.t += dt;
		b.flash = Math.max(0, b.flash - dt);
		if (b.rowF !== b.row) {
			const d = b.row - b.rowF, step = 1.6 * dt;
			b.rowF = Math.abs(d) <= step ? b.row : b.rowF + step * (d > 0 ? 1 : -1);
		}
		if (b.rise > 0) { b.rise = Math.max(0, b.rise - dt * 1.4); return; }
		if (b.down) {
			b.downT -= dt;
			if (b.downT <= 0) { b.down = false; this.setTint(b, C(120, 255, 120)); this.delay(0.6, () => { if (!b.dead) this.setTint(b, null); }); }
			return;
		}
		if (b.inPitcher) return;
		if (b.lure) { // being drawn into a Pitcher Plant
			b.lure.t += dt;
			const a = Math.min(1, b.lure.t);
			b.x = b.lure.fromX + (b.lure.p.x - b.lure.fromX) * a;
			if (a >= 1) { b.inPitcher = b.lure.p; b.lure.p.held.push(b); b.lure.p.luring = null; b.lure = null; Audio.Sfx("slurp"); }
			return;
		}
		if (def.phase) { b.phaseT += dt; b.phased = (b.phaseT % 5) > 3.2; }
		for (const m of medics) if (m !== b && Math.abs(m.x - b.x) < 1.6 && Math.abs(m.rowF - b.rowF) < 1.5) b.hp = Math.min(b.maxHp, b.hp + m.def.heal * dt);
		if (b.frozenT > 0) {
			b.frozenT -= dt;
			if (b.frozenT <= 0) this.setTint(b, b.slowT > 0 ? C(120, 200, 255) : null);
			return;
		}
		if (b.slowT > 0) { b.slowT -= dt; if (b.slowT <= 0) this.setTint(b, null); }
		if (b.sleepT > 0) { b.sleepT -= dt; return; }
		if (b.stuckT > 0) { b.stuckT -= dt; return; }
		if (b.inCloud) { b.inCloud = false; return; }
		let mdt = dt * (b.slowT > 0 ? 0.5 : 1) * (this.scoutBoost || 1);
		// caught in a Briar Patch?
		const bc = Math.floor(b.x) + 1, bcell = this.grid[b.row] && this.grid[b.row][bc];
		if (bcell && bcell.main && bcell.main.def.kind === "briar" && !bcell.main.dead && bcell.main.dazeT <= 0 && bcell.main.sticky <= 0 && !def.look.ball) {
			mdt *= bcell.main.def.slow;
			this.damageBee(b, bcell.main.def.dps * dt, { quietHit: true });
			if (b.dead) return;
		}
		if (b.backT > 0) { // Mint Sprig: buzzing backwards
			b.backT -= dt;
			b.x = Math.min(9.6, b.x + b.speed * mdt);
			b.state = "walk";
			return;
		}
		if (def.dropAt && !b.dropped.sacks && b.hp < b.maxHp * def.dropAt) { this.dropGroup(b, "sacks"); b.speed = def.dropSpeed; }
		if (b.state === "shove") {
			b.windT -= mdt;
			if (b.windT <= 0) { this.shovePlant(b.row, b.targetC); b.state = "walk"; }
			return;
		}
		if (def.laneChange) {
			b.laneT -= dt;
			if (b.laneT <= 0 && b.state === "walk" && b.x < 9) { b.laneT = rnd(4, 8); this.changeLane(b); }
		}
		if (def.honey && b.x < 9.3) {
			b.honeyT -= mdt;
			if (b.honeyT <= 0) {
				b.honeyT = 7;
				let target = null;
				for (let c = Math.min(COLS, Math.floor(b.x)); c >= Math.max(1, Math.floor(b.x - 5)); c--) {
					const cell = this.grid[b.row][c];
					const p = cell.main || cell.pad;
					if (p && p.sticky <= 0 && p.def.kind !== "burr" && p.def.kind !== "briar") { target = p; break; }
				}
				if (target) this.enemyShot("honey", b, target);
			}
		}
		// Sniper Bee: stops far out and shoots the priciest flower in its lane
		if (def.sniper && b.x <= 8.3) {
			let best = null;
			for (let c = 1; c <= COLS; c++) {
				const cell = this.grid[b.row][c], p = cell.main || cell.pad;
				if (p && c - 0.5 < b.x - 0.6 && p.def.kind !== "burr" && p.def.kind !== "briar" && (!best || p.def.cost > best.def.cost || (p.def.cost === best.def.cost && p.c > best.c))) best = p;
			}
			if (best) {
				b.state = "shoot";
				b.shootT -= mdt;
				if (b.shootT <= 0) { b.shootT = 5; this.enemyShot("stinger", b, best); }

			}
		}
		let hit = this.contactPlant(b.row, b.x);
		if (hit && def.glue) { // Honey Wave rolls right over, gluing flowers shut
			const [p] = hit;
			if (!b.glued.has(p)) { b.glued.add(p); p.sticky = Math.max(p.sticky, def.glue); Audio.Sfx("splash", 1.2); }
			hit = null;
		}
		if (hit) {
			const [p, c] = hit;
			if (def.cut && !b.didCut) { // Leafcutter Wasp
				b.didCut = true;
				p.hp -= p.hp * def.cut; p.hurt = 0.3;
				b.speed = def.cutSpeed;
				this.popup(p.x, p.r, 4, "SNIP!", C(140, 255, 120));
				Audio.Sfx("chomp", 1.5);
			}
			if (def.shove) { b.state = "shove"; b.windT = 1.0; b.targetC = c; return; }
			b.state = "sting";
			p.hp -= (def.dps || 100) * mdt;
			p.hurt = 0.1;
			if (p.def.kind === "saguaro") this.damageBee(b, p.def.prick * mdt, { quietHit: true });
			if (p.def.kind === "mint" && !b.dead) {
				b.mintT = (b.mintT || 0) + dt;
				if (b.mintT > 0.4) { b.mintT = 0; b.backT = p.def.back; b.state = "walk"; this.popup(b.x, b.rowF, 4, "BLEH!", C(140, 255, 180)); }
			}
			if (p.hp <= 0) { this.removePlant(p); Audio.Sfx("chomp", 1.3); b.state = "walk"; }
			return;
		}
		b.state = "walk";
		b.x -= b.speed * mdt;
		if (b.x < 0.05) {
			const mower = this.mowers[b.row];
			if (mower && !mower.active && !mower.used) { mower.active = true; mower.used = true; Audio.Sfx("mower"); }
			else if (!mower || (mower.used && !mower.active)) { if (b.x < -0.85) this.lose(b); }
		}
	}

	updatePlants(dt) {
		for (let i = this.plants.length - 1; i >= 0; i--) {
			const p = this.plants[i];
			if (p.dead) { this.plants.splice(i, 1); continue; }
			p.grow = Math.min(1, p.grow + dt * 4);
			p.punch = Math.max(0, p.punch - dt * 5);
			p.hurt = Math.max(0, (p.hurt || 0) - dt);
			let pdt = dt;
			if (this.beamCol && p.c === this.beamCol) pdt *= 2;
			if (p.onPad) pdt *= 1.25; // Lotus Raft
			if (p.dazeT > 0) { p.dazeT -= dt; continue; }
			if (p.sticky > 0) p.sticky -= dt;
			else this.updatePlant(p, pdt);
		}
	}
	fire(p, kind, row, opts) {
		const pr = this.addProj(kind, p.x + 0.4, row || p.r, 9, 0, p.def.dmg, opts);
		if (opts && opts.rowTarget) { pr.row = p.r; pr.rowTarget = row; }
		p.punch = 1;
		Audio.Sfx("shoot");
		return pr;
	}
	beesNear(x, row, radius) { return this.bees.filter(b => this.targetable(b) && Math.hypot(b.x - x, b.rowF - row) <= radius); }
	updatePlant(p, dt) {
