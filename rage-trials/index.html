<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="RAGE TRIALS - ten levels of precision platforming, fake blocks, flinging machines, an obby tycoon and a Tetris finale. Mobile first, no download." />
<title>RAGE TRIALS</title>
<style>
/* ============================================================== tokens === */
:root{
  --bg:#05060d;
  --bg2:#0a0f24;
  --ink:#eaf2ff;
  --dim:#94a6c8;
  --dimmer:#5d6c8a;
  --neon:#3df0ff;
  --neon2:#ff3ea5;
  --neon3:#ffd23f;
  --good:#5bff9b;
  --bad:#ff5b5b;
  --line:rgba(61,240,255,.28);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --ui:"Trebuchet MS","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}

/* ============================================================== reset ==== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
html{background:#05060d;}
body{
  position:fixed;inset:0;width:100%;height:100%;
  background:#05060d;color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.35;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
[hidden]{display:none !important;}
img{max-width:100%;}
button{font-family:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer;touch-action:manipulation;}
h1,h2,h3,p{margin:0;}

/* ============================================================== canvas === */
canvas#game{
  position:fixed;inset:0;width:100%;height:100%;display:block;
  background:#05060d;touch-action:none;
}

/* ============================================================== scanline = */
#scan{
  position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.24;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:overlay;
}
body.noscan #scan{display:none;}

/* ============================================================== HUD ====== */
#hud{
  position:fixed;left:0;right:0;top:0;z-index:6;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
  pointer-events:none;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.hud-right{justify-content:flex-end;}
.hud-chip{
  display:flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:11px;
  background:linear-gradient(180deg,rgba(12,18,40,.82),rgba(6,9,22,.82));
  border:1px solid var(--line);
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  font-weight:800;letter-spacing:.06em;white-space:nowrap;font-size:13px;
}
#hudNum{
  font-family:var(--mono);font-size:12px;font-weight:900;
  color:#05060d;background:var(--neon);padding:2px 6px;border-radius:6px;
}
#hudName{color:var(--ink);text-transform:uppercase;max-width:42vw;overflow:hidden;text-overflow:ellipsis;}
.hud-chip .lbl{font-size:9px;letter-spacing:.16em;color:var(--dimmer);font-weight:900;}
.hud-chip .val{font-family:var(--mono);font-size:15px;font-weight:900;color:var(--ink);}
.hud-chip.coins .val{color:var(--neon3);}
.hud-chip.cash .val{color:var(--good);}
.hud-chip.warn .val{color:var(--bad);}
#btnPause{
  pointer-events:auto;width:44px;height:44px;min-width:44px;border-radius:12px;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,22,48,.9),rgba(6,9,22,.9));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
}
#btnPause:active{transform:translateY(1px);}
#btnPause .bar{display:block;width:4px;height:16px;background:var(--neon);border-radius:2px;}
#btnPause .bar+.bar{margin-left:4px;}

/* ============================================================== banner === */
#banner{
  position:fixed;left:0;right:0;top:calc(var(--sat) + 62px);z-index:7;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  pointer-events:none;padding:0 16px;text-align:center;
  animation:bannerIn .38s cubic-bezier(.2,1.4,.4,1) both;
}
#banner.out{animation:bannerOut .3s ease-in both;}
/* readable over ANY theme - pastel clouds included */
#banner .bline{
  font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  font-size:clamp(17px,4.6vw,30px);color:#fff;
  -webkit-text-stroke:4px rgba(4,6,16,.88);
  paint-order:stroke fill;
  text-shadow:0 0 16px rgba(61,240,255,.8),0 4px 14px rgba(0,0,0,.75);
}
#banner .bline.sub2{
  font-size:clamp(12px,3vw,17px);color:#6ff6ff;letter-spacing:.14em;
  -webkit-text-stroke:3.5px rgba(4,6,16,.88);
}
@keyframes bannerIn{from{opacity:0;transform:translateY(-18px) scale(.94);}to{opacity:1;transform:none;}}
@keyframes bannerOut{to{opacity:0;transform:translateY(-12px) scale(.98);}}

/* ============================================================== toast ==== */
#toast{
  position:fixed;left:50%;bottom:calc(var(--sab) + 150px);z-index:7;pointer-events:none;
  padding:9px 18px;border-radius:999px;max-width:86vw;text-align:center;
  background:rgba(8,12,28,.92);border:1px solid var(--line);
  box-shadow:0 6px 24px rgba(0,0,0,.6);
  font-weight:800;letter-spacing:.05em;font-size:14px;
  animation:toastIn .22s ease-out both;
}
#toast.out{animation:toastOut .26s ease-in both;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0);}to{opacity:0;transform:translateX(-50%) translateY(10px);}}

/* ============================================================== pads ===== */
#pads{position:fixed;inset:0;z-index:5;pointer-events:none;}
.pad-group{
  position:absolute;bottom:calc(var(--sab) + 16px);
  display:flex;align-items:flex-end;gap:14px;pointer-events:none;
}
#padMove{left:calc(var(--sal) + 16px);}
#padAct{right:calc(var(--sar) + 16px);}
body.lefty #padMove{left:auto;right:calc(var(--sar) + 16px);flex-direction:row-reverse;}
body.lefty #padAct{right:auto;left:calc(var(--sal) + 16px);flex-direction:row-reverse;}
.pad{
  pointer-events:auto;touch-action:none;
  width:76px;height:76px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(20,30,60,.62),rgba(8,12,28,.62));
  border:2px solid rgba(61,240,255,.4);
  box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
  color:var(--neon);
  transition:transform .06s ease,background .09s ease,border-color .09s ease;
}
.pad svg{width:38%;height:38%;display:block;fill:currentColor;}
.pad.big{width:98px;height:98px;border-radius:28px;color:var(--neon3);border-color:rgba(255,210,63,.5);}
.pad.big svg{width:44%;height:44%;}
.pad.act{color:var(--neon2);border-color:rgba(255,62,165,.5);}
.pad.down{
  transform:translateY(3px) scale(.96);
  background:linear-gradient(180deg,rgba(61,240,255,.34),rgba(20,40,80,.62));
  border-color:rgba(255,255,255,.75);
}
.pad.big.down{background:linear-gradient(180deg,rgba(255,210,63,.36),rgba(60,44,10,.62));}
.pad.act.down{background:linear-gradient(180deg,rgba(255,62,165,.34),rgba(60,12,40,.62));}

/* ============================================================== screens == */
.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px);
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(61,240,255,.10),transparent 60%),
    radial-gradient(110% 80% at 50% 100%,rgba(255,62,165,.10),transparent 62%),
    rgba(4,5,12,.86);
  -webkit-backdrop-filter:blur(7px) saturate(1.2);backdrop-filter:blur(7px) saturate(1.2);
  overflow:auto;-webkit-overflow-scrolling:touch;
  animation:screenIn .2s ease-out both;
}
@keyframes screenIn{from{opacity:0;}to{opacity:1;}}
/* the title screen keeps the live canvas visible behind it */
#menu,#theEnd{
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(61,240,255,.10),transparent 58%),
    radial-gradient(110% 80% at 50% 100%,rgba(255,62,165,.13),transparent 60%),
    rgba(4,5,12,.40);
  -webkit-backdrop-filter:blur(1.5px) saturate(1.15);backdrop-filter:blur(1.5px) saturate(1.15);
}
.panel{
  width:min(560px,100%);
  background:linear-gradient(180deg,rgba(14,20,44,.92),rgba(7,10,24,.94));
  border:1px solid var(--line);border-radius:22px;
  box-shadow:0 22px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.07);
  padding:20px 18px;
  display:flex;flex-direction:column;gap:14px;
  max-height:100%;
}
.panel.wide{width:min(900px,100%);}
.panel h2{
  font-size:clamp(20px,5.2vw,30px);font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  text-align:center;color:#fff;text-shadow:0 0 16px rgba(61,240,255,.55);
}
.panel h3{font-size:11px;letter-spacing:.2em;color:var(--dimmer);font-weight:900;text-transform:uppercase;}
.sub{text-align:center;color:var(--dim);font-size:13px;letter-spacing:.04em;}
.col{display:flex;flex-direction:column;gap:10px;}
.spacer{flex:1;}

/* ============================================================== buttons == */
.btn{
  position:relative;width:100%;
  min-height:64px;padding:16px 22px;border-radius:16px;
  font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:16px;
  color:var(--ink);
  background:linear-gradient(180deg,rgba(24,34,70,.95),rgba(11,16,36,.95));
  border:2px solid rgba(61,240,255,.34);
  box-shadow:0 4px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .07s ease,box-shadow .07s ease,border-color .12s ease,background .12s ease;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);}
.btn.primary{
  color:#02121a;
  background:linear-gradient(180deg,#7ff7ff,#16c9e6);
  border-color:#bffcff;
  box-shadow:0 4px 0 #0a6e83,0 0 26px rgba(61,240,255,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.btn.primary:active{box-shadow:0 1px 0 #0a6e83,0 0 18px rgba(61,240,255,.4);}
.btn.hot{
  color:#21030f;
  background:linear-gradient(180deg,#ff8ec6,#ef2b8e);
  border-color:#ffc4e2;box-shadow:0 4px 0 #8e0b4b,0 0 26px rgba(255,62,165,.42);
}
.btn.ghost{background:linear-gradient(180deg,rgba(18,24,48,.7),rgba(8,11,26,.7));border-color:rgba(148,166,200,.28);color:var(--dim);}
.btn.small{min-height:48px;padding:10px 16px;font-size:13px;width:auto;}
.btn[disabled]{opacity:.42;pointer-events:none;}

.toggle{
  min-height:56px;width:100%;padding:12px 16px;border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg,rgba(18,26,54,.8),rgba(8,12,28,.8));
  border:2px solid rgba(148,166,200,.22);
  font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase;color:var(--dim);
  transition:border-color .12s ease,color .12s ease,transform .07s ease;
}
.toggle b{
  font-family:var(--mono);font-size:13px;letter-spacing:.1em;
  padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.45);color:var(--dimmer);
}
.toggle.on{border-color:rgba(91,255,155,.55);color:var(--ink);}
.toggle.on b{background:rgba(91,255,155,.18);color:var(--good);}
.toggle:active{transform:translateY(2px);}

/* ============================================================== menu ===== */
.menu-wrap{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;}
.title{font-size:min(clamp(44px,15vw,104px),20vh);line-height:.86;font-weight:900;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;}
.title .t1{
  color:#fff;transform:skewX(-6deg);
  text-shadow:0 0 8px #fff,0 0 26px var(--neon2),0 0 54px var(--neon2),0 6px 0 rgba(0,0,0,.6);
}
.title .t2{
  color:#fff;letter-spacing:.06em;transform:skewX(-6deg);
  text-shadow:0 0 8px #fff,0 0 26px var(--neon),0 0 54px var(--neon),0 6px 0 rgba(0,0,0,.6);
  animation:flick 5.5s infinite steps(1);
}
@keyframes flick{0%,96%,100%{opacity:1;}97%{opacity:.35;}98%{opacity:1;}99%{opacity:.5;}}
.tag{
  color:var(--neon);font-weight:900;letter-spacing:.34em;text-transform:uppercase;
  font-size:clamp(10px,2.8vw,14px);
  padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(6,10,24,.6);
}
.menu-btns{width:min(340px,100%);display:flex;flex-direction:column;gap:11px;margin-top:4px;}
.menu-foot{color:var(--dimmer);font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase;}

/* ============================================================== select === */
.panel-head{display:flex;align-items:center;gap:10px;}
.panel-head h2{flex:1;}
.panel-foot{text-align:center;color:var(--dimmer);font-size:11px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;}
.grid{
  display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  overflow:auto;-webkit-overflow-scrolling:touch;padding:2px;
}
.lvcard{
  position:relative;text-align:left;min-height:96px;padding:12px 12px 10px;border-radius:14px;
  background:linear-gradient(180deg,rgba(22,32,66,.92),rgba(9,13,30,.92));
  border:2px solid rgba(61,240,255,.3);
  box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:3px;overflow:hidden;
  transition:transform .08s ease,border-color .12s ease;
}
.lvcard:active{transform:translateY(3px);}
.lvcard .n{font-family:var(--mono);font-size:26px;font-weight:900;color:var(--neon);line-height:1;}
.lvcard .nm{font-weight:900;letter-spacing:.06em;font-size:12.5px;text-transform:uppercase;color:#fff;}
.lvcard .st{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em;}
.lvcard .tagline{font-size:10px;color:var(--dimmer);letter-spacing:.05em;}
.lvcard.done{border-color:rgba(91,255,155,.55);}
.lvcard.done .n{color:var(--good);}
.lvcard.locked{border-color:rgba(148,166,200,.18);opacity:.5;}
.lvcard.locked .n{color:var(--dimmer);}
.lvcard .lock{position:absolute;right:11px;top:11px;font-size:16px;opacity:.85;}
.lvcard.boss{border-color:rgba(255,62,165,.5);}
.lvcard.boss .n{color:var(--neon2);}

/* ============================================================== results == */
.card .rank{
  align-self:center;width:84px;height:84px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;color:#02121a;
  background:radial-gradient(circle at 34% 30%,#bffcff,#16c9e6);
  box-shadow:0 0 34px rgba(61,240,255,.6),inset 0 -5px 0 rgba(0,0,0,.18);
  text-shadow:0 2px 0 rgba(255,255,255,.35);
}
.card .rank.r-S{background:radial-gradient(circle at 34% 30%,#fff3b0,#ffc31f);box-shadow:0 0 38px rgba(255,210,63,.65),inset 0 -5px 0 rgba(0,0,0,.18);}
.card .rank.r-C,.card .rank.r-D{background:radial-gradient(circle at 34% 30%,#ffc4e2,#ef2b8e);box-shadow:0 0 34px rgba(255,62,165,.55),inset 0 -5px 0 rgba(0,0,0,.18);color:#21030f;}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.stats .stat{
  flex:1 1 92px;min-width:92px;text-align:center;padding:11px 8px;border-radius:13px;
  background:rgba(0,0,0,.34);border:1px solid rgba(148,166,200,.16);
}
.stats .stat span{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);font-weight:900;}
.stats .stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:900;color:#fff;margin-top:3px;}
.best{text-align:center;font-size:11.5px;letter-spacing:.12em;font-weight:800;color:var(--neon3);text-transform:uppercase;min-height:14px;}
.endtitle{font-size:clamp(30px,9vw,58px) !important;color:#fff;text-shadow:0 0 12px #fff,0 0 40px var(--neon2),0 0 80px var(--neon2);}
.rating{
  text-align:center;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  font-size:clamp(14px,4.2vw,22px);color:var(--neon3);text-shadow:0 0 18px rgba(255,210,63,.6);
}
.credits{text-align:center;color:var(--dimmer);font-size:10.5px;letter-spacing:.16em;line-height:1.7;text-transform:uppercase;}

/* ============================================================== overlay == */
.overlay .panel{width:min(620px,100%);}
.overlay-card{position:relative;padding-top:26px;}
.closebtn{
  position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(148,166,200,.25);background:rgba(0,0,0,.4);
  font-weight:900;font-size:16px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;
}
#overlayBody{overflow:auto;-webkit-overflow-scrolling:touch;font-size:14px;color:var(--ink);}
#overlayBody h3{color:var(--neon);font-size:13px;letter-spacing:.16em;margin:14px 0 6px;}
#overlayBody h3:first-child{margin-top:0;}
#overlayBody p{color:var(--dim);margin:0 0 8px;line-height:1.55;}
#overlayBody ul{margin:0 0 10px;padding-left:18px;color:var(--dim);line-height:1.6;}
#overlayBody b,#overlayBody strong{color:var(--ink);}
#overlayBody kbd{
  font-family:var(--mono);font-size:11px;background:rgba(61,240,255,.14);color:var(--neon);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:0 1px;
}
.shopgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}

/* ============================================================== keys ===== */
.keys{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;
  font-size:10.5px;color:var(--dimmer);letter-spacing:.08em;font-weight:800;text-transform:uppercase;
}
.keys span b{color:var(--neon);font-family:var(--mono);}
body.touch .keys{display:none;}

/* ============================================================== layout === */
@media (max-height:460px){
  .pad{width:68px;height:68px;border-radius:19px;}
  .pad.big{width:86px;height:86px;border-radius:24px;}
  .pad-group{bottom:calc(var(--sab) + 10px);gap:11px;}
  #padMove{left:calc(var(--sal) + 10px);}
  #padAct{right:calc(var(--sar) + 10px);}
  .panel{padding:14px;gap:10px;border-radius:18px;}
  .btn{min-height:64px;padding:12px 18px;font-size:15px;}
  .title{font-size:clamp(38px,11vh,62px);}
  .menu-wrap{gap:10px;}
  #banner{top:calc(var(--sat) + 46px);}
  #toast{bottom:calc(var(--sab) + 108px);}
  .card .rank{width:60px;height:60px;font-size:32px;}
}
/* short screens: the results / end card must fit without scrolling */
@media (max-height:620px){
  .panel{gap:9px;padding:15px 16px;}
  .card .rank{width:56px;height:56px;font-size:31px;}
  .panel h2{font-size:clamp(18px,4.4vw,24px);}
  .stats .stat{padding:8px 6px;min-width:80px;}
  .stats .stat b{font-size:19px;}
  .stats .stat span{font-size:9px;}
  .sub{font-size:12px;}
  .credits{display:none;}
}
/* very short screens (landscape phones): lay the cards out sideways */
@media (max-height:500px){
  .card .rank{width:46px;height:46px;font-size:25px;}
  .card .col,.pause-main{flex-direction:row;flex-wrap:wrap;}
  .card .col .btn,.pause-main .btn{flex:1 1 0;min-width:110px;font-size:13px;padding:10px 12px;letter-spacing:.08em;}
  .pause-set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pause-set .toggle{flex-direction:column;justify-content:center;gap:4px;min-height:60px;font-size:10.5px;letter-spacing:.06em;text-align:center;}
  .best{min-height:0;}
  .panel{gap:8px;}
  .menu-btns{width:min(460px,100%);}
}
/* narrow screens: one HUD row, no wrapping, no collision with the banner */
@media (max-width:540px){
  .hud-left,.hud-right{flex-wrap:nowrap;gap:5px;}
  #hudName{display:none;}
  .hud-chip{padding:5px 9px;gap:5px;font-size:12px;}
  .hud-chip .lbl{font-size:8px;letter-spacing:.1em;}
  .hud-chip .val{font-size:13px;}
  #hudNum{font-size:11px;padding:2px 5px;}
  #btnPause{width:40px;height:40px;min-width:40px;border-radius:11px;}
  #btnPause .bar{height:14px;width:3.5px;}
  #banner{top:calc(var(--sat) + 54px);}
}
@media (min-width:760px){
  .pad{width:86px;height:86px;}
  .pad.big{width:110px;height:110px;}
  .grid{grid-template-columns:repeat(5,1fr);}
}
@media (orientation:portrait){
  .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));}
}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="scan"></div>

<!-- ============================================================ HUD ===== -->
<div id="hud" hidden>
  <div class="hud-left">
    <div class="hud-chip" id="hudLevel"><span id="hudNum">01</span><span id="hudName">-</span></div>
  </div>
  <div class="hud-right">
    <div id="hudExtra" class="hud-right"></div>
    <div class="hud-chip coins" id="hudCoinChip" hidden><span class="lbl">COINS</span><span class="val" id="hudCoins">0</span></div>
    <div class="hud-chip" id="hudDeathChip"><span class="lbl">DEATHS</span><span class="val" id="hudDeaths">0</span></div>
    <div class="hud-chip" id="hudTimeChip"><span class="lbl">TIME</span><span class="val" id="hudTime">0:00</span></div>
    <button id="btnPause" aria-label="Pause"><span class="bar"></span><span class="bar"></span></button>
  </div>
</div>

<!-- ======================================================= banner/toast = -->
<div id="banner" hidden></div>
<div id="toast" hidden></div>

<!-- ============================================================ pads ==== -->
<div id="pads" hidden>
  <div id="padMove" class="pad-group">
    <button class="pad" id="padLeft" aria-label="Move left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2.5 6 12l10.5 9.5z"/></svg>
    </button>
    <button class="pad" id="padRight" aria-label="Move right">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2.5 18 12 7.5 21.5z"/></svg>
    </button>
  </div>
  <div id="padAct" class="pad-group">
    <button class="pad act" id="padAction" aria-label="Action">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6 14.9 8l6.9.7-5.2 4.6 1.5 6.8L12 16.6 5.9 20.1l1.5-6.8L2.2 8.7 9.1 8z"/></svg>
    </button>
    <button class="pad big" id="padJump" aria-label="Jump">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 22 13h-5.6v8.8H7.6V13H2z"/></svg>
    </button>
  </div>
</div>

<!-- ============================================================ menu ==== -->
<div id="menu" class="screen" hidden>
  <div class="menu-wrap">
    <h1 class="title"><span class="t1">RAGE</span><span class="t2">TRIALS</span></h1>
    <p class="tag">Ten trials. Infinite rage.</p>
    <div class="menu-btns">
      <button class="btn primary" id="btnPlay">PLAY</button>
      <button class="btn" id="btnLevels">TRIALS</button>
      <button class="btn ghost" id="btnHow">HOW TO PLAY</button>
    </div>
    <div class="menu-foot" id="menuStats"></div>
  </div>
</div>

<!-- ============================================================ select == -->
<div id="levelSelect" class="screen" hidden>
  <div class="panel wide">
    <div class="panel-head">
      <button class="btn small ghost" id="btnBackMenu">BACK</button>
      <h2>SELECT A TRIAL</h2>
      <div class="spacer"></div>
    </div>
    <div id="levelGrid" class="grid"></div>
    <div class="panel-foot" id="selStats"></div>
  </div>
</div>

<!-- ============================================================ pause === -->
<div id="pause" class="screen" hidden>
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="col pause-main">
      <button class="btn primary" id="btnResume">RESUME</button>
      <button class="btn" id="btnRestart">RESTART TRIAL</button>
      <button class="btn" id="btnPauseLevels">TRIAL SELECT</button>
      <button class="btn ghost" id="btnPauseMenu">MAIN MENU</button>
    </div>
    <h3>SETTINGS</h3>
    <div class="col pause-set">
      <button class="toggle" id="tgSound"><span>Sound</span><b>ON</b></button>
      <button class="toggle" id="tgPads"><span>Touch pads</span><b>ON</b></button>
      <button class="toggle" id="tgLefty"><span>Left-handed</span><b>OFF</b></button>
    </div>
    <div class="keys">
      <span><b>A/D</b> move</span><span><b>SPACE</b> jump</span><span><b>E</b> action</span>
      <span><b>R</b> retry</span><span><b>ESC</b> pause</span>
    </div>
  </div>
</div>

<!-- ============================================================ results = -->
<div id="results" class="screen" hidden>
  <div class="panel card">
    <div class="rank" id="resRank">A</div>
    <h2 id="resTitle">TRIAL CLEAR</h2>
    <div class="sub" id="resSub"></div>
    <div class="stats">
      <div class="stat"><span>TIME</span><b id="resTime">0:00</b></div>
      <div class="stat"><span>DEATHS</span><b id="resDeaths">0</b></div>
      <div class="stat"><span>COINS</span><b id="resCoins">0</b></div>
    </div>
    <div class="best" id="resBest"></div>
    <div class="col">
      <button class="btn primary" id="btnNext">NEXT TRIAL</button>
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn ghost" id="btnResLevels">TRIAL SELECT</button>
    </div>
  </div>
</div>

<!-- ============================================================ the end = -->
<div id="theEnd" class="screen" hidden>
  <div class="panel card">
    <h2 class="endtitle">THE END</h2>
    <div class="rating" id="endRating"></div>
    <div class="stats" id="endStats"></div>
    <div class="sub" id="endSub"></div>
    <div class="col">
      <button class="btn primary" id="btnEndLevels">TRIAL SELECT</button>
      <button class="btn ghost" id="btnEndMenu">MAIN MENU</button>
    </div>
    <div class="credits">RAGE TRIALS &middot; procedural art &middot; synthesised sound &middot; no downloads</div>
  </div>
</div>

<!-- ============================================================ overlay = -->
<div id="overlay" class="screen overlay" hidden>
  <div class="panel overlay-card">
    <button class="closebtn" id="overlayClose" aria-label="Close">&#10005;</button>
    <div id="overlayBody"></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="entities.js"></script>
<script src="modes/tetris.js"></script>
<script src="modes/tycoon.js"></script>
<script src="levels/level01.js"></script>
<script src="levels/level02.js"></script>
<script src="levels/level03.js"></script>
<script src="levels/level04.js"></script>
<script src="levels/level05.js"></script>
<script src="levels/level06.js"></script>
<script src="levels/level07.js"></script>
<script src="levels/level08.js"></script>
<script src="levels/level09.js"></script>
<script src="levels/level10.js"></script>
<script>
(function () {
  if (window.RT && typeof window.RT.boot === 'function') {
    window.RT.boot();
  } else {
    document.body.innerHTML =
      '<div class="screen"><div class="panel"><h2>ENGINE MISSING</h2>' +
      '<p class="sub">engine.js failed to load. Check the console.</p></div></div>';
  }
})();
</script>
</body>
</html>
