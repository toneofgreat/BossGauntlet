<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OofWorld — moved</title>
<link rel="icon" href="data:,">
<!-- OofCubes was renamed OofWorld on 2026-09-25. The game lives at /oofworld/ now; this
     path stays so old links and bookmarks still land on it.

     Two redirects on purpose: the meta refresh works with no JavaScript at all, and the
     script below goes first when there IS script, because only it can carry a deep link's
     "#/place/obby" across. Progress is untouched either way — saves are keyed on the
     origin, not the path. -->
<meta http-equiv="refresh" content="1;url=../oofworld/">
<script>
  (function () {
    try {
      location.replace("../oofworld/" + location.search + location.hash);
    } catch (err) {
      /* the meta refresh above is the fallback */
    }
  }());
</script>
<style>
  html, body { margin: 0; height: 100%; background: #17191c; color: #f2f4f6;
               font: 400 16px/1.5 "Segoe UI", Roboto, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: #00a2ff; }
  a { color: #00a2ff; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1><span>Oof</span>World</h1>
  <p>OofCubes is called OofWorld now, and it lives one door along.</p>
  <p><a href="../oofworld/">Open OofWorld →</a></p>
</main>
</body>
</html>
