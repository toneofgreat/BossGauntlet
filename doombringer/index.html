// ===================================================================================
// Fights: the shared hazard framework (Fight.lua), the Undertale-style battle-box
// bosses (UTBoss.lua) and the DOOMBRINGER himself (Doom.lua).
// ===================================================================================
const FIGHT = { current: null };

class Fight {
	constructor() {
		this.hazards = []; this.alive = true; this.t = 0; this.iframe = 0; this.dmgMult = 1;
		this.onEnd = []; this.waiters = []; this.framers = [];
	}
	playerRoot() { return PLAYER.pos.clone().add(V3(0, 3, 0)); }
	wait(s) { return new Promise(res => { if (!this.alive) return res(false); this.waiters.push({ at: this.t + (s || 0), res }); }); }
	frame() { return new Promise(res => { if (!this.alive) return res(null); this.framers.push(res); }); }
	async animate(duration, fn) {
		const t0 = this.t;
		while (true) {
			const a = clamp((this.t - t0) / duration, 0, 1);
			fn(a);
			if (a >= 1) return true;
			if ((await this.frame()) === null) return false;
		}
	}
	add(h) { h.age = 0; h.life = h.life || 5; h.dmg = h.dmg === undefined ? 15 : h.dmg; this.hazards.push(h); return h; }
	hits(h, pos) {
		if (h.test) return h.test(pos);
		const m = h.part;
		if (!m || !m.parent) return false;
		if (h.shape === "ball") return pos.distanceTo(m.position) <= (h.radius || m.scale.x / 2) + 1.5;
		if (h.shape === "ring") {
			const off = pos.clone().sub(h.center);
			const flat = Math.hypot(off.x, off.z);
			if (Math.abs(flat - h.r) > h.width / 2 + 1) return false;
			if (off.y > h.height + 2.2 || off.y < -3) return false;
			if (h.gap) { const ang = Math.atan2(off.z, off.x); const d = Math.abs(((ang - h.gapAngle + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI); if (d < h.gap / 2) return false; }
			return true;
		}
		const inv = new THREE.Matrix4().compose(m.position, m.quaternion, V3(1, 1, 1)).invert();
		const p = pos.clone().applyMatrix4(inv), s = m.scale;
		return Math.abs(p.x) <= s.x / 2 + 1 && Math.abs(p.y) <= s.y / 2 + 2.5 && Math.abs(p.z) <= s.z / 2 + 1;
	}
	hurt(amount) {
		if (this.t < this.iframe || PLAYER.dead) return;
		this.iframe = this.t + 0.75;
		GAME.hurt(amount * this.dmgMult);
	}
	update(dt) {
		if (!this.alive) return;
		this.t += dt;
		const fr = this.framers; this.framers = [];
		for (const r of fr) r(dt);
		for (let i = this.waiters.length - 1; i >= 0; i--) if (this.t >= this.waiters[i].at) { const w = this.waiters.splice(i, 1)[0]; w.res(true); }
		if (!this.alive) return;
		const pos = this.playerRoot();
		for (let i = this.hazards.length - 1; i >= 0; i--) {
			const h = this.hazards[i];
			h.age += dt;
			if (h.update) { try { h.update(h, dt); } catch (e) { console.warn("[Fight]", e); h.age = h.life; } }
			if (h.age >= h.life) {
				if (h.onEnd) h.onEnd(h);
				if (h.part && !h.keep) this.remove(h.part);
				if (h.parts) for (const p of h.parts) this.remove(p);
				this.hazards.splice(i, 1);
			} else if (h.age >= (h.arm || 0) && h.dmg > 0 && this.hits(h, pos)) {
				this.hurt(h.dmg);
				if (h.once) h.age = h.life;
			}
		}
		if (this.tick) this.tick(dt);
	}
	remove(m) { if (m && m.parent) m.parent.remove(m); }
	playerDied() { this.finish(false); }
	finish(win) {
		if (!this.alive) return;
		this.alive = false;
		for (const w of this.waiters) w.res(false);
		for (const r of this.framers) r(null);
		this.waiters = []; this.framers = [];
		for (const cb of this.onEnd) cb(win);
	}
	// visuals
	neon(cf, size, color, opts) {
		opts = opts || {};
		const m = box(null, cf, size, color, "Neon", { collide: false, ray: false });
		if (opts.transparency) { m.material = new THREE.MeshBasicMaterial({ color: col3(color), transparent: true, opacity: 1 - opts.transparency, depthWrite: false }); m.userData.ownMat = true; }
		return m;
	}
	setOpacity(m, op) {
		if (!m.userData.ownMat) { m.material = new THREE.MeshBasicMaterial({ color: m.material.color.clone(), transparent: true, depthWrite: false }); m.userData.ownMat = true; }
		m.material.opacity = op;
	}
	warn(pos, radius, t, color) {
		const w = part({ cf: CF(pos.x, 0.15, pos.z), size: [0.2, radius * 2, radius * 2], shape: "cyl", color: color || [255, 0, 0], mat: "Neon", collide: false, ray: false });
		this.setOpacity(w, 0.4);
		fx(t, a => { w.material.opacity = 0.4 + 0.4 * a; }, () => this.remove(w));
		Sound.Sfx("warn", 1, 0.6);
		return w;
	}
	ring(center, o) {
		const seg = o.segments || 36, color = o.color || [255, 255, 255], parts = [];
		const gapAngle = o.gap ? Math.random() * Math.PI * 2 : 0;
		for (let i = 1; i <= seg; i++) {
			const ang = i / seg * Math.PI * 2;
			const d = Math.abs(((ang - gapAngle + Math.PI) % (2 * Math.PI)) - Math.PI);
			if (!o.gap || d >= o.gap / 2) { const p = this.neon(CF(center.x, center.y, center.z), [1, o.height, 1], color); p.userData.ang = ang; parts.push(p); }
		}
		return this.add({
			shape: "ring", center, r: o.r || 2, width: o.width || 2, height: o.height, gap: o.gap, gapAngle, parts, dmg: o.dmg, life: o.life || 3,
			update: (h, dt) => {
				h.r += (o.speed || 20) * dt;
				const segLen = (2 * Math.PI * h.r) / seg + 0.3;
				for (const p of parts) {
					const a = p.userData.ang;
					p.position.set(center.x + Math.cos(a) * h.r, center.y + o.height / 2, center.z + Math.sin(a) * h.r);
					p.scale.set(segLen, o.height, h.width);
					p.rotation.set(0, -a + Math.PI / 2, 0);
				}
			},
		});
	}
	mover(m, vel, o) {
		o = o || {};
		return this.add({ part: m, shape: o.shape || "box", dmg: o.dmg, life: o.life || 3, arm: o.arm, radius: o.radius, once: o.once,
			update: (h, dt) => { if (h.age >= (o.arm || 0)) m.position.addScaledVector(vel, dt); } });
	}
}

// Return home after a fight.
function endFight(fromFloor, delay) {
	GAME.after(delay, () => {
		FIGHT.current = null;
		GAME.fighting = null;
		GAME.bossBar(null);
		PLAYER.maxHp = 100;
		PLAYER.hp = Math.min(PLAYER.hp > 0 ? PLAYER.hp : 100, 100);
		PLAYER.dead = false;
		PLAYER.model.g.rotation.x = 0;
		GAME.curFloor = 0;
		GAME.teleport(fromFloor);
		GAME.refreshTools();
		GAME.refreshFloorLabel();
	});
}
function enterArena(bg, fogColor, fogFar) {
	GAME.clearOres();

// ---- Undertale-style bosses ------------------------------------------------------------------
const BOX = 34;
const UT = {};
UT.bones = async (f, spd) => {
	for (let wave = 1; wave <= 4; wave++) {
		const dir = [V3(0, 0, -1), V3(0, 0, 1), V3(1, 0, 0), V3(-1, 0, 0)][rint(0, 3)];
		const startOff = dir.clone().multiplyScalar(-(BOX + 2));
		const across = V3(Math.abs(dir.z), 0, Math.abs(dir.x));
		const short = Math.random() < 0.4;
		const vel = dir.clone().multiplyScalar(22 * spd);
		const seg = (a, b, height) => {
			const len = b - a;
			if (len <= 0.5) return;
			const mid = (a + b) / 2;
			const lp = startOff.clone().addScaledVector(across, mid).add(V3(0, height / 2, 0));
			const size = across.x > 0 ? [len, height, 1.2] : [1.2, height, len];
			const p = f.neon(CF(lp.x, lp.y, lp.z), size, [255, 255, 255]);
			f.mover(p, vel, { life: (2 * BOX + 4) / (22 * spd), dmg: 15 });
		};
		if (short) seg(-BOX, BOX, 2.2);
		else { const gc = rint(-BOX + 8, BOX - 8); seg(-BOX, gc - 5, 14); seg(gc + 5, BOX, 14); }
		if (!await f.wait(1.1 / spd)) return;
	}
	await f.wait(1);
};
UT.blaster = async (f, spd) => {
	const count = 3 + Math.floor(spd * 1.5);
	for (let i = 0; i < count; i++) {
		const ang = Math.random() * Math.PI;
		const center = V3(rint(-BOX + 6, BOX - 6), 0, rint(-BOX + 6, BOX - 6));
		const dir = V3(Math.cos(ang), 0, Math.sin(ang));
		const len = BOX * 3;
		const c3 = center.clone().add(V3(0, 3, 0));
		const cf = lookAtCF(c3, c3.clone().add(dir));
		const head = f.neon(mul(cf, CF(0, 0, len / 2 + 3)), [4, 4, 5], [255, 255, 255]);
		const e1 = f.neon(mul(cf, CF(0, 0, len / 2 + 3), CF(-1, 0.6, -2.6)), [0.8, 0.8, 0.3], [0, 200, 255]);
		const e2 = f.neon(mul(cf, CF(0, 0, len / 2 + 3), CF(1, 0.6, -2.6)), [0.8, 0.8, 0.3], [0, 200, 255]);
		const warn = f.neon(cf, [6, 0.3, len], [255, 255, 255], { transparency: 0.75 });
		const warnT = 0.9 / spd;
		Sound.Sfx("warn", 1.5, 0.5);
		f.wait(warnT).then(ok => {
			f.remove(warn);
			if (!ok) return;
			const beam = f.neon(cf, [6, 6, len], [255, 255, 255], { transparency: 0.05 });
			Sound.Sfx("zap", 0.5);
			fx(0.8, a => { beam.material.opacity = 0.95 * (1 - a); const w = 6 - 5.5 * a; beam.scale.set(w, w, len); });
			f.add({ part: beam, shape: "box", dmg: 22, life: 0.8 });
			f.wait(0.9).then(() => { f.remove(head); f.remove(e1); f.remove(e2); });
		});
		if (!await f.wait(0.4 / spd)) return;
	}
	await f.wait(1.4);
};
UT.rain = async (f, spd) => {
	const n = Math.floor(22 * spd);
	for (let i = 0; i < n; i++) {
		let x = rint(-BOX + 2, BOX - 2), z = rint(-BOX + 2, BOX - 2);
		if (Math.random() < 0.25) { const pp = PLAYER.pos; x = clamp(pp.x, -BOX, BOX); z = clamp(pp.z, -BOX, BOX); }
		const ground = V3(x, 0, z);
		const t = 0.6 / spd;
		f.warn(ground, 2, t, [255, 255, 0]);
		const p = ball(null, CF(x, 40, z), 2.4, [255, 255, 120], "Neon", { collide: false, ray: false });
		f.mover(p, V3(0, -40 / t, 0), { shape: "ball", life: t, dmg: 14 });
		if (!await f.wait(3.5 / n)) return;
	}
	await f.wait(1);
};
UT.ring = async (f, spd) => {
	for (let i = 1; i <= 4; i++) {
		const tall = i % 2 === 0;
		const from = i % 3 === 0 ? V3(PLAYER.pos.x, 0, PLAYER.pos.z) : V3(0, 0, BOX - 6);
		f.ring(from, { height: tall ? 10 : 2.4, gap: tall ? 55 * Math.PI / 180 : null, speed: 20 * spd, dmg: 16, life: 3.2, color: tall ? [255, 140, 0] : [255, 255, 255] });
		if (!await f.wait(1.1 / spd)) return;
	}
	await f.wait(2);
};
UT.homing = async (f, spd) => {
	for (let i = 0; i < 3 + Math.floor(spd * 2); i++) {
		const p = ball(null, CF(rint(-20, 20), 6, BOX - 6), 2.2, [255, 60, 60], "Neon", { collide: false, ray: false });
		const vel = V3(0, 0, 0);
		f.add({ part: p, shape: "ball", dmg: 14, life: 5, once: true, update: (h, dt) => {
			const to = f.playerRoot().sub(p.position);
			if (to.length() > 0.1) vel.lerp(to.normalize().multiplyScalar(12 * spd), Math.min(1, dt * 1.8));
			p.position.addScaledVector(vel, dt);
		} });
		if (!await f.wait(0.35)) return;
	}
	await f.wait(4);
};
UT.spears = async (f, spd) => {
	for (let i = 0; i < Math.floor(10 * spd); i++) {
		const target = f.playerRoot();
		const ang = Math.random() * Math.PI * 2;
		const start = target.clone().add(V3(Math.cos(ang) * 30, 0, Math.sin(ang) * 30));
		const spear = f.neon(lookAtCF(start, target), [0.8, 0.8, 6], [60, 160, 255], { transparency: 0.6 });
		const dir = target.clone().sub(start).normalize();
		f.wait(0.55 / spd).then(() => { if (spear.parent) spear.material.opacity = 1; });
		f.mover(spear, dir.multiplyScalar(75), { arm: 0.55 / spd, life: 0.55 / spd + 0.9, dmg: 15 });
		if (!await f.wait(0.3 / spd)) return;
	}
	await f.wait(1.2);
};

FIGHT.startUT = function (bossId, fromFloor) {
	if (GAME.fighting) return;
	const cfg = Config.Bosses[bossId];
	GAME.fighting = bossId;
	GAME.notify("⚔ " + cfg.name + " approaches! Dodge, grab MERCY hearts, and hit it!", cfg.eye);
	Sound.Sfx("roar", 1.4);
	enterArena([4, 4, 8], [0, 0, 0], 600);
	const f = new Fight();
	FIGHT.current = f;
	// arena
	box(null, CF(0, -1, 0), [90, 2, 90], [8, 8, 12]);
	for (const s of [[0, BOX + 0.5, 2 * BOX + 2, 1], [0, -BOX - 0.5, 2 * BOX + 2, 1], [BOX + 0.5, 0, 1, 2 * BOX + 2], [-BOX - 0.5, 0, 1, 2 * BOX + 2]]) {
		box(null, CF(s[0], 0.3, s[1]), [s[2], 0.6, s[3]], [255, 255, 255], "Neon", { collide: false });
		box(null, CF(s[0], 20, s[1]), [s[2], 40, s[3]], [255, 255, 255], "Glass", { transparency: 0.92, ray: false });
	}
	box(null, CF(0, 40, 0), [2 * BOX + 2, 1, 2 * BOX + 2], [0, 0, 0], null, { transparency: 1 });
	for (let i = 0; i < 60; i++) ball(null, CF(rnd(-150, 150), rnd(20, 120), rnd(60, 160)), rnd(0.5, 1.6), [255, 255, 255], "Neon", { collide: false, ray: false });
	// the boss figure
	const g = model(CF(0, 9, BOX - 4));
	const body = adopt(g, box(null, CF(0, 9, BOX - 4), [5, 6, 3], cfg.color, "SmoothPlastic", { collide: false }));
	adopt(g, box(null, CF(0, 8, BOX - 4 - 1.6), [4.6, 1.5, 0.2], cfg.eye, "Neon", { collide: false }));
	const head = adopt(g, ball(null, CF(0, 14, BOX - 4), 4.5, [245, 245, 245], "SmoothPlastic", { collide: false }));
	for (const x of [-0.9, 0.9]) { const eye = adopt(g, ball(null, CF(x, 14.3, BOX - 4 - 2), 0.9, cfg.eye, "Neon", { collide: false })); pointLight(eye, cfg.eye, 10, 3); }
	for (const x of [-3.5, 3.5]) adopt(g, box(null, mul(CF(x, 9.5, BOX - 4), ANG(0, 0, (x > 0 ? 25 : -25) * Math.PI / 180)), [1.4, 5, 1.4], cfg.color, null, { collide: false }));
	emitter(head, cfg.eye, 6, { speed: [1, 2], box: 4 });
	anim(g, { style: "bob", amp: 1.5, speed: 1.5 });
	const bubble = billboard(head, "", cfg.eye, 14, 3, 5, 300);
	GAME.camBounds = new THREE.Box3(V3(-BOX - 30, 0.5, -BOX - 30), V3(BOX + 30, 60, BOX + 30));
	Sound.Music(cfg.music);
	GAME.refreshFloorLabel();
	const maxHp = cfg.hp;
	let hp = maxHp, phase = 1;
	const say = text => { bubble.set(text); GAME.say(cfg.name, text, cfg.eye); };
	const sync = () => GAME.bossBar(cfg.name, Math.max(0, hp), maxHp);
	sync();
	const damage = (dmg, raw) => {
		if (!f.alive || hp <= 0) return 0;
		if (!raw) dmg = Math.min(dmg, maxHp * 0.02);
		dmg = Math.max(1, Math.floor(dmg));
		hp -= dmg;
		sync();
		if (phase === 1 && hp <= maxHp * 0.66) { phase = 2; say(cfg.lines[1]); }
		else if (phase === 2 && hp <= maxHp * 0.33) { phase = 3; say(cfg.lines[2]); flash(cfg.eye, 0.4); }
		if (hp <= 0) {
			say(cfg.lines[3]);
			for (let i = 1; i <= 6; i++) GAME.after(i * 0.25, () => flashSphere(body.getWorldPosition(new THREE.Vector3()).add(V3(rnd(-4, 4), rnd(-2, 6), rnd(-4, 4))), 6, cfg.eye, 0.4));
			GAME.after(1.8, () => f.finish(true));
		}
		return dmg;
	};
	const target = { boss: true, radius: 5, damage, get pos() { return body.getWorldPosition(new THREE.Vector3()); }, mesh: body };
	W.targets.push(target);
	// player in
	PLAYER.hp = PLAYER.maxHp;
	GAME.teleportTo(V3(0, 1, -BOX + 6), Math.PI);
	CAM.pitch = -0.45;
	f.onEnd.push(win => {
		GAME.bossBar(null);
		if (win) {
			GAME.data.bossesBeaten[bossId] = true;
			if (cfg.portal) {
				GAME.data.bp += cfg.bp;
				GAME.notify(`⚔ ${cfg.name} defeated! +${cfg.bp} Boss Points`, cfg.eye);
			} else {
				const reward = Config.Scale(cfg.scaleFloor) * 3000 * Config.RebirthMult(GAME.data.rebirths);
				GAME.addCash(reward);
				if (!GAME.data.bossDroppers[bossId]) { GAME.data.bossDroppers[bossId] = true; GAME.notify(`⚔ ${cfg.name} defeated! Its DROPPER is unlocked (free)! +$${Config.Format(reward)}`, cfg.eye); }
				else GAME.notify(`⚔ ${cfg.name} defeated again! +$${Config.Format(reward)}`, cfg.eye);
			}
			Sound.Sfx("ach");
			GAME.checkAchievements();
			GAME.save();
			endFight(fromFloor, 2.5);
		} else {
			GAME.notify(cfg.name + " won this time. Try again!", [255, 90, 90]);
			endFight(fromFloor, 2.6);
		}
	});
	(async () => {
		say(cfg.lines[0]);
		if (!await f.wait(2.5)) return;
		let idx = 0;
		while (f.alive && hp > 0) {
			idx = idx % cfg.attacks.length + 1;
			const spd = cfg.speed * (phase === 3 ? 1.25 : phase === 2 ? 1.1 : 1);
			try { await UT[cfg.attacks[idx - 1]](f, spd); } catch (e) { console.warn("[UTBoss]", e); }
			if (!f.alive || hp <= 0) break;
			// MERCY heart: grab it to deal 8% damage
			const hpos = V3(rint(-BOX + 5, BOX - 10), 3, rint(-BOX + 5, BOX - 10));
			const heart = ball(null, CF(hpos.x, hpos.y, hpos.z), 2.6, [255, 230, 0], "Neon", { collide: false, ray: false });
			pointLight(heart, [255, 230, 0], 12, 3);
			const hl = billboard(heart, "MERCY", [255, 230, 0], 6, 1.5, 2.5);
			f.add({ part: heart, shape: "ball", dmg: 0, life: 4, onEnd: () => { hl.hidden = true; }, update: h => {
				if (f.playerRoot().distanceTo(heart.position) < 4 && !h.got) {
					h.got = true; h.age = h.life;
					damage(maxHp * 0.08, true);
					damageNumber(heart.position, Math.floor(maxHp * 0.08), [255, 230, 0]);
					flash([255, 230, 0], 0.2);
					Sound.Sfx("heart");
				}
			} });
			if (!await f.wait(0.8)) break;
		}
	})();
};

			const dt = await f.frame();

	}

			else if (phase === 2 && hp <= maxHp * 0.33) { await phaseShift(cfg.phase3, 3); idx = 0; }
			if (!f.alive) return;
			const pool = pools[phase - 1];
			idx = idx % pool.length + 1;
			try { await pool[idx - 1](); } catch (e) { console.warn("[Doom]", e); }
			if (dying) return defeat();
			P.weapon = phase >= 2 ? (idx % 2 === 0 ? "hammer" : "sword") : "sword";
			P.spin = 0; P.pitch = 0; P.bucket = false;
			if (P.pos.y - floorY > 0.5) { const from = P.pos.clone(); await f.animate(0.4, a => { P.pos = from.clone().lerp(V3(from.x, floorY, from.z), a); }); }
			if (Math.random() < 0.6) say(cfg.taunts[rint(0, cfg.taunts.length - 1)]);
			if (!await f.wait(Math.max(0.4, 1.2 - phase * 0.25))) return;
		}
	})();
};

// ---- entry points used by the floors ------------------------------------------------------------
GAME.onBossPortal = id => FIGHT.startUT(id, GAME.curFloor);
GAME.onPortalPad = function (i) {
	const id = Config.PortalBosses[i - 1], cfg = Config.Bosses[id];
	if (!GAME.data.portals[id]) {
		if (!GAME.spend(cfg.portalCost)) return;
		GAME.data.portals[id] = true;
		GAME.notify("Portal to " + cfg.name + " unlocked!", cfg.eye);
		Sound.Sfx("unlock");
		refreshAllFloors();
		GAME.save();
		return;
	}
	FIGHT.startUT(id, NF);
};
GAME.onSwordPad = function (tier) {
	const d = GAME.data, entry = Config.SwordLine[tier - 1];
	if (tier <= d.ownedSword) { d.swordTier = tier; GAME.notify("Equipped " + entry.name, [255, 220, 150]); }
	else if (tier === d.ownedSword + 1) {
		if (d.bp < entry.cost) { GAME.notify(`Need ${Config.Format(entry.cost)} Boss Points (you have ${Config.Format(d.bp)}). Beat portal bosses!`, [255, 90, 90]); Sound.Sfx("deny"); return; }
		d.bp -= entry.cost; d.ownedSword = tier; d.swordTier = tier;
		GAME.notify("⚒ FORGED: " + entry.name + "!", [255, 200, 80]);
		Sound.Sfx("level");
	} else { GAME.notify("Forge the previous weapon first!", [255, 90, 90]); Sound.Sfx("deny"); return; }
	GAME.refreshTools();
	refreshAllFloors();
	GAME.save();
};
GAME.onDoomPortal = () => FIGHT.startDoom();

window.__dbt = { scene, camera, renderer, W, PLAYER, CAM, THREE, FIGHT };
GAME.start();
</script>
