/* =============================================================== UPDATE === */
function moveTank(t, dt, ax, ay) {
  if (t.stun > 0) return;
  var sp = t.speed;
  var tvx = ax * sp, tvy = ay * sp;
  var k = 1 - Math.pow(0.0009, dt);           // snappy but not instant
  t.vx = lerp(t.vx, tvx, k);
  t.vy = lerp(t.vy, tvy, k);
  var px = t.x, py = t.y;
  t.x += t.vx * dt;
  t.y += t.vy * dt;
  var pad = t.r + 6;
  t.x = clamp(t.x, pad, W - pad);
  t.y = clamp(t.y, pad, H - pad);
  var rects = wallRects();
  for (var i = 0; i < rects.length; i++) pushOutOfBox(t, rects[i]);
  // tanks do not stack
  var all = [G.you].concat(G.foes);
  for (var j = 0; j < all.length; j++) {
    var o = all[j];
    if (o === t || !o.alive) continue;
    var d = Math.hypot(o.x - t.x, o.y - t.y), min = o.r + t.r;
    if (d > 0.01 && d < min) {
      var nx = (t.x - o.x) / d, ny = (t.y - o.y) / d, push = (min - d) * 0.5;
      t.x += nx * push; t.y += ny * push;
    }
  }
  var moved = Math.hypot(t.x - px, t.y - py);
  if (moved > 0.4) {
    var dir = Math.atan2(t.y - py, t.x - px);
    t.hull += clamp(angDiff(t.hull, dir), -TUNE.turnRate * dt, TUNE.turnRate * dt);
    t.tread += moved;
    if (t.tread > 16) {
      t.tread = 0;
      G.marks.push({ x: t.x, y: t.y, a: t.hull, r: 0, life: 7, max: 7, team: t.team });
      if (G.marks.length > 260) G.marks.shift();
    }
  }
}

/* where a shell fired now would need to go to meet a moving target */
function leadAim(from, target, speed) {
  var dx = target.x - from.x, dy = target.y - from.y;
  var tvx = target.vx || 0, tvy = target.vy || 0;
  var a = tvx * tvx + tvy * tvy - speed * speed;
  var b = 2 * (dx * tvx + dy * tvy);
  var c = dx * dx + dy * dy;
  var t = 0;
  if (Math.abs(a) < 0.001) { t = Math.abs(b) > 0.001 ? -c / b : 0; }
  else {
    var disc = b * b - 4 * a * c;
    if (disc >= 0) {
      var sq = Math.sqrt(disc), t1 = (-b + sq) / (2 * a), t2 = (-b - sq) / (2 * a);
      t = Math.min(t1 > 0 ? t1 : Infinity, t2 > 0 ? t2 : Infinity);
      if (!isFinite(t)) t = 0;
    }
  }
  t = clamp(t, 0, 3);
  return angTo(from.x, from.y, target.x + tvx * t, target.y + tvy * t);
}

/* is anything solid between a and b? cheap segment march */
function lineBlocked(ax, ay, bx, by) {
  var rects = wallRects();
  var steps = Math.max(6, (Math.hypot(bx - ax, by - ay) / 26) | 0);
  for (var s = 1; s < steps; s++) {
    var x = lerp(ax, bx, s / steps), y = lerp(ay, by, s / steps);
    for (var i = 0; i < rects.length; i++) {
      if (circleBox(x, y, 4, rects[i])) return true;   // your own wall stops your own shell
    }
  }
  return false;
}

function incomingShell(t, reach) {
  var best = null, bestT = Infinity;
  for (var i = 0; i < G.shells.length; i++) {
    var s = G.shells[i];
    if (s.team === t.team) continue;
    var sp = Math.hypot(s.vx, s.vy);
    if (sp < 1) continue;
    var ux = s.vx / sp, uy = s.vy / sp;
    var dx = t.x - s.x, dy = t.y - s.y;
    var along = dx * ux + dy * uy;                 // how far in front of the shell we are
    if (along <= 0 || along > reach) continue;
    var off = Math.abs(dx * uy - dy * ux);         // and how far off its line
    if (off > t.r + 26) continue;
    var tt = along / sp;
    if (tt < bestT) { bestT = tt; best = s; }
  }
  return best;
}

function aiTank(t, dt) {
  var ai = t.ai;
  ai.t += dt;
  var myFlag = flagOf(t.team), theirFlag = foeFlagOf(t.team, t);
  var hunting = teamExposed(t.team === "blue" ? "red" : "blue");   // no flags left: go for the tank
  var target = hunting ? G.you : { x: theirFlag.x, y: theirFlag.y - 34, vx: 0, vy: 0 };
  if (hunting && !G.you.alive) return;

  var skilled = t.kind === "skilled" || t.boss || t.lord;
  var d = Math.hypot(target.x - t.x, target.y - t.y);
  var want = t.boss ? (G.bossPhase === 1 ? 130 : G.bossPhase === 2 ? 430 : 300)   // charging means closing in, not speeding up
            : skilled ? 380 : 420;

  /* ---- aim ---- */
  var aimAt = skilled ? leadAim(t, target, TUNE.shellSpeed) : angTo(t.x, t.y, target.x, target.y);
  if (!skilled) aimAt += Math.sin(ai.t * 1.3) * 0.1;              // the plain bot wobbles
  var turn = (skilled ? 3.4 : 1.9) * dt;
  t.turret += clamp(angDiff(t.turret, aimAt), -turn, turn);

  /* ---- move ---- */
  var ax = 0, ay = 0;
  var toT = angTo(t.x, t.y, target.x, target.y);
  if (d > want + 40) { ax = Math.cos(toT); ay = Math.sin(toT); }
  else if (d < want - 60) { ax = -Math.cos(toT); ay = -Math.sin(toT); }
  // strafe so a duel is not two tanks standing still
  if (ai.t > 1.6) { ai.t = 0; if (Math.random() < 0.5) ai.strafe *= -1; }
  ax += Math.cos(toT + Math.PI / 2) * ai.strafe * (skilled ? 0.85 : 0.35);
  ay += Math.sin(toT + Math.PI / 2) * ai.strafe * (skilled ? 0.85 : 0.35);

  /* ---- dodge, which is the whole difference a skilled bot makes ---- */
  var inc = incomingShell(t, skilled ? 460 : 110);
  if (inc) {
    var sa = Math.atan2(inc.vy, inc.vx);
    var side = angDiff(sa, angTo(inc.x, inc.y, t.x, t.y)) > 0 ? 1 : -1;
    var esc = sa + side * Math.PI / 2;
    if (skilled) { ax = Math.cos(esc); ay = Math.sin(esc); }      // nothing matters more than not being hit
    else { ax += Math.cos(esc) * 0.25; ay += Math.sin(esc) * 0.25; }   // the plain one barely flinches
    // or put a wall in its way
    if (skilled && t.wallCd <= 0 && Math.hypot(inc.x - t.x, inc.y - t.y) < 200 && Math.random() < 0.05) {
      var keep = t.turret;
      t.turret = angTo(t.x, t.y, inc.x, inc.y);
      buildWall(t);
      t.turret = keep;
    }
  }
  var m = Math.hypot(ax, ay);
  if (m > 1) { ax /= m; ay /= m; }
  moveTank(t, dt, ax, ay);

  /* ---- shoot ---- */
  if (t.cd <= 0) {
    var aligned = Math.abs(angDiff(t.turret, aimAt)) < (skilled ? 0.1 : 0.22);
    var clear = !lineBlocked(t.x, t.y, target.x, target.y);
    if (aligned && (clear || !skilled)) fireTank(t);
  }
}

function bossBrain(b, dt) {
  G.bossTimer -= dt;
  var flagHp = G.flagRed.hp;
  b.shooters = flagHp <= 1 ? 10 : flagHp <= 2 ? 6 : 4;
  b.fire = flagHp <= 1 ? 1.1 : 1.5;
  if (G.bossTimer <= 0) {
    G.bossTimer = rnd(5, 8);
    G.bossPhase = (G.bossPhase + 1) % 3;
    if (G.bossPhase === 1) say("IT IS CHARGING", 1.2);
    if (G.bossPhase === 2 && b.wallCd <= 0) {
      // ring its own flag with walls
      for (var i = 0; i < 3; i++) {
        var a = -Math.PI / 2 + (i - 1) * 0.5;
        G.walls.push({ x: G.flagRed.x - 90 + Math.cos(a) * 30, y: G.flagRed.y + Math.sin(a) * 120,
          a: Math.PI / 2, hp: 1, team: "red", born: G.t, hitT: 0 });
      }
      b.wallCd = TUNE.wallCool;
      AU.sfx("wall");
      say("IT IS DIGGING IN", 1.2);
    }
  }
  b.speed = TUNE.bossSpeed;            // always twice your starting speed
  aiTank(b, dt);
}

/* ===========================================================================
   THE DARK LORD. Not a tank: a thing in a tank's shape, in a wood, with a ring
   of stones round it. It blocks about a third of what you throw at it with a
   wall of blue light, it leans its shots at you as they fly, and every so often
   - not often - it folds up and opens again somewhere else.

   Five things it does, in no fixed order:
     SPIRAL  a slow rotating stream, which fills the clearing
     FAN     sixteen curved shots at once, all leaning your way
     ORBS    four fat slow seekers that have to be driven round or shot out
     HUNT    it closes on you at full speed, firing singles
     RITUAL  it stands over its own flag and pulls every shell on screen in
   and underneath all of it, it is faster than anything else in the game.
   ========================================================================= */
function lordFire(b, a, opt) {
  opt = opt || {};
  opt.col = opt.col || "#a05cff";
  var sh = pushShell(b, a, opt);
  for (var i = 0; i < 3; i++) {
    G.parts.push({ x: sh.x, y: sh.y, vx: Math.cos(a) * rnd(40, 160), vy: Math.sin(a) * rnd(40, 160),
      life: rnd(0.2, 0.5), max: 0.5, col: i % 2 ? "#7b2fd0" : "#07040c", r: rnd(2, 4.5), curve: rnd(-6, 6), grav: 0 });
  }
  return sh;
}

function lordTeleport(b) {
  var you = G.you;
  for (var i = 0; i < 46; i++) {                 // fold up
    var a = rnd(0, TAU), d = rnd(20, 180);
    G.parts.push({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d,
      vx: -Math.cos(a) * rnd(120, 400), vy: -Math.sin(a) * rnd(120, 400),
      life: rnd(0.2, 0.5), max: 0.5, col: i % 2 ? "#a05cff" : "#07040c", r: rnd(2, 5), curve: rnd(-7, 7), grav: 0 });
  }
  G.rings.push({ x: b.x, y: b.y, r: 120, max: 10, life: 0.3, t: 0.3, col: "#a05cff" });
  // somewhere it can see you from, but not on top of you
  var ta = rnd(0, TAU), tr = rnd(320, 520);
  b.x = clamp(you.x + Math.cos(ta) * tr, 120, W - 120);
  b.y = clamp(you.y + Math.sin(ta) * tr, 120, H - 120);
  b.tp = 0.45;
  for (var k = 0; k < 46; k++) {                 // open again
    var a2 = rnd(0, TAU);
    G.parts.push({ x: b.x, y: b.y, vx: Math.cos(a2) * rnd(120, 460), vy: Math.sin(a2) * rnd(120, 460),
      life: rnd(0.25, 0.7), max: 0.7, col: k % 2 ? "#a05cff" : "#07040c", r: rnd(2, 5), curve: rnd(-7, 7), grav: 0 });
  }
  G.rings.push({ x: b.x, y: b.y, r: 8, max: 200, life: 0.5, t: 0.5, col: "#c79bff" });
  G.shake = Math.max(G.shake, 10);
  AU.sfx("tp");
}

function lordBrain(b, dt) {
  var you = G.you;
  var myFlag = flagOf("red");
  var hurt = myFlag.down ? 0 : myFlag.hp;
  var rage = myFlag.down ? 3 : hurt <= 2 ? 2 : hurt <= 4 ? 1 : 0;   // it gets worse as you win
  b.speed = TUNE.lordSpeed + rage * 40;
  b.fire = 1.0 - rage * 0.16;
  if (b.tp > 0) b.tp -= dt;

  /* ---- it does not stay put for long ---- */
  b.tpT = (b.tpT == null ? rnd(7, 11) : b.tpT) - dt;
  var cornered = dist2(b.x, b.y, you.x, you.y) < 230 * 230;
  if (b.tpT <= 0 || (cornered && b.tpSafe <= 0)) {
    lordTeleport(b);
    b.tpT = rnd(9, 14) - rage;                 // not often, and never twice in a row
    b.tpSafe = 6;
  }
  if (b.tpSafe > 0) b.tpSafe -= dt;

  /* ---- which of the five it is doing ---- */
  b.phaseT -= dt;
  if (b.phaseT <= 0) {
    if (!b.bag || !b.bag.length) {           // all five, shuffled, then all five again
      b.bag = [0, 1, 2, 3, 4];
      for (var sIx = b.bag.length - 1; sIx > 0; sIx--) {
        var jIx = (Math.random() * (sIx + 1)) | 0, tmpIx = b.bag[sIx];
        b.bag[sIx] = b.bag[jIx]; b.bag[jIx] = tmpIx;
      }
      if (b.bag[0] === b.phase) b.bag.push(b.bag.shift());
    }
    b.phase = b.bag.shift();
    b.phaseT = b.phase === 0 ? 4.2 : b.phase === 2 ? 3.4 : b.phase === 4 ? 3.0 : 4.6;
    b.sub = 0;
    if (b.phase === 0) say("IT IS TURNING", 1.1);
    if (b.phase === 1) say("ALL AT ONCE", 1.1);
    if (b.phase === 2) say("IT HAS SENT SOMETHING", 1.2);
    if (b.phase === 3) say("IT IS COMING", 1.2);
    if (b.phase === 4) say("IT IS CALLING THEM BACK", 1.2);
    AU.sfx("lord");
  }

  var toYou = angTo(b.x, b.y, you.x, you.y);
  var d = Math.hypot(you.x - b.x, you.y - b.y);
  var ax = 0, ay = 0;

  if (b.phase === 0) {
    /* SPIRAL: it turns on the spot and lays down a wall of shots */
    b.spin += dt * 2.3;
    b.turret = b.spin;
    b.sub -= dt;
    if (b.sub <= 0 && G.guard <= 0) {
      b.sub = 0.2 - rage * 0.02;
      lordFire(b, b.spin, { curve: 0.7, home: 0, speed: 0.95 });
      lordFire(b, b.spin + Math.PI, { curve: 0.7, home: 0, speed: 0.95 });
    }
    ax = Math.cos(toYou + Math.PI) * 0.4; ay = Math.sin(toYou + Math.PI) * 0.4;
  } else if (b.phase === 1) {
    /* FAN: one enormous volley, then it stands there and lets you come */
    b.turret += clamp(angDiff(b.turret, toYou), -4 * dt, 4 * dt);
    b.sub -= dt;
    if (b.sub <= 0 && G.guard <= 0) {
      b.sub = 2.1 - rage * 0.3;
      var n = 12 + rage * 2;
      for (var i = 0; i < n; i++) {
        var a = toYou - 0.9 + (i / (n - 1)) * 1.8;
        lordFire(b, a, { curve: (i % 2 ? 1 : -1) * 0.8, home: 1, speed: 1.05 });
      }
      G.shake = Math.max(G.shake, 7);
      AU.sfx("lordfire");
    }
    ax = Math.cos(toYou + Math.PI / 2) * 0.7; ay = Math.sin(toYou + Math.PI / 2) * 0.7;
  } else if (b.phase === 2) {
    /* ORBS: fat, slow, and they do not give up */
    b.turret += clamp(angDiff(b.turret, toYou), -3 * dt, 3 * dt);
    b.sub -= dt;
    if (b.sub <= 0 && G.guard <= 0) {
      b.sub = 1.6;
      for (var k = 0; k < 3 + rage; k++) {
        lordFire(b, toYou + rnd(-1.2, 1.2), { curve: 1.2, home: 1, speed: 0.42, size: 2.4, col: "#c79bff" });
      }
      AU.sfx("lordfire");
    }
    ax = Math.cos(toYou + Math.PI) * 0.5; ay = Math.sin(toYou + Math.PI) * 0.5;
  } else if (b.phase === 3) {
    /* HUNT: straight at you, fast, firing singles */
    b.turret += clamp(angDiff(b.turret, leadAim(b, you, TUNE.shellSpeed)), -5 * dt, 5 * dt);
    if (b.cd <= 0 && G.guard <= 0) {
      b.cd = 0.34;
      lordFire(b, b.turret, { curve: (Math.random() < 0.5 ? 1 : -1) * 0.9, home: 1, speed: 1.3 });
    }
    if (d > 180) { ax = Math.cos(toYou); ay = Math.sin(toYou); }
    else { ax = Math.cos(toYou + 2.2); ay = Math.sin(toYou + 2.2); }
  } else {
    /* RITUAL: it stands on its flag and drags every shell on screen towards it,
       which is the one window where you can get close and hit the flag */
    var fx = myFlag.x, fy = myFlag.y;
    var fd = Math.hypot(fx - b.x, fy - b.y);
    if (fd > 70) { var fa = angTo(b.x, b.y, fx, fy); ax = Math.cos(fa); ay = Math.sin(fa); }
    b.spin += dt * 4;
    b.turret = b.spin;
    for (var sIdx = 0; sIdx < G.shells.length; sIdx++) {
      var sh = G.shells[sIdx];
      if (sh.team !== "blue") continue;
      var pa = angTo(sh.x, sh.y, b.x, b.y);
      sh.a = sh.a + clamp(angDiff(sh.a, pa), -1.6 * dt, 1.6 * dt);
      var sp2 = sh.sp || Math.hypot(sh.vx, sh.vy);
      sh.vx = Math.cos(sh.a) * sp2; sh.vy = Math.sin(sh.a) * sp2;
    }
    if ((G.t * 60 | 0) % 2 === 0) {
      var ra = rnd(0, TAU);
      G.parts.push({ x: b.x + Math.cos(ra) * 260, y: b.y + Math.sin(ra) * 260,
        vx: -Math.cos(ra) * 320, vy: -Math.sin(ra) * 320, life: 0.8, max: 0.8,
        col: "#7b2fd0", r: rnd(2, 4), curve: rnd(-5, 5), grav: 0 });
    }
  }

  /* dodging, because it is also simply a very good tank */
  var inc = incomingShell(b, 420);
  if (inc && b.phase !== 4) {
    var sa = Math.atan2(inc.vy, inc.vx);
    var side = angDiff(sa, angTo(inc.x, inc.y, b.x, b.y)) > 0 ? 1 : -1;
    ax = Math.cos(sa + side * Math.PI / 2); ay = Math.sin(sa + side * Math.PI / 2);
  }
  var m = Math.hypot(ax, ay);
  if (m > 1) { ax /= m; ay /= m; }
  moveTank(b, dt, ax, ay);

  /* it leaves a trail of itself behind */
  if ((G.t * 60 | 0) % 2 === 0) {
    G.parts.push({ x: b.x + rnd(-26, 26), y: b.y + rnd(-26, 26), vx: rnd(-30, 30), vy: rnd(-40, 10),
      life: rnd(0.3, 0.9), max: 0.9, col: Math.random() < 0.5 ? "#07040c" : "#7b2fd0",
      r: rnd(2, 6), curve: rnd(-4, 4), grav: 0 });
  }
}

function updateWorld(dt) {
  G.t += dt;
  if (G.guard > 0) G.guard -= dt;
  if (G.msgT > 0) G.msgT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 22);

  var you = G.you;
  if (G.state === "play" && you.alive) {
    /* ---- you ---- */
    var mv = IN.moveVec();
    moveTank(you, dt, mv.x, mv.y);
    // aim: mouse on a desktop, drag on the right half on a phone, else assist
    var aimA = null;
    if (IN.aim.active) aimA = angTo(you.x, you.y, IN.aim.x, IN.aim.y);
    else if (IN.usedMouse) aimA = angTo(you.x, you.y, IN.mx, IN.my);
    if (aimA === null) {
      var rf = flagsOf("red")[0];
      var tgt = rf ? { x: rf.x, y: rf.y - 34 } : nearestFoe(you);
      if (tgt) aimA = angTo(you.x, you.y, tgt.x, tgt.y);
    }
    if (aimA !== null) {
      var tr = 11 * dt;
      you.turret += clamp(angDiff(you.turret, aimA), -tr, tr);
    }
    if ((IN.firePressed || IN.fireHeld || IN.keys[" "] || IN.mouseDown) && you.cd <= 0) fireTank(you);
    if (IN.wallPressed || IN.keys["e"]) { if (you.wallCd <= 0) buildWall(you); IN.wallPressed = false; }
    IN.firePressed = false;
  }

  /* ---- them ---- */
  for (var i = 0; i < G.foes.length; i++) {
    var f = G.foes[i];
    if (!f.alive) continue;
    if (G.state !== "play") continue;
    if (G.guard > 0) { f.cd = Math.max(f.cd, 0.4); continue; }
    if (f.lord) lordBrain(f, dt); else if (f.boss) bossBrain(f, dt); else aiTank(f, dt);
  }

  /* ---- cooldowns ---- */
  var all = [you].concat(G.foes);
  for (var c = 0; c < all.length; c++) {
    var t = all[c];
    if (t.stun > 0) {
      t.stun -= dt;
      t.x = clamp(t.x + t.vx * dt, 60, W - 60);
      t.y = clamp(t.y + t.vy * dt, 60, H - 60);
      t.vx *= 0.9; t.vy *= 0.9;
      t.spin = (t.spin || 0) + dt * 6;
      if ((G.t * 60 | 0) % 3 === 0) G.parts.push({ x: t.x + rnd(-20, 20), y: t.y + rnd(-20, 20),
        vx: rnd(-40, 40), vy: rnd(-60, 0), life: rnd(0.3, 0.7), max: 0.7, col: "#7b2fd0", r: rnd(2, 4), curve: rnd(-4, 4), grav: 0 });
    }
    if (t.blockT > 0) t.blockT -= dt;
    if (t.icd > 0) t.icd -= dt;
    if (t.blockCd > 0) t.blockCd -= dt;
    if (t.cd > 0) t.cd = Math.max(0, t.cd - dt);
    if (t.wallCd > 0) t.wallCd = Math.max(0, t.wallCd - dt);
    if (t.hitT > 0) t.hitT -= dt;
  }

  /* ---- shells ---- */
  for (var s = G.shells.length - 1; s >= 0; s--) {
    var sh = G.shells[s];
    sh.life -= dt;
    sh.trail.push(sh.x, sh.y);
    if (sh.trail.length > (sh.kind === "void" ? 30 : 16)) sh.trail.splice(0, 2);
    /* a curved shell turns as it flies; a homing one leans towards you, but
     * only for the first second and a half, so it can still be out-driven */
    if (sh.curve) {
      var cv = sh.curve;
      var age = TUNE.shellLife - sh.life;
      if (sh.home && G.you.alive && age < 1.6) {
        var want = angTo(sh.x, sh.y, G.you.x, G.you.y);
        cv = clamp(angDiff(sh.a, want) * 2.4, -1.5, 1.5);
      } else if (sh.tx && age < 2.2) {
        var w2 = angTo(sh.x, sh.y, sh.tx, sh.ty);
        cv = clamp(angDiff(sh.a, w2) * 3.2, -1.9, 1.9);
      }
      sh.a += cv * dt;
      var spd = sh.sp || Math.hypot(sh.vx, sh.vy);
      sh.vx = Math.cos(sh.a) * spd;
      sh.vy = Math.sin(sh.a) * spd;
      if (G.zone === 2 && (G.t * 60 | 0) % 2 === 0) {
        G.parts.push({ x: sh.x, y: sh.y, vx: rnd(-20, 20), vy: rnd(-20, 20),
          life: rnd(0.2, 0.5), max: 0.5, r: rnd(1.4, 3), curve: rnd(-5, 5), grav: 0,
          col: sh.kind === "void" ? "#07040c" : sh.team === "blue" ? "#6fa8ff" : "#8b3fd8" });
      }
    }
    sh.x += sh.vx * dt;
    sh.y += sh.vy * dt;
    var out = sh.x < 8 || sh.x > W - 8 || sh.y < 8 || sh.y > H - 8;
    if (out) { burstAt(clamp(sh.x, 8, W - 8), clamp(sh.y, 8, H - 8), "#8a93a3"); G.shells.splice(s, 1); continue; }
    if (sh.life <= 0) { G.shells.splice(s, 1); continue; }
    if (shellHits(sh)) G.shells.splice(s, 1);
  }

  /* ---- walls age out so the arena does not silt up ---- */
  for (var w = G.walls.length - 1; w >= 0; w--) {
    if (G.walls[w].hitT > 0) G.walls[w].hitT -= dt;
    if (G.t - G.walls[w].born > 26) {
      var ww = G.walls[w];
      for (var pp = 0; pp < 8; pp++) G.parts.push({ x: ww.x + rnd(-40, 40), y: ww.y + rnd(-8, 8), vx: rnd(-40, 40), vy: rnd(-60, 10), life: rnd(0.2, 0.5), max: 0.5, col: "#b9c1cf", r: 2 });
      G.walls.splice(w, 1);
    }
  }

  /* ---- dressing ---- */
  for (var p = G.parts.length - 1; p >= 0; p--) {
    var pt = G.parts[p];
    pt.life -= dt;
    if (pt.life <= 0) { G.parts.splice(p, 1); continue; }
    if (pt.curve) {                       // the forest's own motes bend as they go
      var pa = Math.atan2(pt.vy, pt.vx) + pt.curve * dt;
      var pm = Math.hypot(pt.vx, pt.vy);
      pt.vx = Math.cos(pa) * pm; pt.vy = Math.sin(pa) * pm;
    }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.96;
    pt.vy = pt.vy * 0.96 + (pt.grav === 0 ? 0 : 140) * dt;
    if (G.hole) {                          // and everything leans into the hole
      var hx = G.hole.x - pt.x, hy = G.hole.y - pt.y;
      var hd = Math.hypot(hx, hy) || 1;
      if (hd < 520) { pt.vx += (hx / hd) * 900 * dt; pt.vy += (hy / hd) * 900 * dt; }
    }
  }
  for (var r = G.rings.length - 1; r >= 0; r--) {
    var rg = G.rings[r];
    rg.t -= dt;
    if (rg.t <= 0) { G.rings.splice(r, 1); continue; }
    rg.r = lerp(rg.r, rg.max, 1 - Math.pow(0.02, dt));
  }
  for (var m = G.marks.length - 1; m >= 0; m--) {
    if (G.marks[m].life < 900) {
      G.marks[m].life -= dt;
      if (G.marks[m].life <= 0) G.marks.splice(m, 1);
    }
  }
  for (var fw = 0; fw < G.flags.length; fw++) {
    G.flags[fw].wave += dt * 2.2;
    if (G.flags[fw].hitT > 0) G.flags[fw].hitT -= dt;
    if (G.flags[fw].icd > 0) G.flags[fw].icd -= dt;
  }
  if (G.hole) {
    G.hole.t += dt;
    G.hole.r = lerp(G.hole.r, 120, 1 - Math.pow(0.004, dt));
    if (G.hole.t > G.hole.life) G.hole = null;
  }

  /* ---- is it over ---- */
  if (G.state === "play") {
    if (!G.you.alive) endRound(false);
    else if (tanksOf("red").length === 0) endRound(true);
  } else if (G.state === "over") {
    G.overT -= dt;
    if (G.overT <= 0) showResult();
  }
}

function nearestFoe(from) {
  var best = null, bd = Infinity;
  for (var i = 0; i < G.foes.length; i++) {
    var f = G.foes[i];
    if (!f.alive) continue;
    var d = dist2(from.x, from.y, f.x, f.y);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function endRound(won) {
  if (G.state !== "play") return;
  G.state = "over";
  G.won = won;
  G.overT = 1.7;
  G.shake = 16;
  say(won ? "YOU WIN" : "YOU LOSE", 2.4);
  AU.sfx(won ? "win" : "lose");
}


/* ================================================================ DRAW ==== */
var cv = $("cv"), g = cv.getContext("2d");
var VIEW = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var vw = window.innerWidth, vh = window.innerHeight;
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px";
  cv.style.height = vh + "px";
  var s = Math.min(vw / W, vh / H);
  VIEW.dpr = dpr;
  VIEW.scale = s * dpr;
  VIEW.ox = (vw - W * s) / 2 * dpr;
  VIEW.oy = (vh - H * s) / 2 * dpr;
}
/* screen pixels -> arena coordinates */
function toWorld(px, py) {
  return { x: (px * VIEW.dpr - VIEW.ox) / VIEW.scale, y: (py * VIEW.dpr - VIEW.oy) / VIEW.scale };
}

function teamCol(team) {
  if (team === "red" && G && G.zone === 2) return G.lord ? "#7b2fd0" : "#2f7a46";
  return team === "blue" ? "#1d6ef5" : "#e0352b";
}
function teamDark(team) {
  if (team === "red" && G && G.zone === 2) return G.lord ? "#3d1470" : "#17502b";
  return team === "blue" ? "#0d49b0" : "#9c1d16";
}
function box(x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
}

function drawArena() {
  if (G.zone === 2) { drawWood(); return; }
  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, W, H);
  // a very quiet grid, so movement reads without colouring the arena
  g.strokeStyle = "#eef1f6";
  g.lineWidth = 2;
  g.beginPath();
  for (var x = 100; x < W; x += 100) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (var y = 100; y < H; y += 100) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  // halfway line and centre ring
  g.strokeStyle = "#e2e7ef";
  g.lineWidth = 3;
  g.setLineDash([14, 16]);
  g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
  g.setLineDash([]);
  g.beginPath(); g.arc(W / 2, H / 2, 120, 0, TAU); g.stroke();
  // boundary
  g.strokeStyle = "#141821";
  g.lineWidth = 6;
  g.strokeRect(3, 3, W - 6, H - 6);
  // corner ticks
  g.lineWidth = 4;
  var c = 46;
  var corners = [[10, 10, 1, 1], [W - 10, 10, -1, 1], [10, H - 10, 1, -1], [W - 10, H - 10, -1, -1]];
  for (var i = 0; i < corners.length; i++) {
    var k = corners[i];
    g.beginPath();
    g.moveTo(k[0] + c * k[2], k[1]); g.lineTo(k[0], k[1]); g.lineTo(k[0], k[1] + c * k[3]);
    g.stroke();
  }
  // spawn pads, outlined only
  g.lineWidth = 3;
  g.strokeStyle = "#dbe7fd";
  g.beginPath(); g.arc(230, H / 2, 64, 0, TAU); g.stroke();
  g.strokeStyle = "#fadedc";
  g.beginPath(); g.arc(W - 230, H / 2, 64, 0, TAU); g.stroke();
}

/* the forest floor: black-green, fog in the hollows, a ring of old stones for
   the last rung, and fireflies that are probably fireflies */
function drawWood() {
  var lord = G.lord;
  var g1 = g.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, 1000);
  if (lord) { g1.addColorStop(0, "#1a0b2a"); g1.addColorStop(0.5, "#0d0618"); g1.addColorStop(1, "#05020a"); }
  else { g1.addColorStop(0, "#132a1c"); g1.addColorStop(0.55, "#0b1a12"); g1.addColorStop(1, "#060f0a"); }
  g.fillStyle = g1;
  g.fillRect(0, 0, W, H);

  // undergrowth: short strokes, denser at the edges
  g.strokeStyle = lord ? "rgba(120,60,190,.1)" : "rgba(90,170,110,.09)";
  g.lineWidth = 3;
  g.beginPath();
  for (var i = 0; i < 150; i++) {
    var px = ((i * 137.5) % W), py = ((i * 311.7) % H);
    var edge = Math.min(px, W - px, py, H - py);
    if (edge > 300 && i % 3) continue;
    g.moveTo(px, py); g.lineTo(px + ((i % 5) - 2) * 4, py - 12 - (i % 9));
  }
  g.stroke();

  // the ring in the middle
  g.strokeStyle = lord ? "rgba(160,92,255,.5)" : "rgba(120,200,150,.22)";
  g.lineWidth = lord ? 5 : 3;
  g.beginPath(); g.arc(W / 2, H / 2, 150, 0, TAU); g.stroke();
  if (lord) {
    var pul = 0.5 + Math.sin(G.t * 1.6) * 0.5;
    g.globalAlpha = 0.25 + pul * 0.4;
    g.strokeStyle = "#a05cff"; g.lineWidth = 2;
    g.beginPath(); g.arc(W / 2, H / 2, 150 + pul * 26, 0, TAU); g.stroke();
    // runes round the ring
    for (var r = 0; r < 12; r++) {
      var ra = (r / 12) * TAU + G.t * 0.12;
      var rx = W / 2 + Math.cos(ra) * 150, ry = H / 2 + Math.sin(ra) * 150;
      g.save(); g.translate(rx, ry); g.rotate(ra);
      g.globalAlpha = 0.5 + pul * 0.4;
      g.fillStyle = "#c79bff";
      g.fillRect(-3, -14, 6, 10); g.fillRect(-9, -2, 18, 4);
      g.restore();
    }
    g.globalAlpha = 1;
  }

  // mist in bands
  for (var m = 0; m < 5; m++) {
    var my = (m * 190 + (G.t * 9) % 190) % (H + 160) - 80;
    var gr = g.createLinearGradient(0, my - 60, 0, my + 60);
    gr.addColorStop(0, "rgba(255,255,255,0)");
    gr.addColorStop(0.5, lord ? "rgba(150,110,210,.05)" : "rgba(190,230,205,.055)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.fillRect(0, my - 60, W, 120);
  }

  // fireflies
  for (var f = 0; f < G.flies.length; f++) {
    var fl = G.flies[f];
    var a2 = 0.25 + 0.75 * Math.abs(Math.sin(G.t * fl.sp + fl.ph));
    g.globalAlpha = a2 * 0.8;
    g.fillStyle = lord ? "#b06cff" : "#bff07a";
    g.beginPath();
    g.arc(fl.x + Math.sin(G.t * 0.4 + fl.ph) * 16, fl.y + Math.cos(G.t * 0.33 + fl.ph) * 12, fl.r, 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;

  // boundary: a wall of trunks
  g.strokeStyle = lord ? "#1d0f30" : "#0a1710";
  g.lineWidth = 6;
  g.strokeRect(3, 3, W - 6, H - 6);
  g.fillStyle = lord ? "#140826" : "#081108";
  for (var tI = 0; tI < 42; tI++) {
    var tw = 26 + (tI % 4) * 9;
    var tx = (tI * 193) % (W - 40);
    g.fillRect(tx, 0, tw, 26 + (tI % 5) * 7);
    g.fillRect((tx + 97) % (W - 40), H - (24 + (tI % 4) * 9), tw, 24 + (tI % 4) * 9);
  }
  for (var tJ = 0; tJ < 22; tJ++) {
    var th = 30 + (tJ % 4) * 11;
    var ty = (tJ * 171) % (H - 40);
    g.fillRect(0, ty, 22 + (tJ % 3) * 8, th);
    g.fillRect(W - (20 + (tJ % 3) * 9), (ty + 61) % (H - 40), 20 + (tJ % 3) * 9, th);
  }

  // spawn pads
  g.lineWidth = 3;
  g.strokeStyle = "rgba(109,168,255,.35)";
  g.beginPath(); g.arc(230, H / 2, 64, 0, TAU); g.stroke();
  g.strokeStyle = lord ? "rgba(160,92,255,.45)" : "rgba(224,53,43,.3)";
  g.beginPath(); g.arc(W - 230, H / 2, 64, 0, TAU); g.stroke();
}

/* the black hole the void bullet leaves behind */
function drawHole() {
  if (!G.hole) return;
  var h = G.hole, k = clamp(1 - h.t / h.life, 0, 1);
  g.save();
  g.translate(h.x, h.y);
  g.rotate(G.t * 2.2);
  var rr = h.r * k;
  var gr = g.createRadialGradient(0, 0, rr * 0.2, 0, 0, rr * 3.2);
  gr.addColorStop(0, "rgba(0,0,0,1)");
  gr.addColorStop(0.42, "rgba(20,4,40,.92)");
  gr.addColorStop(0.72, "rgba(123,47,208,.35)");
  gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, rr * 3.2, 0, TAU); g.fill();
  g.fillStyle = "#000000";
  g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.fill();
  g.strokeStyle = "rgba(199,155,255,.9)"; g.lineWidth = 3;
  for (var i = 0; i < 3; i++) {
    g.globalAlpha = 0.8 * k;
    g.beginPath();
    g.ellipse(0, 0, rr * (1.5 + i * 0.5), rr * (0.4 + i * 0.16), i * 0.7, 0, TAU);
    g.stroke();
  }
  g.restore();
}

/* ------------------------------------------------------- THE DARK LORD -- */
function drawLord(t) {
  var s = t.scale, pul = 0.5 + Math.sin(G.t * 3) * 0.5;
  g.save();
  g.translate(t.x, t.y);
  g.globalAlpha = t.tp > 0 ? clamp(1 - t.tp / 0.45, 0.1, 1) : 1;

  // the shadow it casts is bigger than it is
  g.save();
  g.globalAlpha *= 0.5;
  var sg = g.createRadialGradient(0, 0, 10, 0, 0, 150);
  sg.addColorStop(0, "rgba(10,0,20,.8)"); sg.addColorStop(1, "rgba(10,0,20,0)");
  g.fillStyle = sg;
  g.beginPath(); g.arc(0, 0, 150, 0, TAU); g.fill();
  g.restore();

  // two rings of runes, turning against each other
  for (var ring = 0; ring < 2; ring++) {
    g.save();
    g.rotate(G.t * (ring ? -0.5 : 0.8));
    g.strokeStyle = ring ? "rgba(123,47,208,.75)" : "rgba(199,155,255,.6)";
    g.lineWidth = ring ? 4 : 2;
    var rr = ring ? 78 : 96;
    g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.stroke();
    for (var i = 0; i < (ring ? 8 : 14); i++) {
      var a = (i / (ring ? 8 : 14)) * TAU;
      g.beginPath();
      g.moveTo(Math.cos(a) * (rr - 9), Math.sin(a) * (rr - 9));
      g.lineTo(Math.cos(a) * (rr + 9), Math.sin(a) * (rr + 9));
      g.stroke();
    }
    g.restore();
  }

  // hull: a black hexagon with a purple edge
  g.save();
  g.rotate(t.hull);
  g.beginPath();
  for (var h = 0; h < 6; h++) {
    var ha = (h / 6) * TAU;
    var hx = Math.cos(ha) * 42 * s * 0.6, hy = Math.sin(ha) * 34 * s * 0.6;
    if (h === 0) g.moveTo(hx, hy); else g.lineTo(hx, hy);
  }
  g.closePath();
  g.fillStyle = t.hitT > 0 ? "#3a1060" : "#0a0412";
  g.fill();
  g.strokeStyle = "#7b2fd0"; g.lineWidth = 4; g.stroke();
  g.strokeStyle = "rgba(199,155,255," + (0.3 + pul * 0.5) + ")"; g.lineWidth = 2; g.stroke();
  // plating
  g.strokeStyle = "rgba(160,92,255,.35)"; g.lineWidth = 2;
  for (var pl = -1; pl <= 1; pl++) {
    g.beginPath(); g.moveTo(-24 * s * 0.6, pl * 9 * s * 0.6); g.lineTo(24 * s * 0.6, pl * 9 * s * 0.6); g.stroke();
  }
  g.restore();

  // the barrel, and the core it is fed from
  g.save();
  g.rotate(t.turret);
  g.fillStyle = "#05010a";
  g.fillRect(0, -7 * s * 0.7, 54 * s * 0.7, 14 * s * 0.7);
  g.strokeStyle = "#7b2fd0"; g.lineWidth = 3;
  g.strokeRect(0, -7 * s * 0.7, 54 * s * 0.7, 14 * s * 0.7);
  var mg = g.createRadialGradient(54 * s * 0.7, 0, 1, 54 * s * 0.7, 0, 22);
  mg.addColorStop(0, "rgba(199,155,255,.9)"); mg.addColorStop(1, "rgba(160,92,255,0)");
  g.fillStyle = mg;
  g.beginPath(); g.arc(54 * s * 0.7, 0, 22, 0, TAU); g.fill();
  g.restore();

  // the eye
  var eg = g.createRadialGradient(0, 0, 2, 0, 0, 34 + pul * 10);
  eg.addColorStop(0, "#ffffff");
  eg.addColorStop(0.25, "#c79bff");
  eg.addColorStop(0.7, "rgba(123,47,208,.55)");
  eg.addColorStop(1, "rgba(123,47,208,0)");
  g.fillStyle = eg;
  g.beginPath(); g.arc(0, 0, 34 + pul * 10, 0, TAU); g.fill();
  g.fillStyle = "#07040c";
  g.beginPath(); g.ellipse(0, 0, 9, 16 - pul * 5, 0, 0, TAU); g.fill();

  // three shards, orbiting
  for (var sh = 0; sh < 3; sh++) {
    var sa = G.t * 1.4 + (sh / 3) * TAU;
    var sx = Math.cos(sa) * 108, sy = Math.sin(sa) * 108 * 0.7;
    g.save();
    g.translate(sx, sy);
    g.rotate(sa * 2);
    g.fillStyle = "#1a0b2a";
    g.strokeStyle = "#a05cff"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -13); g.lineTo(8, 0); g.lineTo(0, 13); g.lineTo(-8, 0); g.closePath();
    g.fill(); g.stroke();
    g.restore();
  }

  // the wall of blue light, when it decides it has had enough of your shells
  if (t.blockT > 0) {
    var bk = clamp(t.blockT / 0.45, 0, 1);
    g.globalAlpha = bk;
    g.strokeStyle = "#4fd8ff"; g.lineWidth = 6;
    g.beginPath();
    for (var b2 = 0; b2 <= 6; b2++) {
      var ba = (b2 / 6) * TAU + G.t * 3;
      var bx = Math.cos(ba) * 104, by = Math.sin(ba) * 104;
      if (b2 === 0) g.moveTo(bx, by); else g.lineTo(bx, by);
    }
    g.stroke();
    g.globalAlpha = bk * 0.18;
    g.fillStyle = "#4fd8ff";
    g.fill();
    g.globalAlpha = bk * 0.55;
    g.strokeStyle = "#dffbff"; g.lineWidth = 1.5;
    for (var l = 0; l < 6; l++) {
      var la = (l / 6) * TAU + G.t * 3;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(la) * 104, Math.sin(la) * 104); g.stroke();
    }
    // the rim is where the light is
    g.globalAlpha = bk;
    g.strokeStyle = "rgba(223,251,255,.9)"; g.lineWidth = 2;
    g.beginPath();
    for (var b3 = 0; b3 <= 6; b3++) {
      var b3a = (b3 / 6) * TAU + G.t * 3;
      var b3x = Math.cos(b3a) * 112, b3y = Math.sin(b3a) * 112;
      if (b3 === 0) g.moveTo(b3x, b3y); else g.lineTo(b3x, b3y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  g.restore();

  // name plate, because it has earned one
  g.save();
  g.globalAlpha = 0.9;
  g.fillStyle = "#c79bff";
  g.font = "700 20px ui-sans-serif,system-ui,sans-serif";
  g.textAlign = "center";
  g.fillText("THE DARK LORD", t.x, t.y - 128);
  g.restore();
}

function drawPillars() {
  for (var i = 0; i < G.pillars.length; i++) {
    var p = G.pillars[i];
    if (p.tree) {
      // a trunk, seen from above, with a canopy over it
      g.fillStyle = "rgba(4,10,6,.55)";
      g.beginPath(); g.arc(p.x + p.w / 2 + 6, p.y + p.h / 2 + 8, p.w * 1.5, 0, TAU); g.fill();
      g.fillStyle = "#15351f";
      g.beginPath(); g.arc(p.x + p.w / 2, p.y + p.h / 2, p.w * 1.35, 0, TAU); g.fill();
      g.fillStyle = "#1d4a2b";
      g.beginPath(); g.arc(p.x + p.w / 2 - 6, p.y + p.h / 2 - 6, p.w * 0.95, 0, TAU); g.fill();
      g.fillStyle = "#2a1a10";
      g.beginPath(); g.arc(p.x + p.w / 2, p.y + p.h / 2, p.w * 0.36, 0, TAU); g.fill();
      continue;
    }
    if (G.zone === 2) {
      // a standing stone: wider at the base, chipped at the top, lit from within
      var cx2 = p.x + p.w / 2, top = p.y, bot = p.y + p.h;
      g.fillStyle = "rgba(2,0,6,.5)";
      g.beginPath(); g.ellipse(cx2 + 6, bot - 4, p.w * 0.8, 12, 0, 0, TAU); g.fill();
      g.beginPath();
      g.moveTo(p.x + 6, bot); g.lineTo(p.x - 2, top + 22); g.lineTo(cx2 - 8, top);
      g.lineTo(cx2 + 10, top + 6); g.lineTo(p.x + p.w + 2, top + 26); g.lineTo(p.x + p.w - 5, bot);
      g.closePath();
      g.fillStyle = "#170d24"; g.fill();
      g.strokeStyle = "#6a3aa8"; g.lineWidth = 3; g.stroke();
      var gl = 0.3 + Math.sin(G.t * 1.5 + p.x) * 0.25;
      g.strokeStyle = "rgba(199,155,255," + gl + ")"; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(cx2 - 9, top + 40); g.lineTo(cx2 + 9, top + 40);
      g.moveTo(cx2, top + 34); g.lineTo(cx2, top + 62);
      g.moveTo(cx2 - 7, top + 74); g.lineTo(cx2 + 7, top + 86);
      g.stroke();
      continue;
    }
    g.fillStyle = "#ffffff";
    g.fillRect(p.x, p.y, p.w, p.h);
    g.strokeStyle = "#141821"; g.lineWidth = 5;
    g.strokeRect(p.x, p.y, p.w, p.h);
    g.strokeStyle = "#e2e7ef"; g.lineWidth = 3;
    g.beginPath();
    for (var y = p.y + 26; y < p.y + p.h - 6; y += 26) { g.moveTo(p.x + 6, y); g.lineTo(p.x + p.w - 6, y); }
    g.stroke();
  }
}

function drawMarks() {
  for (var i = 0; i < G.marks.length; i++) {
    var m = G.marks[i];
    if (m.wreck) {
      g.save();
      g.globalAlpha = 0.13;
      g.translate(m.x, m.y); g.rotate(m.a);
      g.fillStyle = "#141821";
      g.fillRect(-TUNE.tankW / 2, -TUNE.tankH / 2, TUNE.tankW, TUNE.tankH);
      g.restore();
      g.save();
      g.globalAlpha = 0.45;
      g.strokeStyle = "#c9cfdb"; g.lineWidth = 3;
      g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.stroke();
      g.restore();
      continue;
    }
    g.save();
    g.globalAlpha = clamp(m.life / m.max, 0, 1) * 0.22;
    g.translate(m.x, m.y); g.rotate(m.a);
    g.fillStyle = "#8a93a3";
    g.fillRect(-7, -TUNE.tankH / 2, 14, 5);
    g.fillRect(-7, TUNE.tankH / 2 - 5, 14, 5);
    g.restore();
  }
}

function drawWall(w) {
  g.save();
  g.translate(w.x, w.y);
  g.rotate(w.a);
  var hw = TUNE.wallW / 2, hh = TUNE.wallH / 2;
  var young = clamp((G.t - w.born) / 0.22, 0.05, 1);
  g.scale(1, young);                                    // it pops up out of the floor
  g.fillStyle = w.hitT > 0 ? "#ffe6e4" : "#ffffff";
  g.fillRect(-hw, -hh, hw * 2, hh * 2);
  g.strokeStyle = "#141821"; g.lineWidth = 4;
  g.strokeRect(-hw, -hh, hw * 2, hh * 2);
  g.strokeStyle = "#c9cfdb"; g.lineWidth = 2;
  g.beginPath();
  for (var x = -hw + 24; x < hw; x += 24) { g.moveTo(x, -hh + 3); g.lineTo(x, hh - 3); }
  g.moveTo(-hw + 3, 0); g.lineTo(hw - 3, 0);
  g.stroke();
  // it is about to crumble on its own
  var age = G.t - w.born;
  if (age > 21) {
    g.globalAlpha = (Math.sin(age * 14) + 1) / 2 * 0.5;
    g.fillStyle = "#c9cfdb";
    g.fillRect(-hw, -hh, hw * 2, hh * 2);
  }
  g.restore();
}

function drawFlag(f) {
  var col = teamCol(f.team), dark = teamDark(f.team);
  var pole = TUNE.flagPole;
  g.save();
  g.translate(f.x, f.y);
  // base
  g.fillStyle = "#ffffff";
  g.beginPath(); g.ellipse(0, 0, 34, 13, 0, 0, TAU); g.fill();
  g.strokeStyle = "#141821"; g.lineWidth = 4; g.stroke();
  if (f.down) {
    g.rotate(1.0);
    g.strokeStyle = "#8a93a3"; g.lineWidth = 6;
    g.beginPath(); g.moveTo(0, -4); g.lineTo(pole * 0.8, -4); g.stroke();
    g.globalAlpha = 0.3;
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(pole * 0.36, -8); g.lineTo(pole * 0.8, -8); g.lineTo(pole * 0.8, -36); g.lineTo(pole * 0.36, -30);
    g.closePath(); g.fill();
    g.restore();
    return;
  }
  // pole
  g.strokeStyle = "#141821"; g.lineWidth = 6; g.lineCap = "round";
  g.beginPath(); g.moveTo(0, -4); g.lineTo(0, -pole); g.stroke();
  g.lineCap = "butt";
  // cloth, waving
  var wob = f.wave, i, t;
  g.beginPath();
  g.moveTo(2, -pole + 2);
  for (i = 0; i <= 10; i++) {
    t = i / 10;
    g.lineTo(2 + t * 64, -pole + 2 + Math.sin(wob + t * 3.4) * 5 * t);
  }
  for (i = 10; i >= 0; i--) {
    t = i / 10;
    g.lineTo(2 + t * 64, -pole + 42 + Math.sin(wob + t * 3.4 + 0.6) * 6 * t);
  }
  g.closePath();
  g.fillStyle = f.hitT > 0 ? "#ffffff" : col;
  g.fill();
  g.strokeStyle = dark; g.lineWidth = 3; g.stroke();
  // hits left, as pips on the pole
  for (var p = 0; p < f.max; p++) {
    g.fillStyle = p < f.hp ? col : "#ffffff";
    g.strokeStyle = "#141821"; g.lineWidth = 2.5;
    g.beginPath(); g.arc(-14, -26 - p * 15, 5, 0, TAU); g.fill(); g.stroke();
  }
  // where a shell has to land
  g.globalAlpha = 0.13;
  g.strokeStyle = "#141821"; g.lineWidth = 2;
  g.beginPath(); g.arc(0, -34, 44, 0, TAU); g.stroke();
  g.restore();
}

function drawTank(t) {
  if (!t.alive) return;
  if (t.lord) { drawLord(t); return; }
  var col = teamCol(t.team), dark = teamDark(t.team);
  var flash = t.hitT > 0;
  var s = t.scale, i, a;
  g.save();
  g.translate(t.x, t.y);
  // contact shadow
  g.save();
  g.globalAlpha = 0.1; g.fillStyle = "#141821";
  g.beginPath(); g.ellipse(3, 5, 27 * s, 20 * s, 0, 0, TAU); g.fill();
  g.restore();

  /* ---- hull and treads ---- */
  g.save();
  g.rotate(t.hull);
  g.scale(s, s);
  var bw = TUNE.tankW, bh = TUNE.tankH;
  for (var k = 0; k < 2; k++) {
    var ty = (k === 0 ? -1 : 1) * (bh / 2 + 4) - 6;
    g.fillStyle = "#ffffff"; g.strokeStyle = "#141821"; g.lineWidth = 4;
    box(-bw / 2 - 2, ty, bw + 4, 12, 4);
    g.fill(); g.stroke();
    g.strokeStyle = "#c9cfdb"; g.lineWidth = 2.5;
    g.beginPath();
    var off = (t.tread * 0.7) % 9;
    for (var x = -bw / 2 + off; x < bw / 2; x += 9) { g.moveTo(x, ty + 1.5); g.lineTo(x, ty + 10.5); }
    g.stroke();
  }
  g.fillStyle = flash ? "#ffffff" : col;
  box(-bw / 2, -bh / 2, bw, bh, 5);
  g.fill();
  g.strokeStyle = "#141821"; g.lineWidth = 4; g.stroke();
  g.strokeStyle = flash ? "#c9cfdb" : dark; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(-bw / 2 + 9, -bh / 2 + 4); g.lineTo(-bw / 2 + 9, bh / 2 - 4);
  g.moveTo(bw / 2 - 12, -bh / 2 + 4); g.lineTo(bw / 2 - 12, bh / 2 - 4);
  g.stroke();
  g.restore();

  /* ---- turret, with one barrel per shooter ---- */
  g.save();
  g.rotate(t.turret);
  g.scale(s, s);
  var n = t.shooters;
  var spread = n === 2 ? 0.16 : n === 3 ? 0.3 : n === 4 ? 0.44 : 0;
  for (i = 0; i < n; i++) {
    if (n >= 10) a = (i / n) * TAU;
    else if (n === 1) a = 0;
    else a = -spread / 2 + (i / (n - 1)) * spread;
    g.save(); g.rotate(a);
    g.fillStyle = "#ffffff"; g.strokeStyle = "#141821"; g.lineWidth = n > 1 ? 3 : 4;
    box(4, -5, TUNE.barrel, 10, 3);
    g.fill(); g.stroke();
    box(TUNE.barrel, -7, 8, 14, 2);
    g.fill(); g.stroke();
    g.restore();
  }
  g.fillStyle = flash ? "#ffffff" : col;
  g.beginPath(); g.arc(0, 0, 15, 0, TAU); g.fill();
  g.strokeStyle = "#141821"; g.lineWidth = 4; g.stroke();
  g.strokeStyle = flash ? "#c9cfdb" : dark; g.lineWidth = 3;
  g.beginPath(); g.arc(-2, 0, 7, 0, TAU); g.stroke();
  g.restore();

  /* ---- tags ---- */
  if (t.kind === "you") {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(0, -42 * s); g.lineTo(8, -31 * s); g.lineTo(-8, -31 * s);
    g.closePath(); g.fill();
  }
  if (t.boss) {
    g.save();
    g.strokeStyle = "#e0352b"; g.lineWidth = 3;
    g.globalAlpha = 0.45 + Math.sin(G.t * 4) * 0.2;
    g.beginPath(); g.arc(0, 0, 54, 0, TAU); g.stroke();
    g.restore();
  }
  if (teamExposed(t.team)) {                    // no flag, no armour
    g.save();
    g.globalAlpha = 0.6;
    g.strokeStyle = "#141821"; g.lineWidth = 2;
    g.setLineDash([5, 6]);
    g.beginPath(); g.arc(0, 0, t.r + 10, 0, TAU); g.stroke();
    g.restore();
  }
  g.restore();

  // reload ring under your own tank
  if (t.kind === "you" && t.cd > 0 && t.fire > 0) {
    var frac = 1 - t.cd / t.fire;
    g.strokeStyle = "#dbe7fd"; g.lineWidth = 4;
    g.beginPath(); g.arc(t.x, t.y, 36, 0, TAU); g.stroke();
    g.strokeStyle = "#1d6ef5";
    g.beginPath(); g.arc(t.x, t.y, 36, -Math.PI / 2, -Math.PI / 2 + frac * TAU); g.stroke();
  }
}

function drawAimLine() {
  var you = G.you;
  if (!you.alive || G.state !== "play") return;
  var a = you.turret;
  g.save();
  g.globalAlpha = 0.26;
  g.strokeStyle = "#1d6ef5";
  g.lineWidth = 2;
  g.setLineDash([9, 13]);
  g.beginPath();
  g.moveTo(you.x + Math.cos(a) * 46, you.y + Math.sin(a) * 46);
  g.lineTo(you.x + Math.cos(a) * 700, you.y + Math.sin(a) * 700);
  g.stroke();
  /* in the wood, trace where the banana actually goes - both sides of it, since
     the next shot swaps */
  if (roundForest()) {
    g.setLineDash([]);
    var sp = TUNE.shellSpeed * myBulletSpeed();
    var tx = you.x + Math.cos(a) * 820, ty = you.y + Math.sin(a) * 820;
    for (var side = -1; side <= 1; side += 2) {
      var next = side === you.curveSign * -1;
      g.globalAlpha = next ? 0.5 : 0.16;
      g.lineWidth = next ? 3 : 2;
      var px = you.x + Math.cos(a + 0.5 * side) * 46;
      var py = you.y + Math.sin(a + 0.5 * side) * 46;
      var pa = a + 0.5 * side, dt2 = 1 / 30;
      g.beginPath(); g.moveTo(px, py);
      for (var i = 0; i < 44; i++) {
        var cv = -TUNE.curveRate * side;
        if (i * dt2 < 2.2) cv = clamp(angDiff(pa, angTo(px, py, tx, ty)) * 3.2, -1.9, 1.9);
        pa += cv * dt2;
        px += Math.cos(pa) * sp * dt2;
        py += Math.sin(pa) * sp * dt2;
        if (px < 0 || px > W || py < 0 || py > H) break;
        g.lineTo(px, py);
      }
      g.stroke();
    }
  }
  g.restore();
}

function drawShell(s) {
  var scale = (s.r || TUNE.shellR) / TUNE.shellR;
  if (s.kind === "void") { drawVoidShell(s); return; }
  g.strokeStyle = s.col ? "rgba(160,92,255,.55)"
    : s.kind === "gold" ? "rgba(255,207,74,.75)"
    : s.kind === "flash" ? "rgba(120,240,255,.8)"
    : s.team === "blue" ? "#bcd4fd"
    : (G.zone === 2 ? "rgba(122,214,150,.75)" : "#f8cdc9");
  g.lineWidth = 4 * scale;
  g.beginPath();
  for (var i = 0; i < s.trail.length; i += 2) {
    if (i === 0) g.moveTo(s.trail[i], s.trail[i + 1]); else g.lineTo(s.trail[i], s.trail[i + 1]);
  }
  g.lineTo(s.x, s.y);
  g.stroke();
  g.save();
  g.translate(s.x, s.y);
  g.rotate(s.a);
  g.scale(scale, scale);
  if (s.col) {                                     // the dark lord's magic
    var lg = g.createRadialGradient(0, 0, 1, 0, 0, 20);
    lg.addColorStop(0, "#ffffff"); lg.addColorStop(0.3, s.col);
    lg.addColorStop(1, "rgba(123,47,208,0)");
    g.fillStyle = lg;
    g.beginPath(); g.arc(0, 0, 20, 0, TAU); g.fill();
    g.fillStyle = "#07040c";
    g.beginPath(); g.arc(0, 0, 5, 0, TAU); g.fill();
    g.strokeStyle = s.col; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 9 + Math.sin(G.t * 12) * 2, 0, TAU); g.stroke();
    g.restore();
    return;
  }
  g.fillStyle = s.kind === "gold" ? "#ffcf4a" : s.kind === "flash" ? "#9ff4ff" : "#ffffff";
  g.strokeStyle = s.kind === "cannon" ? "#6b4a00" : "#141821";
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(10, 0); g.lineTo(2, -6); g.lineTo(-8, -6); g.lineTo(-8, 6); g.lineTo(2, 6);
  g.closePath();
  g.fill(); g.stroke();
  g.fillStyle = s.kind === "gold" ? "#b8860b" : s.kind === "cannon" ? "#2a2a2a" : teamCol(s.team);
  g.fillRect(-8, -6, 4, 12);
  if (s.kind === "gold" || s.kind === "flash") {
    g.globalAlpha = 0.5 + Math.sin(G.t * 20) * 0.3;
    g.strokeStyle = s.kind === "gold" ? "#ffe9a8" : "#dffbff";
    g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 13, 0, TAU); g.stroke();
  }
  g.restore();
}

function drawVoidShell(s) {
  g.save();
  g.translate(s.x, s.y);
  g.rotate(G.t * 5);
  var r = s.r || 18;
  var vg = g.createRadialGradient(0, 0, 1, 0, 0, r * 3);
  vg.addColorStop(0, "#000000");
  vg.addColorStop(0.5, "rgba(26,11,42,.9)");
  vg.addColorStop(1, "rgba(123,47,208,0)");
  g.fillStyle = vg;
  g.beginPath(); g.arc(0, 0, r * 3, 0, TAU); g.fill();
  g.fillStyle = "#000000";
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  g.strokeStyle = "rgba(199,155,255,.9)"; g.lineWidth = 2;
  g.beginPath(); g.ellipse(0, 0, r * 2, r * 0.7, 0, 0, TAU); g.stroke();
  g.beginPath(); g.ellipse(0, 0, r * 2, r * 0.7, 1.1, 0, TAU); g.stroke();
  g.restore();
}

function drawParts() {
  var i;
  g.save();
  for (i = 0; i < G.parts.length; i++) {
    var p = G.parts[i];
    g.globalAlpha = clamp(p.life / p.max, 0, 1);
    g.fillStyle = p.col;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
  }
  for (i = 0; i < G.rings.length; i++) {
    var rg = G.rings[i];
    g.globalAlpha = clamp(rg.t / rg.life, 0, 1) * 0.6;
    g.strokeStyle = rg.col; g.lineWidth = 4;
    g.beginPath(); g.arc(rg.x, rg.y, rg.r, 0, TAU); g.stroke();
  }
  g.restore();
}

/* the twenty-second wall timer, parked under your tank */
function drawWallMeter() {
  var you = G.you;
  if (!you.alive) return;
  var ready = you.wallCd <= 0;
  var x = you.x - 28, y = you.y + 52, w = 56, h = 8;
  g.save();
  if (ready) {
    g.globalAlpha = 0.9;
    g.fillStyle = "#1d6ef5";
    for (var i = 0; i < 4; i++) g.fillRect(x + i * 15, y, 11, h);   // a little row of bricks: ready
  } else {
    g.globalAlpha = 0.55;
    g.fillStyle = "#ffffff";
    g.strokeStyle = "#c9cfdb"; g.lineWidth = 2;
    box(x, y, w, h, 4); g.fill(); g.stroke();
    g.fillStyle = "#c9cfdb";
    g.fillRect(x + 2, y + 2, (w - 4) * (1 - you.wallCd / TUNE.wallCool), h - 4);
  }
  g.restore();
}

function drawFrame() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#f4f6fa";
  g.fillRect(0, 0, cv.width, cv.height);
  if (!G) return;
  g.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  if (G.shake > 0) g.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  g.save();
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  drawArena();
  drawMarks();
  drawHole();
  drawPillars();
  for (var df = 0; df < G.flags.length; df++) drawFlag(G.flags[df]);
  for (var w = 0; w < G.walls.length; w++) drawWall(G.walls[w]);
  drawAimLine();
  drawTank(G.you);
  for (var f = 0; f < G.foes.length; f++) drawTank(G.foes[f]);
  for (var s = 0; s < G.shells.length; s++) drawShell(G.shells[s]);
  drawParts();
  drawWallMeter();
  if (G.guard > 0 && G.state === "play") {
    g.globalAlpha = clamp(G.guard / TUNE.spawnGuard, 0, 1) * 0.45;
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
  }
  g.restore();
}

function upgradeCard(o) {
  var wrap = document.createElement("div");
  wrap.className = "up";
  var maxed = o.level >= o.levels;
  var canAfford = !maxed && SAVE.coins >= o.cost;
  var pct = Math.round((o.level - 1) / (o.levels - 1) * 100);
  wrap.innerHTML =
    '<div class="head"><b>' + o.name + '</b><span>LEVEL ' + o.level + " / " + o.levels + '</span></div>' +
    '<div class="now">' + o.now + '</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="buy"></div>';
  var buy = wrap.querySelector(".buy");
  if (maxed) {
    var p = document.createElement("span");
    p.className = "pill";
    p.textContent = "MAXED OUT";
    buy.appendChild(p);
  } else {
    var b = document.createElement("button");
    b.className = "btn small" + (canAfford ? "" : " ghost");
    b.textContent = o.cost + (o.cost === 1 ? " COIN" : " COINS");
    if (!canAfford) b.disabled = true;
    b.addEventListener("click", function () {
      if (SAVE.coins < o.cost) { AU.sfx("deny"); return; }
      SAVE.coins -= o.cost;
      o.buy();
      saveNow();
      AU.sfx("buy");
      buildShop();
      buildModes();
    });
    buy.appendChild(b);
    var nx = document.createElement("span");
    nx.className = "pill";
    nx.textContent = "NEXT: " + o.next;
    buy.appendChild(nx);
  }
  return wrap;
}

/* =============================================================== ROUND ==== */
var paused = false;
function playRound(mode, level) {
  AU.init(); AU.resume();
  paused = false;
  show("game");
  resize();
  startRound(mode, level);
  G.state = "play";
  refreshPips();
  $("hudMsg").textContent = G.msg;
  $("deskHint").innerHTML = harshMode(mode)
    ? "WASD MOVE &middot; MOUSE AIM &middot; CLICK OR SPACE FIRE &middot; E WALL &middot; ESC GIVES UP, AND THERE ARE NO RETRIES"
    : "WASD MOVE &middot; MOUSE AIM &middot; CLICK OR SPACE FIRE &middot; E WALL &middot; ESC QUITS";
}

/* End mode and the boss do not hand out second chances: lose once and the run
 * starts over from the bottom and you are put back on the main menu. */
function harshMode(mode) { return mode === "end" || mode === "boss" || mode === "forest"; }
var resultHome = false;

function showResult() {
  G.state = "result";
  var won = G.won, mode = G.mode, level = G.level;
  var reward = 0, unlocked = false, wiped = false;
  if (won) {
    if (mode === "end") {
      reward = 1;
      if (level === SAVE.endLevel && level < END_LEVELS.length) SAVE.endLevel = level + 1;
      else if (level === END_LEVELS.length) {
        if (!SAVE.endBeaten) unlocked = true;
        SAVE.endBeaten = true;
        SAVE.boss = true;
      }
    } else if (mode === "boss") {
      reward = SAVE.bossBeaten ? 3 : 10;
      SAVE.bossBeaten = true;
    } else if (mode === "forest") {
      reward = forestReward(level);
      if (level === FOREST_LEVELS.length) {       // endless: the wood starts again
        SAVE.fBeaten = true;
        SAVE.fWins++;
        SAVE.fLevel = 1;
      } else if (level === SAVE.fLevel) SAVE.fLevel = level + 1;
    }
    SAVE.coins += reward;
    saveNow();
  } else if (harshMode(mode)) {
    wiped = (mode === "end" && SAVE.endLevel > 1) || (mode === "forest" && SAVE.fLevel > 1);
    if (mode === "end") SAVE.endLevel = 1;       // all the way back down the ladder
    if (mode === "forest") SAVE.fLevel = 1;
    saveNow();
  }
  resultHome = !won && harshMode(mode);
  $("resTitle").textContent = won ? "YOU WIN" : "YOU LOSE";
  $("resTitle").className = won ? "win" : "lose";

  var text;
  if (mode === "end") {
    text = won
      ? (unlocked ? "Ten out of ten. The locked one is not locked any more."
                  : level === END_LEVELS.length ? "The tenth rung again. Still ten bots, still beaten."
                  : "Rung " + level + " down. Next up: " + END_LEVELS[Math.min(level, END_LEVELS.length - 1)].label + ".")
      : "Rung " + level + " held. " + END_LEVELS[level - 1].label + " is still standing, and there are no retries: "
        + (wiped ? "end mode goes all the way back to rung one." : "end mode starts again at rung one.");
  } else if (mode === "forest") {
    text = won
      ? (level === FOREST_LEVELS.length
          ? "The dark lord came apart in the ring of stones. The wood is quiet, and it starts again at the bottom."
          : "Rung " + level + " of the wood. Next: " + FOREST_LEVELS[level].label + ".")
      : "Rung " + level + " held. " + FOREST_LEVELS[level - 1].label + " is still out there, and there are no retries: the wood starts again at rung one.";
  } else if (mode === "boss") {
    text = won ? "The big one is scrap." : "The big one is still rolling. Start it again from the top.";
  } else {
    text = won ? "Flag down, tank down. Clean round." : "Your flag fell and then so did you.";
  }
  $("resText").textContent = text;
  $("resReward").innerHTML = reward
    ? "+" + reward + (reward === 1 ? " COIN" : " COINS") + " &middot; YOU HAVE " + SAVE.coins
    : resultHome
      ? (mode === "end" ? "NO RETRIES &middot; BACK TO RUNG ONE" : "NO RETRIES")
      : (won ? "NO COIN &middot; COINS COME FROM END MODE" : "&nbsp;");
  if (reward) AU.sfx("coin");

  var lad = $("resLadder");
  lad.innerHTML = "";
  lad.style.display = (mode === "end" || mode === "forest") ? "grid" : "none";
  if (mode === "forest") {
    for (var fi = 1; fi <= FOREST_LEVELS.length; fi++) {
      var fd = document.createElement("div");
      fd.className = "rung" + (fi < SAVE.fLevel || SAVE.fBeaten ? " done" : "") + (fi === SAVE.fLevel ? " now" : "");
      fd.textContent = fi;
      lad.appendChild(fd);
    }
  }
  if (mode === "end") {
    for (var i = 1; i <= END_LEVELS.length; i++) {
      var d = document.createElement("div");
      var done = i < SAVE.endLevel || SAVE.endBeaten;
      d.className = "rung" + (done ? " done" : "") + (i === SAVE.endLevel && !SAVE.endBeaten ? " now" : "");
      d.textContent = i;
      lad.appendChild(d);
    }
  }
  var nextBtn = $("resNext"), menuBtn = $("resMenu");
  if (mode === "end" && won && !(level === END_LEVELS.length)) nextBtn.textContent = "RUNG " + SAVE.endLevel;
  else if (mode === "forest" && won) nextBtn.textContent = "RUNG " + SAVE.fLevel;
  else nextBtn.textContent = won ? "AGAIN" : "TRY AGAIN";
  nextBtn.onclick = function () {
    AU.sfx("ui");
    if (mode === "end") playRound("end", won ? SAVE.endLevel : level);
    else if (mode === "forest") playRound("forest", won ? SAVE.fLevel : level);
    else playRound(mode);
  };
  // no way back into the round: the only button out is the main menu
  nextBtn.style.display = resultHome ? "none" : "";
  $("resShop").style.display = resultHome ? "none" : "";
  menuBtn.className = resultHome ? "btn" : "btn ghost small";
  menuBtn.textContent = resultHome ? "MAIN MENU" : "MENU";
  buildModes();
  show("result");
}

function bindInput() {
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    IN.keys[k] = true;
    if (k === " " || k.indexOf("arrow") === 0) e.preventDefault();
    if (k === "escape" && $("game").classList.contains("show")) { giveUp(); }
    if (k === "p" && $("game").classList.contains("show")) togglePause();
  });
  window.addEventListener("keyup", function (e) { IN.keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { IN.keys = {}; IN.mouseDown = false; IN.fireHeld = false; });

  cv.addEventListener("mousemove", function (e) {
    var w = toWorld(e.clientX, e.clientY);
    IN.mx = w.x; IN.my = w.y; IN.usedMouse = true;
  });
  cv.addEventListener("mousedown", function (e) {
    AU.init(); AU.resume();
    var w = toWorld(e.clientX, e.clientY);
    IN.mx = w.x; IN.my = w.y; IN.usedMouse = true;
    IN.mouseDown = true; IN.firePressed = true;
    e.preventDefault();
  });
  window.addEventListener("mouseup", function () { IN.mouseDown = false; });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* ---- touch: left half drives, right half aims ---- */
  var stickEl = $("stick"), nubEl = $("nub");
  function placeStick(x, y) {
    stickEl.style.left = (x - 75) + "px";
    stickEl.style.top = (y - 75) + "px";
    stickEl.style.bottom = "auto";
  }
  function nub(dx, dy) { nubEl.style.transform = "translate(" + dx * 46 + "px," + dy * 46 + "px)"; }

  function onStart(e) {
    AU.init(); AU.resume();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < window.innerWidth * 0.5) {
        if (IN.stick.active) continue;
        IN.stick.active = true; IN.stick.id = t.identifier;
        IN.stick.cx = t.clientX; IN.stick.cy = t.clientY;
        IN.stick.dx = 0; IN.stick.dy = 0;
        placeStick(t.clientX, t.clientY);
        nub(0, 0);
      } else {
        var w = toWorld(t.clientX, t.clientY);
        IN.aim.active = true; IN.aim.id = t.identifier; IN.aim.x = w.x; IN.aim.y = w.y;
      }
    }
    e.preventDefault();
  }
  function onMove(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (IN.stick.active && t.identifier === IN.stick.id) {
        var dx = t.clientX - IN.stick.cx, dy = t.clientY - IN.stick.cy;
        var m = Math.hypot(dx, dy), max = 56;
        if (m > max) { dx = dx / m * max; dy = dy / m * max; m = max; }
        IN.stick.dx = dx / max; IN.stick.dy = dy / max;
        nub(IN.stick.dx, IN.stick.dy);
      } else if (IN.aim.active && t.identifier === IN.aim.id) {
        var w = toWorld(t.clientX, t.clientY);
        IN.aim.x = w.x; IN.aim.y = w.y;
      }
    }
    e.preventDefault();
  }
  function onEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (IN.stick.active && t.identifier === IN.stick.id) {
        IN.stick.active = false; IN.stick.dx = 0; IN.stick.dy = 0;
        stickEl.style.left = "18px"; stickEl.style.top = "auto"; stickEl.style.bottom = "18px";
        nub(0, 0);
      }
      if (IN.aim.active && t.identifier === IN.aim.id) IN.aim.active = false;
    }
  }
  var surface = $("game");           // the whole screen drives, not just the canvas
  surface.addEventListener("touchstart", onStart, { passive: false });
  surface.addEventListener("touchmove", onMove, { passive: false });
  surface.addEventListener("touchend", onEnd);
  surface.addEventListener("touchcancel", onEnd);

  function tapButton(el, down, up) {
    el.addEventListener("touchstart", function (e) { AU.init(); AU.resume(); down(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
    el.addEventListener("touchend", function (e) { if (up) up(); e.preventDefault(); e.stopPropagation(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { AU.init(); AU.resume(); down(); e.preventDefault(); e.stopPropagation(); });
    el.addEventListener("mouseup", function (e) { if (up) up(); e.stopPropagation(); });
  }
  tapButton($("fireBtn"), function () { IN.firePressed = true; IN.fireHeld = true; }, function () { IN.fireHeld = false; });
  tapButton($("wallBtn"), function () { IN.wallPressed = true; });
  tapButton($("pauseBtn"), function () { togglePause(); });
}

function togglePause() {
  if (!G || (G.state !== "play" && !paused)) return;
  paused = !paused;
  AU.sfx("ui");
  if (paused) { IN.keys = {}; IN.fireHeld = false; IN.mouseDown = false; }
}
function quitToModes() {
  paused = false;
  buildModes();
  show("modes");
}
function goMainMenu() {
  paused = false;
  buildModes();
  show("menu");
}
/* walking out of an end-mode round or a boss counts as losing it */
function giveUp() {
  if (G && harshMode(G.mode) && (G.state === "play" || G.state === "over")) {
    paused = false;
    G.won = false;
    AU.sfx("lose");
    showResult();
    return;
  }
  quitToModes();
}

/* ================================================================ MENU ==== */
function bindMenu() {
  $("playBtn").addEventListener("click", function () {
    AU.init(); AU.resume(); AU.sfx("ui");
    buildModes();
    show("modes");
  });
  $("backHome").addEventListener("click", function (e) { e.preventDefault(); AU.sfx("ui"); show("menu"); });
  $("shopBtn").addEventListener("click", function () { AU.sfx("ui"); buildShop(); show("shop"); });
  $("shopBack").addEventListener("click", function (e) { e.preventDefault(); AU.sfx("ui"); buildModes(); show("modes"); });
  $("bulletsBack").addEventListener("click", function (e) { e.preventDefault(); AU.sfx("ui"); buildModes(); show("modes"); });
  $("codesBtn").addEventListener("click", function () {
    AU.sfx("ui"); $("codeNote").innerHTML = "&nbsp;"; $("codeInput").value = ""; show("codes");
  });
  $("codesBack").addEventListener("click", function (e) { e.preventDefault(); AU.sfx("ui"); buildModes(); show("modes"); });
  $("codeGo").addEventListener("click", tryCode);
  $("codeInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryCode(); });
  $("resMenu").addEventListener("click", function () { AU.sfx("ui"); if (resultHome) goMainMenu(); else quitToModes(); });
  $("resShop").addEventListener("click", function () { AU.sfx("ui"); buildShop(); show("shop"); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
}

/* the long code: it takes you to the next zone along without making you buy out
   the one you are in. The same thing rebirth does, minus the price. */
function grantNextZone() {
  if (SAVE.zone >= LAST_ZONE) {
    $("codeNote").innerHTML = ZONE_NAME[SAVE.zone] + " IS THE LAST ONE THERE IS.<br>THERE IS NOTHING PAST IT YET.";
    AU.sfx("ui");
    return false;
  }
  SAVE.zone++;
  if (SAVE.zone === 2) SAVE.fLevel = SAVE.fLevel || 1;
  saveNow();
  buildShop();
  buildModes();
  $("codeNote").innerHTML = ZONE_NAME[SAVE.zone] + " IS OPEN.<br>EVERYTHING YOU FIRE BENDS NOW, AND THE WHITE ARENA IS GONE.";
  AU.sfx("rebirth");
  return true;
}

function tryCode() {
  var v = ($("codeInput").value || "").trim();
  if (v === "12345678987654321") {
    grantNextZone();
  } else if (v === "1234") {
    if (SAVE.boss) { $("codeNote").textContent = "THE TANK BOSS IS ALREADY OPEN"; AU.sfx("ui"); return; }
    SAVE.boss = true;
    saveNow();
    buildModes();
    $("codeNote").textContent = "THE TANK BOSS IS UNLOCKED";
    AU.sfx("win");
  } else if (v === "") {
    $("codeNote").textContent = "TYPE SOMETHING FIRST";
    AU.sfx("deny");
  } else {
    $("codeNote").textContent = "THAT IS NOT A CODE";
    AU.sfx("deny");
  }
}

/* ================================================================ LOOP ==== */
var DT = 1 / 60, acc = 0, last = 0;
function tickHud() {
  if (!G) return;
  $("hudMsg").textContent = paused ? "PAUSED" : (G.msgT > 0 ? G.msg : " ");
  var you = G.you;
  $("fireBtn").classList.toggle("cool", you.cd > 0);
  $("wallBtn").classList.toggle("cool", you.wallCd > 0);
  $("wallBtn").textContent = you.wallCd > 0 ? Math.ceil(you.wallCd) + "s" : "WALL";
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  var dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (!G) return;
  if ($("game").classList.contains("show") && !paused) {
    acc += dt;
    var steps = 0;
    while (acc >= DT && steps < 5) { updateWorld(DT); acc -= DT; steps++; }
    if (acc > DT) acc = 0;
  }
  if ($("game").classList.contains("show")) { drawFrame(); tickHud(); }
}

/* ================================================================ BOOT ==== */
function boot() {
  loadSave();
  resize();
  bindInput();
  bindMenu();
  buildModes();
  buildShop();
  show("menu");
  requestAnimationFrame(frame);
}
boot();

/* a small hook so the game can be driven without hands, for testing */
window.__tanks = {
  save: SAVE,
  start: function (mode, lvl) { playRound(mode, lvl); },
  g: function () { return G; },
  step: function (n) { for (var i = 0; i < (n || 1); i++) updateWorld(DT); },
  setPaused: function (v) { paused = !!v; },
  hold: function (o) { for (var k in o) IN.keys[k] = o[k]; },
  aimAt: function (x, y) { IN.usedMouse = true; IN.mx = x; IN.my = y; },
  fire: function () { IN.firePressed = true; },
  coins: function (n) { SAVE.coins = n; saveNow(); buildShop(); buildModes(); },
  rebirth: function () { doRebirth(); },
  buy: function (id) { own(id); SAVE.shopOpen = true; saveNow(); },
  equip: function (id) { SAVE.equip = id || ""; saveNow(); },
  maxOut: function () {
    SAVE.rate = RATE_LEVELS.length; SAVE.dmg = DMG_LEVELS.length;
    SAVE.shooters = SHOOTER_LEVELS.length; SAVE.speed = SPEED_LEVELS.length;
    saveNow(); buildShop(); buildModes();
  },
  giveUp: function () { giveUp(); },
  screen: function () { for (var i = 0; i < SCREENS.length; i++) if ($(SCREENS[i]).classList.contains("show")) return SCREENS[i]; return "?"; }
};
</script>
