<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Combat Dev Harness</title>
<style>
  :root { --bg: #101214; --fg: #e8e8e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101214; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #log { position: fixed; left: 8px; bottom: 8px; max-width: min(380px, 90vw); white-space: pre-wrap; opacity: .85; pointer-events: none; }
  #hud { position: fixed; left: 8px; top: 8px; pointer-events: none; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="log"></div>
<script type="module" src="./dev.js"></script>
</body>
</html>
